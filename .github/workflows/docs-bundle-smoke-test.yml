name: Docs Bundle Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs-bundle-smoke-test.yml"
      - "packages/cli/docs-preview/**"
      - "packages/cli/docs-resolver/**"
      - "packages/cli/cli/build.prod.mjs"
      - "packages/cli/cli/build.dev.mjs"
      - "docs-preview-smoke-test/**"
  pull_request:
    paths:
      - ".github/workflows/docs-bundle-smoke-test.yml"
      - "packages/cli/docs-preview/**"
      - "packages/cli/docs-resolver/**"
      - "packages/cli/cli/build.prod.mjs"
      - "packages/cli/cli/build.dev.mjs"
      - "docs-preview-smoke-test/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DO_NOT_TRACK: "1"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"

jobs:
  build-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Build CLI (prod)
        run: pnpm fern:build

      # The astro run uses the dev CLI, which downloads the Astro preview bundle
      # from the dev2 bucket (populated on every merge to fern-platform `app`).
      - name: Build CLI (dev)
        run: pnpm fern-dev:build

      # The build writes "catalog:" as the @boundaryml/baml version (pnpm-
      # specific) and `npm pkg fix` strips it. Resolve the real version from
      # the workspace catalog so `npm install` works in the smoke-test jobs.
      - name: Patch runtime dependencies in artifact package.json
        run: |
          BAML_VERSION=$(node -e "
            const fs = require('fs');
            const yaml = require('js-yaml');
            const ws = yaml.load(fs.readFileSync('pnpm-workspace.yaml', 'utf8'));
            const catalog = ws.catalog || {};
            console.log(catalog['@boundaryml/baml'] || '');
          ")
          echo "Resolved @boundaryml/baml version: $BAML_VERSION"

          for DIST in prod dev; do
            node -e "
              const fs = require('fs');
              const file = 'packages/cli/cli/dist/' + process.argv[2] + '/package.json';
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.dependencies = pkg.dependencies || {};
              pkg.dependencies['@boundaryml/baml'] = process.argv[1];
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            " "$BAML_VERSION" "$DIST"
            echo "Patched $DIST package.json:"
            cat "packages/cli/cli/dist/$DIST/package.json"
          done

      - name: Upload CLI artifact (prod)
        uses: actions/upload-artifact@v6
        with:
          name: fern-cli-prod
          path: packages/cli/cli/dist/prod/
          retention-days: 1

      - name: Upload CLI artifact (dev)
        uses: actions/upload-artifact@v6
        with:
          name: fern-cli-dev
          path: packages/cli/cli/dist/dev/
          retention-days: 1

  smoke-test:
    needs: [build-cli]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    name: smoke-test (${{ matrix.os }}, node ${{ matrix.node-version }})
    timeout-minutes: 45

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
          echo "Long paths enabled (LongPathsEnabled=1, git core.longpaths=true)"

      - name: Check Node.js version availability
        id: node-check
        shell: bash
        run: |
          NODE_VERSION="${{ matrix.node-version }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nodejs.org/dist/latest-v${NODE_VERSION}.x/")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "Node.js v${NODE_VERSION} is available"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Node.js v${NODE_VERSION} is not yet available (HTTP $HTTP_STATUS) — skipping"
          fi

      - name: Checkout repository
        if: steps.node-check.outputs.available == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: steps.node-check.outputs.available == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      # Each leg runs the suite twice: the prod CLI (`fern`, Next bundle) and the
      # dev CLI (`fern-dev`, `--astro` preview-SSR bundle from the dev2 bucket).
      - name: Download CLI artifact (prod)
        if: steps.node-check.outputs.available == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fern-cli-prod
          path: cli-dist/prod/

      - name: Download CLI artifact (dev)
        if: steps.node-check.outputs.available == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fern-cli-dev
          path: cli-dist/dev/

      # Simulate what a customer does: npm install -g fern-api
      # We use `npm pack` + `npm install -g <tarball>` because
      # `npm install -g ./cli-dist/` creates symlinks back to the local dir
      # and Node resolves modules relative to the symlink target, where
      # node_modules doesn't exist. A tarball install copies files into the
      # global prefix just like a registry install would.
      - name: Install CLIs globally
        if: steps.node-check.outputs.available == 'true'
        shell: bash
        run: |
          for DIST in prod dev; do
            echo "Packing $DIST CLI artifact into tarball..."
            (cd "cli-dist/$DIST" && npm pack)
            TARBALL=$(ls -t cli-dist/$DIST/*.tgz | head -n1)
            echo "Installing globally from $TARBALL (simulating npm install -g fern-api)..."
            npm install -g "$TARBALL"
          done
          fern --version || echo "fern --version exited with $?"
          fern-dev --version || echo "fern-dev --version exited with $?"

      # The smoke-test docs use a custom component that imports a third-party
      # library, which the CLI bundles at docs-build time (resolved from the
      # docs project's node_modules).
      - name: Install docs project dependencies
        if: steps.node-check.outputs.available == 'true'
        shell: bash
        run: |
          cd docs-preview-smoke-test/fern && npm install

      - name: Install Playwright
        if: steps.node-check.outputs.available == 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          cd docs-preview-smoke-test/playwright && npm install && npx playwright install chromium

      - name: Run smoke tests (next, with server restart on crash)
        if: steps.node-check.outputs.available == 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          FERN_NO_VERSION_REDIRECTION: "true"
          FERN_BIN: fern
          FERN_DOCS_DEV_ARGS: ""
          SMOKE_RENDERER: next
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            bash docs-preview-smoke-test/run-smoke.sh

      - name: Upload Playwright report (next)
        uses: actions/upload-artifact@v6
        if: always() && steps.node-check.outputs.available == 'true'
        continue-on-error: true
        with:
          name: smoke-test-playwright-report-next-${{ matrix.os }}-node${{ matrix.node-version }}
          path: docs-preview-smoke-test/playwright/playwright-report/
          retention-days: 7

      - name: Run smoke tests (astro, with server restart on crash)
        # Run even if the Next run failed so each renderer gets independent coverage
        if: ${{ !cancelled() && steps.node-check.outputs.available == 'true' }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          FERN_NO_VERSION_REDIRECTION: "true"
          FERN_BIN: fern-dev
          FERN_DOCS_DEV_ARGS: "--astro --log-level debug"
          SMOKE_RENDERER: astro
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            bash docs-preview-smoke-test/run-smoke.sh

      - name: Upload Playwright report (astro)
        uses: actions/upload-artifact@v6
        if: always() && steps.node-check.outputs.available == 'true'
        continue-on-error: true
        with:
          name: smoke-test-playwright-report-astro-${{ matrix.os }}-node${{ matrix.node-version }}
          path: docs-preview-smoke-test/playwright/playwright-report/
          retention-days: 7

      - name: Print fern docs dev logs
        if: failure() && steps.node-check.outputs.available == 'true'
        shell: bash
        run: cat /tmp/fern-docs-dev.log 2>/dev/null || echo "No dev server log found"

      - name: Print fern debug log
        if: always() && steps.node-check.outputs.available == 'true'
        shell: bash
        run: |
          echo "=== Fern debug logs ==="
          for f in ~/.fern/logs/*.debug.log; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
              echo "--- end $f ---"
            fi
          done

      - name: Stop fern docs dev server
        if: always() && steps.node-check.outputs.available == 'true'
        shell: bash
        run: |
          if [ -f /tmp/fern-server.pid ]; then
            kill "$(cat /tmp/fern-server.pid)" 2>/dev/null || true
          fi
