        run: pnpm turbo run test --filter=@fern-api/cli-dynamic-snippets

  cli-runtime:
    # Runs on a Rust-enabled runner (ubuntu-latest ships cargo), so the committed --schema golden can
    # be regenerated from the real runtime and the cargo-gated --dry-run tests execute. Triggered when
    # the CLI snippets package OR the Rust naming source changes, catching runtime naming drift.
    needs: [changes]
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.cliRuntime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: Regenerate --schema golden and fail on drift
        run: |
          node generators/cli/dynamic-snippets/scripts/generate-schema-golden.mjs
          git diff --exit-code -- generators/cli/dynamic-snippets/src/__test__/fixtures \
            || (echo "::error::The committed --schema golden is stale. Regenerate it with scripts/generate-schema-golden.mjs and commit the result." && exit 1)

      - name: 🧪 Build
        run: pnpm turbo run compile --filter=@fern-api/cli-dynamic-snippets

      - name: 🧪 Test (cargo present → --dry-run e2e runs)
        run: pnpm turbo run test --filter=@fern-api/cli-dynamic-snippets
