# TEMPORARY: one-off benchmark of `fern docs dev` (Next) vs `--astro`; removed before merge.
name: Docs Dev Bench (temporary)
on:
  push:
    branches: ["devin/1791475302-smoke-both-renderers"]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: cd docs-preview-smoke-test/fern && npm install
      - run: nproc; free -g; bash docs-preview-smoke-test/bench.sh
