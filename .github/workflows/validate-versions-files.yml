name: Validate versions.yml files

on:
  pull_request:
  workflow_dispatch:

env:
  DO_NOT_TRACK: "1"

jobs:
  validate:
    name: Validate versions.yml files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            packages/cli/cli

      - name: Validate cli versions.yml
        uses: dsanders11/json-schema-validate-action@v2.0.0
        with:
          schema: "fern-versions-yml.schema.json"
          files: "packages/cli/cli/versions.yml"
