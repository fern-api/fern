# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    `@file` / `@data://` references inside repeated object flags (for example
    `--attachments '{"content":"@data://a.txt","filename":"a.txt"}'`) are now
    read like they are for single-value and `--json` input, and a missing file
    fails before the request is sent. Previously the reference text was sent
    as-is.
  type: fix
- summary: |
    Body properties and array items wrapped in a one-option `oneOf`/`anyOf`
    (`oneOf: [$ref: Model]`) are now treated as the wrapped object, so their
    flag accepts JSON and gets dot-notation leaf flags. Previously the JSON was
    sent as a string and rejected with "Expected object".
  type: fix
- summary: |
    Null fields are no longer printed in human-readable API error details
    (`code: null`) or as empty rows in single-object table output. JSON output
    is unchanged.
  type: fix
