# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    Add the `x-fern-cli-table` OpenAPI operation extension. It sets the
    columns that `--format table` shows for that command: header, field
    path (after `x-fern-sdk-return-value` extraction), order, alignment,
    max width, `format: date`, and optional columns hidden by default.
    Commands with the extension get a `--columns` flag (`--table-columns`
    when the operation already has a `columns` parameter) to pick columns
    (`name,stage`), add or remove them (`+description,-v`), or show every
    field (`all`). `--query` and the JSON, YAML, CSV, JSONL and raw formats
    are unchanged and keep the full response. Commands without the
    extension print the same tables as before.
  type: feat
