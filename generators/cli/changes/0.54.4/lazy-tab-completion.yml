# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    TAB completion under a top-level command (e.g. `<cli> core <TAB>`) now loads only the specs mounted under
    that command (plus unprefixed ones) instead of every embedded spec, and skips specs entirely under custom or
    built-in commands. Completing the first word (`<cli> <TAB>`) lists spec-mounted commands from their prefixes
    and only parses specs whose metadata could describe the top-level group; custom and built-in commands are
    listed as before. On a 60-spec CLI this cuts a TAB from ~0.25s to 0.01–0.05s under a command and to ~0.09s
    for the first word. Normal command runs are unchanged.
  type: fix
