# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    Shell completion is now dynamic, so TAB no longer hangs on large CLIs. `<cli> completion <shell>` used to print
    a static script containing the whole command tree (14MB for zsh on a ~13.7k-command CLI, which took zsh over a
    minute to parse on the first TAB). It now prints a ~1KB script that asks the binary for the candidates of the
    current word on each TAB (via `<CLI>_COMPLETE=<shell>`), so the script never goes stale after an upgrade. The
    zsh script works both sourced from `.zshrc` and installed as `_<cli>` in `$fpath`. JSON specs are also parsed
    with serde_json instead of the YAML parser, roughly halving startup on CLIs with many embedded specs.
  type: fix
