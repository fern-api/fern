# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    `packageIdentity` now reaches the published npm package. The launcher's
    `package.json` carried only name/version/bin/optionalDependencies plus a
    hardcoded description, so npm rendered the CLI as "License: none" with no
    keywords, homepage or author — while the same config already populated
    `Cargo.toml`. The license is the part that matters: dependency scanners and
    corporate policy gates reject unlicensed packages. `authors[0]` becomes npm's
    single `author` and the rest `contributors`.
  type: fix

- summary: |
    Query- and path-parameter values are type-checked locally. `--limit nope`
    used to serialize as `?limit=nope` and fail at the API; it now fails
    immediately naming the flag and the expected type. Only numeric and boolean
    types are enforced — `string` accepts anything (it is what the wire carries)
    and arrays/objects are left to the style-aware serializer — so the check
    catches typos without rejecting requests a server would accept.
  type: fix

- summary: |
    `--schema` advertises `httpMethod` and `path` again, per ADR-0006's
    2026-08-28 amendment. They were dropped as HTTP-execution detail, but they
    are how an agent tells a read from a write *before* running a command, which
    is a safety property rather than plumbing. Additive — the `{globalFlags,
    operations}` shape, the `parameters` to `input` rename and the capability
    hints are unchanged.
  type: fix

- summary: |
    A `license: MIT` entry in `generators.yml` now emits a matching LICENSE.
    Fern's `LicenseConfig.Basic` mounts no file, so no generator honored it and
    a repo publishing to npm as MIT shipped no LICENSE at all. The copyright
    holder comes from `packageIdentity.authors[0]`, falling back to the
    organization; when neither is known nothing is written, since a copyright
    line naming nobody is worse than no file. `Apache-2.0` is left to
    `license: { type: custom }`.
  type: fix

- summary: |
    `--schema` and `--help` report the real element type of an array-typed
    query, header or path parameter. Only body arrays carried one, so both
    renderers fell back to the container type: `--schema` advertised
    `items: {"type": "array"}` — an array of arrays — and `--help` showed
    `<JSON_ARRAY>` where a single element belongs. All three spellings now
    resolve: inline `type: array`, a `$ref` to an array component, and
    `anyOf: [array, null]`; anything that still doesn't resolve reports
    `string` rather than the container type. Advertisement-only: the value
    collector branches on the element type being something other than
    `string`, so no request changes on the wire — verified against two
    customer specs (56 array parameters, 4 input forms each).
  type: fix
