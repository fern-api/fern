- summary: |
    `profiles set <name> …` now asks "Profile `<name>` doesn't exist. Would you
    like to create it? [y/N]" when the profile is missing and stdin and stderr are
    terminals. If an existing profile has a similar name, the question adds
    "Did you mean `<closest>`?" so a mistyped name is caught before anything is
    written. Answering no changes nothing. `--yes` skips the question; when stdin
    or stderr is not a terminal (scripts, agents) the profile is still created
    without a prompt.
  type: feat
