# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    Send exactly one credential per request and stop rewriting server errors.

    A credential declared as a global header rather than an auth scheme was a
    parameter injection the auth layer never saw. Generated CLIs sent it
    alongside a stored OAuth token — which APIs offering both styles reject —
    and reported every 403 as a synthesized `401 authError` telling the user to
    re-authenticate, discarding the server's own explanation.

    Such a header is now promoted to a real scheme when an explicit declaration
    identifies it (a declared `apiKey`/header security scheme naming it, or a
    per-generator `auth-schemes` binding). Its reach is unchanged: it still goes
    out on every request, including `security: []` operations, and is withheld
    only where the auth layer already selected a credential of its own.

    A global header with no declaration at all now participates in that last
    rule on the strength of its name (`authorization`, `*api-key*`,
    `*access-token`, …). This is subtractive only — the header is never sent
    anywhere it isn't sent today, and a CLI with no other credential never
    selects one, so nothing changes for it. Set
    `nonCredentialHeaders: ["<header>"]` in the generator's `config` to exempt
    a header whose name matches but which carries something else.

    Cross-scheme selection now follows the documented source precedence — flag,
    then environment, then stored login, then file (ADR-0008) — with
    registration order breaking ties only, and a stored login that expired with
    no cached refresh token no longer counts as a credential, so it can't block
    a command when another scheme holds a usable one. `auth status` and the
    generated README disclose the promoted credential, the active source, and
    what it shadows.

    Behavior changes for generated CLIs: a 403 now surfaces the server's status,
    message and reason with exit code 1 instead of a synthetic 401 with exit
    code 2, and a CLI with two credentials at different source ranks may now
    send the other one.
  type: feat
