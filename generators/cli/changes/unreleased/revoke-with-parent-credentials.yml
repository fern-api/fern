- summary: |
    `profiles remove` signs the API-key revoke with the parent credentials from env when they are set,
    and falls back to the profile's stored key only when they aren't. Twilio rejects a standard API key
    on its Keys endpoint (error 70004), so revoking with the stored key failed there.
    When the revoke fails after the interactive "Also delete this profile's API key" prompt, the profile
    is still removed and the key SID is printed so it can be deleted from the console. An explicit
    `--revoke` still stops on failure.
  type: fix
