- summary: |
    Honor `api.auth: any: [...]` from `generators.yml`. The generated `main.rs` now
    emits `.auth_strategy(AuthStrategy::Any)` (or `::Routing` for endpoint-level
    security) from the IR's `auth.requirement`, so an OAuth client-credentials
    scheme declared only in `generators.yml` is applied to every authenticated
    command instead of being skipped by per-operation `security` routing.
  type: fix
