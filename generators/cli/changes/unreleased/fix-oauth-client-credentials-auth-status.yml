- summary: |
    `auth status` now lists the env vars an OAuth2 client-credentials scheme reads (e.g. `OAUTH_CLIENT_ID`,
    `OAUTH_CLIENT_SECRET`, plus any required custom token-endpoint properties) with their active/missing state,
    instead of reporting `(no credential sources bound)`. Multi-value schemes (OAuth2 client credentials, basic
    auth) are now modelled as independent credential slots: each slot resolves on its own, so a username and
    password that are both set are both shown as active rather than one shadowing the other, and `logged_in`
    in `--output json` is true only when every slot resolves.
  type: fix
