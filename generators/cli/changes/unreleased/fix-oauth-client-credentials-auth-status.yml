- summary: |
    `auth status` now lists the env vars an OAuth2 client-credentials scheme reads (e.g. `OAUTH_CLIENT_ID`,
    `OAUTH_CLIENT_SECRET`, plus any required custom token-endpoint properties) with their active/missing state,
    instead of reporting `(no credential sources bound)`. A valid cached access token is reported alongside
    those env vars — it satisfies the scheme on its own, but the env vars stay visible so you can still tell
    whether they were picked up. Multi-value schemes (OAuth2 client credentials, basic auth) are now modelled
    as independent credential slots: each slot resolves on its own, so a username and password that are both
    set are both shown as active rather than one shadowing the other, and `logged_in` in `--output json` is
    true only when every slot resolves (or a standalone alternative does).
  type: fix
- summary: |
    `auth status` no longer suggests `auth login --with-token` for schemes that never read the keyring
    (OAuth2 client credentials, basic auth) — a token pasted there would have been silently ignored at
    request time. It now names the env vars to set instead.
  type: fix
