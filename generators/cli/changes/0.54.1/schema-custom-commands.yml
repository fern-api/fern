# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    `--schema` now describes hand-written commands registered with `CliApp::command` / `command_under`
    (including their typed variants). Previously `<cli> <custom-command> --schema` failed with
    `discoveryError` (exit 4) because `--schema` is answered before custom commands are added to the
    command tree, so agents using `--schema` for discovery could not see them even though `--help` worked.
    A custom command's path now returns `{command, description, flags}` built from its clap definition
    (aliases resolve, and a command that runs on its own but also has subcommands is described too), a
    custom-only group returns its commands as an array, a spec group's array also lists the custom
    commands under it, and root `--schema` gains a `customCommands` array when any are registered. A
    custom command that replaces a spec operation on the same path now owns that path's schema, matching
    what runs. Hidden custom commands are left out of listings but can still be described by path. Flag entries (here and in `builtinCommands`) now also carry `type: boolean` for switches, `enum`
    for restricted values and `multiple` for repeatable flags, and short-only flags are reported as flags
    rather than positional arguments.
  type: fix
