- summary: |
    Saving or deleting a credential no longer reads the stored secret first. On macOS, `profiles remove`,
    `auth logout`, and overwriting a saved credential used to read every keychain entry before changing
    it, and each read could raise a password prompt. The CLI now updates or deletes the keychain item
    directly, and it skips the Windows-only check for oversized entries on macOS and Linux.
  type: fix
