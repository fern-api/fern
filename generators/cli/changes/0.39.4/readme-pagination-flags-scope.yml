- summary: |
    The generated README and `reference.md` no longer list `--page-all` / `--page-limit` under the flags
    "available on every operation". Since 0.38.6 those flags are only registered on operations the spec
    describes how to page (`x-fern-pagination`, or a root `page_token` parameter), so the docs now list them
    in a separate table introduced by "Operations the spec describes how to page ... also accept:" instead of
    promising them everywhere. The previously undocumented `--page-delay` / `--no-pager` (paginated
    operations), `--no-stream` (streaming operations) and `--no-extract` / `--no-retry` (every operation) are
    now documented alongside them.
  type: fix
