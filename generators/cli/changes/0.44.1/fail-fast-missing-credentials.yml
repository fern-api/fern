- summary: |
    A command whose operation requires authentication (its own `security:` or
    the spec-level default) now fails locally with "Authentication credentials
    are missing, so the request was not sent. Set ..." when no configured
    credential source (flag, env var, or selected profile) satisfies any of its
    security requirements, instead of sending an unauthenticated request and
    surfacing the server's 401. Applies with and without `--debug`. Operations
    with `security: []`, optional auth (`- {}`), no declared security, or an
    auth header or `apiKey` query parameter passed explicitly as a parameter
    still go out as before.
  type: fix
