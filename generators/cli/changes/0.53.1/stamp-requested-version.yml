# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    `fern generate --version <v>` (and SDK Config's `sdkVersion`) is now stamped into the generated CLI for
    local-file-system output. That output runs in `downloadFiles` mode, whose generator config carries no
    version, so the root `Cargo.toml`, its `Cargo.lock` entry, and `<cli> --version` always reported `0.0.0`.
    The generator now falls back to the IR's `generationMetadata.requestedVersion` (semver only; `AUTO` and
    non-semver values are ignored). The embedded `<cli>-sdk` and `<cli>-types` crates (including split type
    crates) now carry the same version, so the SDK's `X-Fern-SDK-Version` header matches the CLI instead of a
    fixed `0.1.0`. With no version supplied, output is unchanged (`0.0.0` root and types, `0.1.0` SDK).
  type: fix
