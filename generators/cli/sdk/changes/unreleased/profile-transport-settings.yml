- summary: |
    Profiles can now store the transport settings that were previously
    env/flag-only: `profiles set <name> <PREFIX>_TIMEOUT_SECS=…`,
    `<PREFIX>_PROXY=…`, `<PREFIX>_CA_BUNDLE=…`, `<PREFIX>_INSECURE=…`, and
    `<PREFIX>_USER_AGENT_SUFFIX=…` persist to `profiles.toml` (inherited
    through `parent`, shown by `profiles show`/`current`). Precedence is
    unchanged — flag > env var > profile > default — so a shell-exported
    global still overrides the profile's value. The root `--help` footer marks
    these five as profile-storable.
  type: feat
