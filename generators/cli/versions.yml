- version: 0.30.0
  changelogEntry:
    - summary: |
        Emit login-capable CLIs for public-client OAuth flows. An `authorization-code` (PKCE) OAuth
        scheme now generates a `PkceLoginFlow` and a `device-code` scheme a `DeviceCodeLoginFlow`,
        registered via `CliApp::login_flow(...)` so `<bin> auth login` runs the browser / device
        flow, tokens are stored in the OS keyring, and requests get `Authorization: Bearer <token>`
        with refresh-on-expiry. A configured loopback `redirect-uri` pins the callback host, path,
        and port exactly (both `127.0.0.1` and `localhost` are honored, along with a custom path)
        so it matches the authorization server's registered redirect; the object form
        (`{ url, ports }`) adds backup ports tried in order when the primary is busy, and omitting
        it binds an ephemeral (OS-assigned) port per RFC 8252 §7.3. Extra literal parameter maps
        (`authorizationParameters` / `tokenParameters` / `refreshParameters` /
        `deviceAuthorizationParameters` — e.g. an Auth0 `audience`) are appended to the respective
        requests, with protocol-reserved keys skipped. Environment-variable client IDs and the IR's
        `refreshUrl` / `tokenHeader` / `tokenPrefix` fields are not yet consumed and are skipped.
      type: feat
  createdAt: "2026-07-28"
  irVersion: 67
- version: 0.29.1
  changelogEntry:
    - summary: |
        Fix the built-in `auth login` / `logout` / `status` commands shadowing a spec-owned
        `auth` resource group, which made every `<bin> auth <op>` operation undispatchable
        ("unrecognized subcommand") even though `--schema` and `reference.md` advertised it.
        Built-in commands are now folded into a same-named generated group instead of
        replacing it, so `<bin> auth login` and `<bin> auth me` both work; only
        `login` / `logout` / `status` are intercepted by the framework.
      type: fix
  createdAt: "2026-07-30"
  irVersion: 67
- version: 0.29.0
  changelogEntry:
    - summary: |
        Add `customConfig.packageIdentity` so the generated crate's `[package]` block
        (`name`, `description`, `license`, `repository`, `homepage`, `authors`,
        `keywords`) can be templated from the customer's own metadata instead of
        shipping Fern's SDK-template identity (`fern-cli-sdk`,
        `github.com/fern-api/cli-sdk`). A `name` override renames the matching
        `Cargo.lock` entry in the same pass, so `cargo build --locked` still
        resolves. The `[lib]` name (`fern_cli_sdk`) is unchanged — the vendored
        `src/` tree imports through it. Omitting the field keeps today's output
        byte-for-byte.
      type: feat
  createdAt: "2026-07-29"
  irVersion: 67
- version: 0.28.1
  changelogEntry:
    - summary: |
        Fix generated wire tests failing with "unrecognized subcommand" for specs
        mounted under a namespace whose leaf matches a top-level resource name. The
        wire-test harness now mirrors the SDK's `merge_into_path` stutter elision, so
        an untagged spec grouped under its version path prefix (e.g. `v1`) resolves to
        `<bin> v1 <op>` instead of the double `<bin> v1 v1 <op>` that clap rejects.
      type: fix
