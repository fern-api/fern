# yaml-language-server: $schema=../../fern-versions-yml.schema.json
- version: 0.38.6
  changelogEntry:
    - summary: |
        Retries no longer treat a self-generated `Idempotency-Key` as a licence to
        retry. Because the key is generated for every POST/PUT/PATCH, every
        non-idempotent operation was retry-eligible and a 5xx on a create retried
        ~4x against endpoints with no idempotency support. Retry-safety now
        requires either `x-fern-idempotent: true` (the spec declaring server-side
        support) or an explicit `--idempotency-key`. The auto key is still sent.
      type: fix
    - summary: |
        `x-fern-idempotent: true` no longer suppresses the auto `Idempotency-Key`.
        The marker only means the operation *exposes* `--idempotency-key`, but it
        was read as "the caller supplies one" — so a marked operation invoked
        without the flag retried with no key at all, while the same operation
        without the marker got one. A key is now always sent on POST/PUT/PATCH
        unless the caller supplied their own or `x-fern-cli-idempotency: false`
        opts out.
      type: fix
    - summary: |
        Request-body validation now checks properties behind a `$ref`. The
        validator only had an object branch, so a `$ref` to a scalar or array
        component was accepted whatever its value — on specs where most schemas
        are component refs this meant validation was effectively off, and
        `--dry-run` exited 0 on a malformed body. Bare-`$ref` component chains are
        now followed too (bounded, so a cycle fails closed).
      type: fix
    - summary: |
        Parameters declared as a bare `$ref`, or as `anyOf: [T, null]` (pydantic's
        `Optional[T]`), now resolve through component schemas, so they keep their
        type, `enum`, `format` and numeric bounds instead of arriving untyped.
        Array-typed parameters in any of those spellings are now repeatable:
        `--labels a --labels b` works, and a single JSON-array argument is
        equivalent. Previously a JSON array on such a parameter went on the wire
        URL-encoded as `?x=%5B%22a%22%5D`. A single value is still sent as `?x=a`,
        and a true union (more than one non-null branch) is left untouched.
      type: fix
    - summary: |
        `--page-all` / `--page-limit` / `--page-delay` / `--no-pager` are only
        registered on operations the spec describes how to page. They were
        advertised everywhere, and on a spec with no pagination metadata the
        executor fell back to guessing `pageToken` / `nextPageToken`: one request
        went out and the command exited 0 with page 1 — silent partial data.

        Note for consumers: on a spec with no pagination metadata these flags now
        disappear from every operation, so a script or agent already passing
        `--page-all` goes from exit 0 (having silently received one page) to a
        hard "unexpected argument" error. Nothing that previously worked breaks,
        but the failure is now loud rather than silent.
      type: fix
    - summary: |
        The generated npm launcher now exits non-zero when the binary dies on a
        signal. `execFileSync` reports a signal death with `status: null`, which
        the launcher passed to `process.exit`, and Node coerces that to 0 — so CI
        timeouts (SIGTERM), SIGSEGV and OOM-kills all reported success. Signal
        deaths now exit 128+signum (SIGTERM to 143).
      type: fix
    - summary: |
        Any SemVer pre-release now publishes to npm under a non-latest dist-tag.
        Only `-alpha` and `-beta` were matched, so a `v1.1.0-rc.1` or `-next.1`
        tag fell through to a bare `npm publish` and would move `latest` to a
        pre-release. The tag is derived from the first pre-release identifier.
      type: fix
    - summary: |
        The custom-command SDK bridge seeds the co-generated SDK's `base_url` from
        the CLI's own resolution. `ClientConfig::default()` carries an empty
        `base_url` for any API that declares no environment, so `sdk::client(ctx)`
        produced a client with no host and every custom command failed on a
        relative URL before the injected executor could help. A spec that declares
        its server per-operation rather than at the root is resolved too.
      type: fix
    - summary: |
        Generated skills now tell agents to verify auth with `<cli> auth status`
        rather than `<cli> --help`, which reads no credentials and so confirmed
        nothing.
      type: fix
    - summary: |
        npm platform binaries are built with the `dist` cargo profile, the same one
        cargo-dist uses for the GitHub Release. `ci.yml` built `--release` while
        `release.yml` built `--profile dist`, so the two channels shipped different
        bytes under one version tag.
      type: fix
    - summary: |
        Generated CLI repos no longer ship the vendored runtime's Apache-2.0
        `LICENSE` by default, which contradicted the `license` field
        `packageIdentity` writes into `Cargo.toml`. A LICENSE is now emitted only
        when one is configured (`license: { type: custom }`), matching every other
        Fern generator; a basic license remains package metadata only.
      type: fix
    - summary: |
        The generated README carries an Attribution section naming the vendored
        `fern-cli-sdk` runtime and its Apache-2.0 license. The runtime's source is
        copied into every generated repo, and Apache-2.0 requires retaining that
        notice; carrying it in the README keeps it without shipping a LICENSE file
        that contradicts the repo's own declared license.
      type: fix
    - summary: |
        The shared `generate-skills` prerequisite file no longer documents flags the
        spec cannot produce. `-o, --output` and the pagination flags are emitted
        only when some operation actually registers them, and the pointer at
        `--schema`'s `paginable` / `binaryResponse` hints is emitted only when those
        hints can appear. On an API with neither, step one of the file was
        unfollowable — it named a flag the parser rejects.
      type: fix
    - summary: |
        Generated skills state the real `--format` default (`table` on a TTY,
        `json` when piped) instead of `json`, and tell agents to set **one** of
        several alternative auth schemes rather than exporting every environment
        variable — which set up the exact credential shadowing the CLI's own auth
        errors warn about.
      type: fix
    - summary: |
        Auth failures name only the credential sources that actually hold a value,
        and the "check for shadowing" advice appears only when more than one source
        is populated. Listing every *declared* source meant a CLI with two schemes
        named four places when one supplied the credential, then sent the user
        hunting for a conflict that could not exist.
      type: fix
    - summary: |
        `--schema`'s `globalFlags` lists `--params`, `--no-retry`, `--no-extract`
        and `--help`. All four are registered on every operation, so an agent
        coding against `--schema` had no way to discover they existed.
      type: fix
    - summary: |
        `--schema` and `--help` advertise the real element type of an array body
        property. A repeated flag carries `type: string` because that is the flag
        surface, which was rendered as `items: {type: string}` even for an array of
        objects — an agent following the contract sent `["x"]` and the request was
        rejected. Each occurrence of such a flag is now JSON-decoded, so
        `--inputs '{...}' --inputs '{...}'` builds an array of objects; plain
        string arrays are unchanged.
      type: fix
    - summary: |
        `--schema`'s `input.required` no longer disagrees with the validator. An
        object-valued body property the parser recurses into kept a clap-optional
        shorthand flag (leaf flags can satisfy it) but was also dropped from the
        advertised required list, so a caller could supply every field `--schema`
        named and still be rejected for one it never mentioned.
      type: fix
    - summary: |
        `--schema` no longer advertises a required parent object alongside its
        required dotted leaves. The executor rejects combining `--a` with `--a.b`,
        so listing both made the contract unsatisfiable — following it verbatim
        produced "Cannot combine". The ancestor is dropped; the required leaves
        already imply it. A required parent with no required leaves is unaffected.
      type: fix
    - summary: |
        `--help` shows the real element type for a repeated flag, so an
        array-of-objects flag reads `<JSON_OBJECT>` rather than `<STRING>`.
      type: fix
    - summary: |
        `--schema` includes `multipart/form-data` body fields. They live in
        `method.multipart_fields` rather than `method.parameters`, so an upload
        operation advertised only its query parameters and headers with an empty
        `required` — the flags existed and worked but were undiscoverable, making
        every multipart operation uninvokable by an agent driving from the
        contract. File parts carry `file: true` so an agent knows to pass a path,
        and a per-part `contentType` surfaces when the spec pins one.
      type: fix
  createdAt: "2026-08-27"
  irVersion: 67
- version: 0.38.5
  changelogEntry:
    - summary: |
        Resolve OpenAPI server variables and `x-fern-default-url` instead of sending the raw
        URL template. The runtime spec parser dropped `servers[].variables` and
        `x-fern-default-url`, so a server such as `https://api.{region}.twilio.com` reached
        reqwest with a literal `{region}` and failed with "Parsed Url is not a valid Uri".
        Each spec-declared server variable now surfaces as a global flag (carrying the
        variable's `default`, `description` and `enum`), and when the caller pins no
        variable the server's `x-fern-default-url` is used. Applies to per-operation
        `servers:` entries too.
      type: fix
    - summary: |
        Send API-wide headers (the `headers:` block / `x-fern-global-headers`) on every
        request. They live in the IR's `headers` rather than `globalParameters` and were
        never emitted into the generated CLI, so a header declared with `env` and
        `client-default` was silently absent from requests. They are now lowered to
        header-location global parameters with `auto` apply, preserving `env`,
        `client-default` and optionality; a `globalParameters` entry targeting the same
        header still wins.
      type: fix
  createdAt: "2026-08-27"
  irVersion: 67
- version: 0.38.4
  changelogEntry:
    - summary: |
        Includes Rust SDK Generator 0.46.4 updates.
      type: fix
    - summary: |
        Fix generated CLI failing to compile when a property is named `self`, `Self`, `crate` or `super`.
        Rust rejects these as raw identifiers, so they are now suffixed with an underscore (`self_`)
        and given an explicit `#[serde(rename = "self")]` to preserve the wire name.
      type: fix
  createdAt: "2026-08-25"
  irVersion: 67
- version: 0.38.3
  changelogEntry:
    - summary: |
        An `x-fern-global-headers` / `x-fern-global-parameters` entry whose flag
        name collides with a per-operation parameter is now honored on custom
        commands. Colliding globals are registered per-leaf rather than globally,
        and the custom-command path resolves them from the root `ArgMatches`, so
        the value was stamped on spec-derived requests and silently dropped on
        hand-written ones. Such a global now falls back to its `env` var and
        `default` (the CLI flag is not registered on those commands, so this is the
        full chain that was ever reachable).
      type: fix
    - summary: |
        A body property spelled `anyOf: [$ref Model, null]` now emits the same
        dot-notation leaf flags as a bare `$ref: Model` (e.g.
        `--voice-settings.stability`), not just the JSON shorthand. The parent flag
        keeps its `null` sentinel. Nullable *array* branches are unaffected — they
        stay a single repeated flag, matching a plain `type: array` property.
      type: fix
    - summary: |
        Array-typed `multipart/form-data` fields are now repeatable
        (`--files a.mp3 --files b.mp3`), each occurrence becoming its own part with
        the same wire name. Multipart fields named in `--params` are routed into the
        form body instead of the query string, and a JSON array there is equivalent
        to repeating the flag.
      type: fix
    - summary: |
        `anyOf: [$ref, null]` / `oneOf: [$ref, null]` body properties — what
        FastAPI/pydantic emits for every `Optional[Model]` field — now resolve to
        their non-null branch's type, so nullable objects and arrays are sent as
        JSON instead of an escaped string. Explicit `null` remains accepted. True
        unions with more than one non-null branch are left untouched.
      type: fix
    - summary: |
        A `const` on an optional body property is no longer injected into the
        request body as a clap default; it stays documentation- and
        validation-only. Required consts are still sent. This also unblocks
        object-shorthand flags on const-bearing nested schemas, which previously
        failed with "Cannot combine --a.b with --a.b.c".
      type: fix
  createdAt: "2026-08-25"
  irVersion: 67
- version: 0.38.2
  changelogEntry:
    - summary: |
        Includes Rust SDK Generator 0.46.3 updates.
      type: fix
  createdAt: "2026-08-25"
  irVersion: 67
- version: 0.38.1
  changelogEntry:
    - summary: |
        Fixed `auth login` failing on Windows with "keyring set failed: Attribute
        'password encoded as UTF-16' is longer than platform limit of 2560 chars".
        Large OAuth token bundles are now transparently split across multiple
        Windows Credential Manager entries and reassembled on read, so credentials
        stay in the OS keyring. A partially written entry set is detected on read
        and reported as a missing credential rather than a corrupt token. Only
        Windows writes split entries — macOS Keychain and secret-service have no
        such limit and keep storing credentials exactly as before. Existing
        credentials remain readable.
      type: fix
  createdAt: "2026-08-24"
  irVersion: 67
- version: 0.38.0
  changelogEntry:
    - summary: |
        Generated CLI READMEs now include a "CLI generated by Fern" shield in the
        header, matching the branding SDK READMEs already carry. The shield is
        omitted for orgs configured for white-labeling.
      type: feat
  createdAt: "2026-08-22"
  irVersion: 67
- version: 0.37.0
  changelogEntry:
    - summary: |
        The "no credentials" hint is no longer tied to 401/403. The condition it
        describes — this request went out carrying nothing — has nothing to do with
        the status code, but the hint was gated on those two, so an API that
        expresses "not authenticated" any other way said nothing useful. ElevenLabs
        answers 404 for a workspace scoped to the anonymous principal (deliberate: a
        401 would confirm the resource exists), so a logged-out user read
        `Workspace 1anonymous1 not found` with no indication that the fix was
        `auth login`.

        Any failed status now carries a `No credentials were sent with this
        request. Set ...` note in `error.help` when the provider had nothing for
        that endpoint. This only annotates: the error keeps its class and exit code,
        and the request is still sent, because the server — not the spec — is the
        authority on whether an endpoint needed auth. Public endpoints are
        unaffected, and 401/403 still escalate to `error[auth]` with exit 2.
      type: fix
    - summary: |
        The "check for shadowing" advice on a rejected credential now appears only
        when there is more than one visible credential source. Shadowing means one
        source silently outranking another, which cannot happen with a single
        source — yet the note sent every user to `auth status` to compare a list of
        one against itself. On a scope failure (`OAuth token does not have required
        permissions: user_read`) that was worse than noise: the credential is the
        right one from the right place, and the advice points away from the real
        fix. The source is still named whenever credentials were sent, since knowing
        which one was used is useful either way.
      type: fix
    - summary: |
        Transport failures no longer report a fabricated HTTP status. A request that
        never reached a server — DNS, TLS, connection refused, timeout — was folded
        into the generic internal-error shape and emitted `code: 500` with
        `reason: "internalError"`, telling a consumer the *API* had failed and
        inviting a retry against a host that was never contacted. These now produce
        `reason: "networkError"` and **no** `code` field, since the field is
        documented as the HTTP status and there is none. Exit code is unchanged at
        5, and the human rendering is labelled `error[network]:`.

        The message also keeps the part that matters: `reqwest` stops at "error
        sending request for url (...)" and buries "Connection refused" two levels
        down its `source()` chain, so the chain is now walked and joined. SDK-mode
        CLIs report network and timeout failures the same way as OpenAPI-mode ones.
      type: fix
    - summary: |
        `auth status` now honors the global `--format`. It gated JSON output on its
        own `--json` boolean, so `auth status --format json` printed the human table
        with no error and no hint — the first command an agent runs, silently
        ignoring the flag it uses everywhere else. `--format`, `--human`, the
        `<NAME>_OUTPUT` env var and the piped default now all apply; `--json`
        remains as an alias so existing scripts keep working.
      type: fix
    - summary: |
        Fixed a literal `<bin>` placeholder appearing in credential hints. The
        keyring source rendered `populated by \`<bin> auth login\`` instead of naming
        the binary. CLIs using an OAuth login flow were unaffected — that provider
        overrides the hint and substituted correctly — so the placeholder only
        reached users on bearer, header and basic schemes.
      type: fix
    - summary: |
        `error.details` no longer repeats the sentence already reported in
        `error.message`. The parsed server body is still carried structurally, so
        fields a consumer cannot get anywhere else — `request_id`, a validation
        error's `loc`, a GraphQL error's `path`/`extensions` — are unchanged, but the
        one field the message was lifted from is removed, and `details` is
        omitted entirely when the body said nothing beyond that message (so
        `{"detail": "Not Found"}` now yields just `code`/`message`/`reason`).

        Removal is by position, not by value: when several entries report the same
        problem — two required fields both failing with `"field required"`, the
        common multi-field validation shape — only the entry the sentence came from
        loses it. Dropping every string equal to the message would leave the
        remaining problems unattributable to their `loc`.
      type: fix
    - summary: |
        Fixed API errors being printed twice and with the server's JSON body escaped
        inside the `message` string. An error is now rendered in exactly one
        representation — the JSON envelope on stdout for machine formats
        (`json`/`jsonl`/`yaml`, which includes the piped/non-TTY default), or a single
        `error[api]: <message>` line on stderr for `table`/`csv` — and the server's
        body is parsed rather than stringified: a sentence lands in `message`, the
        parsed body in `error.details`, and `reason` is derived from the HTTP status
        (`internalServerError` for 500) instead of always `httpError`. Top-level
        shapes such as `{"status", "message"}`, `{"error": "<message>"}`, RFC 7807
        `detail`/`title`, and OAuth 2.0 `error_description` are now recognized. Two
        consequences worth noting for anyone scripting against these fields: 429 now
        always reports `reason: "rateLimited"`. Previously a generated CLI reported
        either that or `tooManyRequests` for the same status depending on which code
        path produced the error — the runtime's `sdk_executor` already said
        `rateLimited`, while the generated request adapter said `tooManyRequests`.
        Both now come from one mapping. Also,
        `error.code` is always the HTTP status the server answered with. A body's own
        `code` never overrides it — not an internal numbering (`{"code": 100234}`,
        which used to truncate into a nonsense status), and not one that merely looks
        like a status, which could disagree with what was actually served and point
        the docs link at the wrong page. The body's `code` is still available under
        `error.details`.
      type: fix
    - summary: |
        Added a global `--human` flag, shorthand for `--format table`, for the one
        case TTY detection gets wrong: a person piping into a pager or a file still
        wants the interactive rendering. Without it the existing TTY-aware default
        applies (`table` on a terminal, `json` when piped), and passing it alongside
        `--format` is rejected. There is deliberately no `--json` counterpart:
        endpoints with a request body already spell that flag `--json <JSON>`, so
        the name cannot mean "render JSON" everywhere; use `--format json`.
      type: feat
    - summary: |
        `--format jsonl` now emits errors as a single line. The envelope was
        pretty-printed regardless of format, so a line-delimited consumer — the only
        reason to pick NDJSON — read a bare `{` and failed on the first line. Errors
        under `jsonl` are compact; `json` and `yaml` keep the readable multi-line
        rendering.
      type: fix
    - summary: |
        A request that fails to build is now a validation error rather than an
        internal one. `reqwest`'s `build()` fails on a malformed URL or header
        value, which comes from `--base-url` or a flag the user typed, but the
        failure was reported as `code: 500` / `reason: "internalError"` with exit 5.
        A mistyped `--base-url` claimed a server status for a request that was never
        sent and buried a fixable input error under an internal-error exit code. It
        now reports `code: 400` / `reason: "validationError"` with exit 3.
      type: fix
    - summary: |
        `<cli> --help --format json` now emits the operation catalog, as the
        generated README has always documented. It printed the human help instead,
        so the README's own example (`--help --format json | jq …`) failed with a
        jq parse error. It now returns exactly what `--schema` returns for the same
        scope.

        Only an *explicit* machine `--format` triggers this — the piped default does
        not, so `<cli> --help | less` still shows help. A path with no catalog entry
        (`auth login`, `completion`, `man` — built-ins, not API operations) falls
        back to prose rather than erroring; `--schema` on such a path still reports
        `discoveryError`, since asking for a document that does not exist is a real
        error. The README example was also
        corrected: the catalog is an object with `globalFlags` and `operations`, so
        counting operations is `jq '.operations | length'`, not `jq 'length'` (which
        counted the two top-level keys).
      type: fix
    - summary: |
        Removed `error::print_error_json` from the vendored runtime. It wrote the
        JSON envelope to stdout unconditionally — the exact double-output behaviour
        the rest of this release removes — so it was a working copy of the bug left
        reachable under an inviting name. It had no callers in the runtime, in the
        generator's emitted code, or in any generated CLI. `write_error_json`, which
        honours the resolved format, is the entry point.
      type: fix
    - summary: |
        A credential the CLI could not read is no longer treated as a credential the
        user never stored. Denying the OS keychain prompt made
        `AuthCredentialSource::resolve` return "nothing here" — the same answer as an
        empty keyring — so the CLI sent the request unauthenticated and the user saw
        whatever the API says to an anonymous caller. Against ElevenLabs that is
        `error[api]: Workspace 1anonymous1 not found.` with exit 1: a 404 for a
        problem that is an authentication failure.

        Credential resolution now distinguishes "not configured" from "configured but
        unreadable". On the request path a denied or broken keyring surfaces as
        `error[auth]` with exit 2, naming the backend failure. A fallback chain stops
        at the denial instead of falling through to a later empty source, which would
        have masked it again. Probing paths — `auth status`, `has_credentials` — still
        degrade to "no credential" rather than aborting, since a status listing should
        report what is usable, not fail.
      type: fix
    - summary: |
        Terminal error output no longer repeats itself. Services routinely echo one
        token across several fields — ElevenLabs sends `code`, `status` and `type` all
        restating the same `workspace_not_found` — which turned a one-fact 404 into
        five lines saying the same thing four times. A detail line whose value already
        appeared in the message, the reason, or an earlier line is now dropped, and a
        sole wrapper object (`{"detail": {...}}`) no longer prefixes every line with a
        word that names nothing the reader is looking for.

        A service-specific reason is now shown on the message line, in parentheses.
        It was previously the one useful field that appeared in the JSON envelope but
        never in the terminal. A reason derived from the HTTP status (`notFound` on a
        404) stays hidden, since it says nothing the label and message do not.

            error[api]: Workspace 1anonymous1 not found. (workspace_not_found)
              request_id: 6c312fb855fc7b476570b44e2b660988
              type: not_found

        The JSON envelope is unchanged and still carries every field.
      type: fix
    - summary: |
        Terminal error output now reports what the server said beyond the failure
        sentence. A field-level rejection used to read as `error[api]: field
        required` with no way to tell which field — the `loc` was in the JSON
        envelope, which is exactly what the person in the terminal cannot see. The
        parsed body is now flattened one `path: value` per line under the message:

            error[api]: value is not a valid email address
              detail[0].loc: body, email
              detail[0].type: value_error.email

        Lists of scalars stay on one line, since splitting FastAPI's two-element
        `loc` buries the field name it exists to report. Output is capped at ten
        lines, with a final line naming what was elided and pointing at
        `--format json`. The JSON envelope is unchanged.
      type: fix
    - summary: |
        Non-JSON error bodies no longer break the "`message` is one sentence"
        guarantee. A CDN or load balancer answering with an HTML page used to have
        its whole document — doctype, newlines and markup — pasted into
        `error.message`; the previous 500-byte clip did not help, because a short
        page is still multi-line markup. Markup and over-long bodies now yield
        `HTTP 502 badGateway (non-JSON response, 1284 bytes)` in `message`, with the
        bytes preserved (whitespace-collapsed and clipped) in `error.details.body`.
        A short plain-text body — the common proxy case — is still the message
        itself, now collapsed onto one line if the server wrapped it.
      type: fix
    - summary: |
        Two error bodies that produced an unhelpful envelope now read correctly. An
        empty body gave `message: ""`, which reads as the CLI having lost the error
        rather than the server having sent nothing; it now reports
        `HTTP <status> <reason>`. A body that is a bare JSON string
        (`"Service temporarily unavailable"`) was summarised as
        `HTTP 500 internalServerError` with the only text the server sent exiled to
        `details`; it is now the message. A body that is a bare JSON list of
        problems is also recognised, matching the existing `errors`/`detail`
        handling one level out.
      type: fix
    - summary: |
        Made the error envelope's `message` field one sentence for every error class.
        Advice that is not part of what the server reported — today the "Credentials
        were supplied via: ..." hint shown on 401/403 — moved out of `message` into
        its own `error.help` field, so a consumer keying off `error.message` sees the
        same shape whether or not the CLI had advice to offer. The docs link (opt-in
        via `error_docs_base_url`, previously human-only) now also appears as
        `error.docs_url`, so the JSON envelope no longer silently drops information
        the human rendering shows. Human output keeps the same order, one item per
        line: message, then what the server said beyond it, then hint, then link.
      type: fix
    - summary: |
        Usage errors (a mistyped subcommand, a bad flag value, conflicting flags) no
        longer stuff clap's whole multi-line block into `error.message` when output is
        machine-readable. The failure sentence stays in `message`, clap's `tip:` and
        `[possible values: ...]` lines move to `error.help`, the usage string becomes
        `error.usage`, and the `For more information, try '--help'` boilerplate is
        dropped — so every field is a single line, as with API errors. Human output on
        a terminal is unchanged: it still prints clap's full rendering, tip and usage
        included.

        Only clap's own blocks are split. A multi-line message from one of the CLI's
        validators — schema validation listing one bullet per violation, say — passes
        through whole, since applying the split there would demote the violations to
        `help` and leave `message` as the bare header.
      type: fix
  createdAt: "2026-08-21"
  irVersion: 67
- version: 0.36.0
  changelogEntry:
    - summary: |
        Use safe OpenAPI root tag descriptions for generated CLI group help and agent
        skills when no x-fern-groups summary is provided. Match operation-declared
        tags to groups without borrowing ambiguous or scope-style descriptions, and
        keep CLI help table lines concise while preserving full prose in long help.
        Treat summaries that only restate a group's command name as non-informative
        when a usable tag description exists, while retaining them when no such
        description is available. Preserve framework built-in group descriptions
        when a colliding API group has only the generic fallback. Method help now
        keeps the fuller description under `<method> --help` while the command
        table stays a single short sentence, and sentence splitting no longer cuts
        help text at abbreviations such as `e.g.`, `i.e.`, or `U.S.`. A tag named
        after the group owns that group's description: when it documents nothing,
        a sibling tag's prose no longer stands in for it, and a tag the group
        declares less often than another never names the whole group. An operation's
        `description` is no longer discarded in favour of its terse `summary`: the
        summary still labels the command table while the prose is what the command
        renders under its own `--help` — but only when it elaborates rather than
        paraphrasing the summary, so the two tiers never read as different
        commands. Flag help is split the same way — `-h`
        shows a one-line form and `--help` the fuller prose — and multipart field
        help, which previously bypassed truncation entirely, is now capped and has
        its spec indentation collapsed like every other parameter. `--help` keeps
        whatever the spec documents in full; only `-h` trims. An explicit
        `x-fern-groups.description` now drives the group's command-table line too
        (first sentence, with the full prose kept in long help) instead of only
        populating long help while the table showed the generic label.
      type: feat
  createdAt: "2026-08-21"
  irVersion: 67
