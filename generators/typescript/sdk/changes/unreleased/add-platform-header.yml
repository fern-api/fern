- summary: |
    Add opt-in support for the `X-Fern-Platform` header, which reports the
    operating system the SDK is running on (e.g. `linux`, `darwin`, `win32` on
    server runtimes) when it can be determined. This is gated behind a new
    `includePlatformHeaders` config option and is disabled by default, so
    existing generated output is unchanged. When enabled it is still subject to
    `omitFernHeaders` and is omitted in environments where the OS is not
    observable (e.g. browsers).
  type: feat
