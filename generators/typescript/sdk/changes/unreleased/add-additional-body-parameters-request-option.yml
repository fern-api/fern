# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Add a `bodyProperties` request option that spreads additional parameters into an endpoint's
    JSON request body. Caller-supplied properties override matching keys in the endpoint body,
    matching the behavior of the Python, Swift, and Ruby SDKs. Omitting the option leaves the
    request body unchanged and never fabricates a body for bodyless requests.
  type: feat
