# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Add opt-in, platform-guarded TCP keepalive for the generated default HTTP client. Enable it via
    the new `tcpKeepalive` custom config (`{ enabled, idleSeconds }`); it is disabled by default so
    existing generated output is unchanged. When enabled, the generated `getFetchFn` installs a
    Node-only undici dispatcher (`Agent` with `connect.keepAlive` / `keepAliveInitialDelay`) that
    emits TCP keepalive probes so long, non-streaming requests survive idle-connection reaping by a
    firewall/load balancer/NAT. The dispatcher is loaded lazily via a dynamic `undici` import and is
    a no-op on non-Node runtimes (browsers can't set socket options); `undici` is added as a
    dependency only when the flag is enabled. A user-supplied `fetch` (or custom `fetcher`) always
    takes precedence over the keepalive default. `idleSeconds` maps to `keepAliveInitialDelay`;
    Node's socket API does not expose the probe interval/count.
  type: feat
