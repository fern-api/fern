# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Undiscriminated unions with `base-properties` (e.g. an OpenAPI `oneOf` with sibling
    `properties`/`required`) now include the shared properties on every object variant
    of the generated type, raw type and serde schema. Inline object types referenced only
    by those shared properties are emitted in the union namespace. Previously the shared
    properties were silently dropped or their inline types were left undeclared.
  type: fix
