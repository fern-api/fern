# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Add an opt-in `optional-auth` config flag. When enabled, client auth
    parameters are made optional even when the API spec mandates auth on all
    endpoints (`isAuthMandatory=true`), so the client can be constructed without
    credentials. Useful for hand-maintained wrapper clients that authenticate
    via external means (e.g. cloud provider credentials). Defaults to `false`,
    so existing behavior is unchanged.
  type: feat
