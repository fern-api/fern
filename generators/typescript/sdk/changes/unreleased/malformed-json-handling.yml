# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Malformed JSON no longer loses HTTP details. An error response labelled JSON whose body isn't valid
    JSON (for example a `502` HTML page from a proxy) now throws the SDK's API error with the status code,
    raw body and response headers, instead of a generic JSON parse error. A successful response with
    malformed JSON now throws the SDK's API error too, instead of resolving the internal
    `{ ok: false, error: ... }` record as if it were the endpoint's data.
  type: fix
