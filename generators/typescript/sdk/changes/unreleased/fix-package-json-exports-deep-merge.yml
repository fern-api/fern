- summary: |
    `packageJson` overrides in `generators.yml` are now deep-merged into the generated `package.json`.
    Previously, overriding a nested object such as `exports["."]` replaced the generated entry
    wholesale, so adding a single custom export condition dropped the generated
    `import`/`require`/`default` conditions and left the package unresolvable.

    Merge semantics: user keys win at every level; user key order is preserved (user-specified keys
    are emitted first, in the order written, so a custom export condition precedes the generated
    ones and Node can match it); keys the user does not mention are inherited from the generated
    output. Arrays are unioned with user entries first. Removing a generated key (for example
    dropping the `require` condition) is not expressible via `packageJson` overrides.
  type: fix
