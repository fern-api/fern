- summary: |
    Fix generated WebSocket socket classes registering their `open`/`message`/`close`/`error`
    forwarding listeners twice when `connect()` is called after construction (the standard
    `new Socket(...).connect()` usage). `ReconnectingWebSocket` gains a `hasEventListener(type, listener)`
    method and `connect()` only registers each forwarding listener if it is not already attached, so
    every consumer `.on()` callback fires exactly once per event while `close()` followed by
    `connect()` continues to work.
  type: fix
