- summary: |
    Fix generated WebSocket socket classes registering their `open`/`message`/`close`/`error`
    forwarding listeners twice when `connect()` is called after construction (the standard
    `new Socket(...).connect()` usage). `connect()` now removes any existing forwarding listeners
    before re-adding them, so every consumer `.on()` callback fires exactly once per event while
    `close()` followed by `connect()` continues to work.
  type: fix
