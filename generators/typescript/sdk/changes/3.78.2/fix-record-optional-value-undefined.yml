# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Fix a regression where `| undefined` was dropped from the value type of generated
    `Record` types backed by optional map values (e.g. optional `additionalProperties`).
    Optional map values now correctly generate `Record<string, T | undefined>` with
    serialization `record(string(), T.optional())`, while `unknown`/`any` map values
    keep the redundant `| undefined` stripped (`Record<string, unknown>`).
  type: fix
