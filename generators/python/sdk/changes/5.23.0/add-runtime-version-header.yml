# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Add an opt-in `runtime_version` config flag. When enabled, the SDK version
    reported in the telemetry headers (`X-Fern-SDK-Version` and the version segment
    of `User-Agent`) is resolved at runtime via `importlib.metadata.version(<dist>)`
    instead of being baked in as a literal at generation time. This lets the reported
    version track the actually-installed package version — for example when an
    external tool such as release-please sets the published version after generation —
    rather than a version the SDK may never publish. Falls back to the generation-time
    version when the distribution is not installed (e.g. running from source). Disabled
    by default, so existing generated output is unchanged, and subject to
    `omit_fern_headers`.
  type: feat
