# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    On Python 3.10 and older, `str()` on a generated enum member now returns its value (e.g. `ACTIVE`)
    instead of `ClassName.ACTIVE`, matching `enum.StrEnum` on Python 3.11+. Previously, enum query
    parameters were sent as `ClassName.MEMBER` on those versions when `enum_type: forward_compatible_python_enums`
    or `python_enums` was used.
  type: fix
