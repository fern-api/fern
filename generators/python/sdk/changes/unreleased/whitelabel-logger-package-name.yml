# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    When `whitelabel` is enabled, the SDK's logger is now named after the package (for example
    `acme-orders`) instead of `{package name}_sdk_{version}`, so the name no longer changes on
    every release.
  type: fix
- summary: |
    The PyPI package name is now always normalized per the Python packaging spec: runs of
    `.`, `_`, and `-` become a single `-`, and the name is lowercased (for example `Acme_Orders.v2`
    becomes `acme-orders-v2`). This applies to `pyproject.toml`, the SDK name header, and the
    User-Agent. PyPI already treats these spellings as the same package, so installs are unaffected.
  type: fix
