# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Wire tests now cover every example instead of only the first one per endpoint. Each user-specified
    example gets its own test (or the first autogenerated success example when there are none), and when
    none of an endpoint's user examples is an error example, the autogenerated error examples are added
    too. Error tests assert the typed error the client raises for the status code (or the base `ApiError`
    when the client can't dispatch to a typed error) along with its `status_code` and `body`. Each test is
    served by its own `X-Test-Id`-scoped WireMock stub with the declared status code, and the test client
    disables retries. Set `wire_tests.fallback_to_autogenerated_error_examples: false` to leave out
    autogenerated error examples.
  type: feat
