- summary: |
    Add an `encode_path_params` config option. When enabled, path parameter values are
    percent-encoded when substituted into the request path, so a value containing `/` or `..`
    can no longer change which endpoint the request resolves to. Defaults to `false`, preserving
    the existing (unencoded) behavior; TypeScript, Go, Java, and C# already encode path params.
  type: feat
