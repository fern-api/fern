# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Redact every header auth scheme's header (e.g. `PLAID-SECRET`) in debug logs, in addition to
    `Authorization` and API-key headers, and merge request headers case-insensitively so a
    `plaid-secret` override replaces `PLAID-SECRET` instead of sending both.
  type: fix
- summary: |
    Map `4XX`/`5XX` wildcard error responses to their typed error classes (concrete status codes
    still win) and keep the real HTTP status code on the raised error.
  type: fix
- summary: |
    Fix offset pagination when the offset is an omitted body parameter (no more `OMIT + 1`), and
    advance nested offsets such as `$request.options.offset` on each page, creating `options` when
    it was omitted and preserving its other fields.
  type: fix
- summary: |
    Read environment-variable-backed client parameters (e.g. API keys) when the client is
    constructed instead of when the module is imported.
  type: fix
- summary: |
    Generate README.md for GitHub output even when no snippet path is configured (e.g. `fern generate --local`),
    and document binary (`format: binary`) body parameters as `bytes` in reference.md.
  type: fix
