- summary: |
    Preserve leading and trailing underscores in generated module and identifier
    names. Previously, names like `_agents` were incorrectly transformed to
    `agents`, stripping the underscore. This enables using underscore-prefixed
    namespace names (e.g. `x-fern-sdk-group-name: _agents`) to generate private
    Python modules.

    **Breaking**: APIs with underscore-prefixed query parameter names (e.g.
    `_fields`) will see the generated method kwarg change from `fields=` to
    `_fields=`. The new name matches the wire name and is the correct behavior.
  type: break
