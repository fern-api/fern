# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Fix undiscriminated union deserialization so JSON objects are matched to the correct object
    member. Previously, the first object member always won because object `UnmarshalJSON` accepts
    unknown keys and doesn't enforce required keys, so values like `{"ends_with": [...]}` were
    decoded as an earlier member and silently corrupted on re-serialization. Object members
    (including aliases to objects) that don't allow extra properties are now only selected when
    the JSON keys are a subset of the member's properties and include all of its required
    properties, and permissive object members no longer shadow a later member that matches
    exactly. If no member matches exactly, object members whose required keys are present are
    tried next, and the previous behavior is kept as the final fallback.
  type: fix
