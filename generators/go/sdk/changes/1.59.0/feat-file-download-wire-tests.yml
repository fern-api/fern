# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Generate wire tests for endpoints that return a file download (`io.Reader`). The generated
    test calls the raw client, asserts the served `Content-Type`, reads the stream to completion and
    compares the bytes against the fixture. The WireMock mapping for these endpoints now serves a
    real binary payload (a small valid PDF via `base64Body`, `application/octet-stream`) instead of
    the JSON string `""` with `Content-Type: application/json`. This also applies to OpenAPI-imported
    endpoints whose only autogenerated examples are error responses (e.g. Plaid's `/asset_report/pdf/get`).
  type: feat
