# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Format `date` and `date-time` path parameters before encoding them into the request URL.
    Previously a `date` path parameter was sent as Go's default `time.Time` string
    (e.g. `/schedule-by-date/2023-01-15%2000:00:00%20+0000%20UTC`) instead of `2023-01-15`.
  type: fix
- summary: |
    Generated wire tests now expect object, map, and list query parameters in the same
    `key[field]=value` form the SDK sends, instead of comparing against `"[object Object]"`.
  type: fix
