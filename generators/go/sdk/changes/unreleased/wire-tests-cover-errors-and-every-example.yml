# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Wire tests now cover every user-specified example of an endpoint (falling back to the first
    autogenerated success example), plus the endpoint's autogenerated error examples when no
    user-specified example is an error. Error tests assert the call fails with the typed error the
    SDK's error decoder returns for the IR-declared status code (or `*core.APIError` when the decoder
    can't dispatch to it), along with its status code and body. Each test sends its own `X-Test-Id`,
    which selects a WireMock stub serving that example's response, and the test client is built with
    `option.WithoutRetries()`. Tests for endpoints that share an HTTP method and path now call the
    endpoint under test instead of the first endpoint declared at that path. Set `wireTestsFallbackToAutogeneratedErrorExamples: false` to leave out
    autogenerated error examples.
  type: feat
