# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Fix paginated endpoints in subpackages referencing the root package's `ErrorCodes`,
    which doesn't exist when errors are declared in the subpackage. The pager's
    `ErrorDecoder` now uses the endpoint's namespace `ErrorCodes` (e.g. `users.ErrorCodes`),
    matching non-paginated endpoints.
  type: fix
