# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Fix offset pagination emitting code that does not compile. With `offsetSemantics: item-index`
    and a `step`, the pager read `results` before declaring it (`undefined: results`), and the
    offset increment now matches the page type (`int`, `int64`, `float64`). Endpoints with a
    required offset also emitted an invalid assignment to a request field, and now seed the
    initial offset from the request (`next := request.Offset`).
  type: fix
