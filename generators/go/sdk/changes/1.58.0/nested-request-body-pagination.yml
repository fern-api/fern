# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Add the `enableNestedRequestBodyPagination` configuration option, which extends
    `enableRequestBodyPagination` to page properties that live inside nested request objects, e.g.
    `offset: $request.options.offset`. Such endpoints previously generated without a pager, so the
    option defaults to `false` to preserve their existing return types.

    ```yaml
    - name: fernapi/fern-go-sdk
      config:
        enableRequestBodyPagination: true
        enableNestedRequestBodyPagination: true
    ```

    The generated pager advances the page on a copy of the request and allocates any optional
    intermediate object the caller left nil (`Options: nil` and `Options: &Options{Count: &n}` both
    work), across any nesting depth and through aliases to objects, without mutating the caller's
    request.
  type: feat
