# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Expose the http status code on the raw response: `HttpResponse::getStatusCode()`, next to
    `getBody()` and `getHeaders()`. Without it 200, 201 and 202 are indistinguishable to a
    caller - and for an api that answers 202 when a command was accepted but is still running,
    and 200 when it is done, that is the whole signal.
  type: feat
