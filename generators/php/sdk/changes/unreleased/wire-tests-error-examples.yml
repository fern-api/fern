- summary: |
    Generate a wire test for every endpoint example instead of only the first, including
    autogenerated error examples when no user example covers an error. Error tests assert that the
    call throws the API exception with the error's status code and response body. Each test is served
    its own WireMock stub matched by the `X-Test-Id` header, and the test client disables retries so
    429/5xx examples are not retried. Set `wire-tests-fallback-to-autogenerated-error-examples: false`
    to leave out autogenerated error examples.
  type: feat
