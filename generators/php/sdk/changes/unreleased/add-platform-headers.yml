- summary: |
    Add the `X-Fern-Runtime`, `X-Fern-Runtime-Version`, and `X-Fern-Platform`
    observability headers to generated SDK clients. `X-Fern-Runtime` reports the
    runtime name (`php`), `X-Fern-Runtime-Version` reports the running PHP version
    (`PHP_VERSION`), and `X-Fern-Platform` reports the operating system (`PHP_OS`).
    Like the other Fern platform headers, they are gated by the `omitFernHeaders`
    config option and are omitted when it is set.
  type: feat
