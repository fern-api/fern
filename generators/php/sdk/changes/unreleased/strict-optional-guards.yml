# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Send an optional query parameter, header or multipart body property whose value is
    falsy. The generated guard used a loose `!= null` comparison, so `false`, `0`, `0.0`
    and `''` were treated as unset and silently dropped: a caller setting `total: false`
    on a listing sent no `total` parameter at all. The guards now compare with
    `!== null`, so every explicitly set value reaches the wire and only an actual null
    means "unset". Boolean headers and multipart values are also spelled `true`/`false`
    now instead of going through php's string cast, which renders `true` as `1` and
    `false` as an empty string.
  type: fix
