# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    XML (TwiML) child builders keep the legacy names even when they match the element's text property:
    `$response->dial()->number('+1…')` adds a `<Number>` child and `$response->message()->body('Hi')` a
    `<Body>` child (the text stays on the `$number` / `$body` property, also reachable as `getText()` / `setText()`); `addNumber()` / `addBody()`
    remain available.
  type: fix
