- version: 0.36.1
  changelogEntry:
    - summary: |
        Endpoints configured with `x-fern-retries: { disabled: true }` (or `retries: { disabled: true }` in a Fern
        definition) are no longer retried. The generated endpoint method passes `retriesDisabled: true` to the
        HTTP client, which takes precedence over both the client-level `maxRetries` and the per-request
        `RequestOptions.maxRetries`.
      type: fix
  createdAt: "2026-08-20"
  irVersion: 66
- version: 0.36.0
  changelogEntry:
    - summary: |
        Endpoint methods now include a usage code example in their doc comments,
        so IDEs like Xcode surface a ready-to-use snippet in Quick Help on hover.
      type: feat
  createdAt: "2026-07-20"
  irVersion: 66
- version: 0.35.17
  changelogEntry:
    - summary: |
        Fix generated code for `set`-typed request bodies and response values. The
        Swift SDK represents `set` as `JSONValue`, so set example values now render
        as `JSONValue` literals (e.g. `JSONValue.array([...])`) in snippets and wire
        tests instead of being dropped or emitted as untyped Swift array literals.
      type: fix
    - summary: |
        Fix wire tests for endpoints that return an enum. The expected-response value
        is now referenced through its enum type (e.g. `WeatherReport.sunny`) rather
        than via shorthand (`.sunny`), which has no contextual type to resolve
        against when the response itself is an enum.
      type: fix
    - summary: |
        Fix JSON encoding/decoding of maps keyed by a non-`String` type (e.g. a
        string enum or an undiscriminated union). Swift only serializes a
        `Dictionary` as a JSON object when its key is `String`/`Int` or conforms to
        `CodingKeyRepresentable`; otherwise it falls back to a JSON array, which
        fails to round-trip object payloads. The generator now emits a
        `CodingKeyRepresentable` conformance for enum and undiscriminated-union types
        used as map keys. The conformance is gated with `@available` (macOS 12.3+,
        iOS 15.4+, tvOS 15.4+, watchOS 8.5+) to match the platforms where
        `Dictionary`'s `Codable` conformance uses `CodingKeyRepresentable`, so the
        generated SDK keeps compiling on its existing deployment targets.
      type: fix
    - summary: |
        Fix generated code and snippets for `allow-multiple` query parameters. These
        parameters are now typed as arrays in endpoint method signatures (e.g.
        `[String]`, `[Nullable<String>]`) and their example values render as arrays,
        so the generated SDK, snippets, and wire tests compile correctly.
      type: fix
    - summary: |
        Fix `bigint` values rendering as empty in dynamic snippets. They are now
        emitted as string literals, matching the `String` type used for bigints.
      type: fix
  createdAt: "2026-06-22"
  irVersion: 66
- version: 0.35.16
  changelogEntry:
    - summary: |
        Fix generated snippets and wire tests omitting path parameters bound to
        API-level variables. Path parameters are always required arguments on the
        generated endpoint method, so a placeholder value (e.g. `<endpointParam>`) is
        now emitted for any path parameter whose value is absent from the example,
        keeping the generated SDK, snippets, and wire tests compiling.
      type: fix
  createdAt: "2026-06-18"
  irVersion: 66
- version: 0.35.15
  changelogEntry:
    - summary: |
        Fix endpoints with a stream-parameter response generating a `JSONValue` return
        type, which broke generated wire tests that compared the result against the
        concrete response model. The Swift SDK does not yet implement response
        streaming, so these endpoints are now generated against their non-streaming
        response shape (e.g. the declared JSON response model).
      type: fix
  createdAt: "2026-06-18"
  irVersion: 66
- version: 0.35.14
  changelogEntry:
    - summary: |
        Fully qualify `Foundation.Data` in the generated HTTP client and test
        templates. When an API defined a type named `Data`, the generated
        top-level `Data` type shadowed `Foundation.Data` in those templates, so the
        request-body builder and stub helpers resolved to the wrong type and failed
        to compile. The remaining bare `Data` references now use `Foundation.Data`,
        matching the convention already used elsewhere in the runtime.
      type: fix
    - summary: |
        Default an optional referenced request body to `nil` in the generated client
        method, and omit the `request` argument from snippets and wire tests when an
        example provides no body. Previously the parameter had no default value while
        snippets emitted an empty initializer for the wrapped type, so endpoints with
        an absent optional request body failed to compile.
      type: fix
  createdAt: "2026-06-17"
  irVersion: 66
- version: 0.35.13
  changelogEntry:
    - summary: |
        Fixed argument ordering in generated wire tests and snippets so they match
        the order in which the corresponding Swift types declare their memberwise
        initializer parameters. Example object properties were previously emitted in
        the example's authoring order, and file-upload fields were grouped by kind
        (files before body properties), both of which could produce arguments in the
        wrong positional order and fail to compile. Wire-test response objects are
        now reordered to match the generated struct's declaration order, and
        file-upload request snippets preserve the original schema declaration order.
      type: fix
    - summary: |
        Fixed inline literal query parameters so they are typed correctly in the
        generated client method instead of falling back to the placeholder
        `JSONValue`. A boolean literal now maps to `Bool` and a string literal maps
        to a dedicated literal enum nested on the owning client. Previously the
        parameter was typed as `JSONValue` while the generated snippets and wire
        tests emitted the literal enum case, causing a type mismatch that failed to
        compile.
      type: fix
    - summary: |
        Fixed endpoints that return a `text/plain` response so the generated method
        returns `String` instead of the placeholder `JSONValue`. The HTTP client
        already decodes a `String` response type from the raw UTF-8 body, so the
        generated wire tests now compile and pass (previously `response == "string"`
        failed because the response was typed as `JSONValue`).
      type: fix
    - summary: |
        Fixed generated snippets and wire tests for single-property discriminated
        union variants. The wrapped value is serialized under the variant's property
        wire key (the union's CodingKeys raw value), but the snippet/wire-test
        generator was reading it from the discriminant's wire name, so variants whose
        discriminant differed from that key (e.g. a `date` or `datetime` case) emitted
        an empty enum case like `UnionWithTime.date()` that failed to compile. The
        value is now read from the correct property key, including variants that
        customize it via `key:`.
      type: fix
    - summary: |
        Preserve the declaration order of undiscriminated union members in generated
        code. Members were previously sorted alphabetically, which reordered the
        decoding attempts emitted in the `Decodable` initializer. For a union
        containing both `int` and `double`, this tried `Double` before `Int` and
        decoded integral JSON numbers (e.g. `1`) as a `Double` (`1.0`), so wire tests
        failed to round-trip. Members are now decoded in declaration order, matching
        Fern's undiscriminated union semantics.
      type: fix
    - summary: |
        Fixed generated wire tests to include extra (additional) properties in the
        expected response object for types whose schema permits them. The decoded
        response captures any undeclared JSON keys into `additionalProperties`, but
        the expected response object previously omitted them, so the equality
        assertion failed. Plain object responses now populate `additionalProperties`
        the same way undiscriminated-union responses already did.
      type: fix
    - summary: |
        Fixed generated wire tests and snippets so that they pass endpoint header
        arguments to the endpoint method. The endpoint method call previously emitted
        only path, query, and body arguments, omitting required header parameters
        (e.g. `X-API-Version`), which produced calls missing required arguments that
        failed to compile. Headers are now rendered between the path and query
        arguments to match the generated method signature, filtered to the
        String-typed headers the SDK surfaces as parameters. The String-type filter
        resolves through type aliases, so a header typed as an alias of String is
        emitted just like the SDK declares it.
      type: fix
  createdAt: "2026-06-16"
  irVersion: 66
- version: 0.35.12
  changelogEntry:
    - summary: |
        Fixed wire-test stub response bodies so they are valid JSON for every
        response type. The generated SDK reads `String`-typed response bodies as raw
        UTF-8 but decodes every other type via `JSONDecoder`. Wire tests now mirror
        that: `String`-decoded responses (string/bigInteger/base64 primitives) emit
        the raw payload, while all other types (objects, enums, dates, UUIDs, numbers,
        unions, etc.) are JSON-encoded. Previously bare scalars such as a UUID or enum
        value were emitted unquoted, producing invalid JSON that failed to decode.
      type: fix
  createdAt: "2026-06-16"
  irVersion: 66
- version: 0.35.11
  changelogEntry:
    - summary: |
        Fixed several Swift code generation bugs around identifier and string escaping:
        - Enum raw values are now escaped as raw Swift string content rather than being
          JSON-encoded, fixing invalid literals (e.g. unterminated strings and bogus escapes).
        - Reserved keywords used as type names, enum/case names, property names, and type
          references are now backtick-escaped (e.g. `Type`), and identifiers that start with
          a digit are sanitized (e.g. `3D` -> `_3D`).
        - String-typed literals that are not registered as nested literal enums (such as
          endpoint header/query literals) now fall back to `JSONValue` instead of crashing
          generation.
      type: fix
  createdAt: "2026-06-15"
  irVersion: 66
- version: 0.35.10
  changelogEntry:
    - summary: |
        Fix enum query parameters wrapped in Nullable<> to emit .rawValue for proper
        Swift compilation. Previously, nullable enum query params generated .string($0)
        instead of .string($0.rawValue), causing type errors.
      type: fix
  createdAt: "2026-06-09"
  irVersion: 66
