# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Generated wire tests now cover every user-specified example (falling back to the first
    autogenerated success example) plus the endpoint's autogenerated error examples, one per error.
    Error tests assert the call throws `.httpError` with the IR-declared status code and the parsed
    error body. Success stubs use the endpoint's declared status code, and test requests disable
    retries. Set `wireTestsFallbackToAutoGeneratedErrorExamples: false` to leave out the
    autogenerated error examples.
  type: feat
