# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Fix generated OAuth code snippets and README failing to compile under `auth: endpoint-security`.
    The snippet/README examples instantiate the client with `Client.withCredentials(clientId,
    clientSecret)`, but under endpoint-security the client builder is not staged, so that factory was
    never generated — producing "cannot find symbol: method withCredentials" errors across the
    generated example files. The client now generates a `withCredentials(clientId, clientSecret)`
    convenience factory under endpoint-security that returns the standard builder pre-configured with
    the OAuth credentials.
  type: fix
