- summary: |
    Honor `package-prefix` and `package-layout` for `local-file-system` output when the CLI
    requests a full project (e.g. `--generate-tests`, `--package`, or self-hosted SDKs).
    Previously these were dropped when converting the local-file-system config, so the root
    package fell back to `com.<org>.<api>` instead of the configured prefix. Full-project local
    output now also writes sources at their full package path (`src/main/java/com/acme/...`)
    instead of stripping the prefix from the directory.
  type: fix
