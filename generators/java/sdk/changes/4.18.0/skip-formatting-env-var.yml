# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Add support for the `FERN_JAVA_SKIP_FORMATTING` environment variable. When set to a truthy
    value (`1`, `true`, `yes`, or `on`), the generator skips the `./gradlew :spotlessApply` pass
    that normally runs after code generation, so generation makes no Gradle invocation at all.
    This unblocks restricted networks that cannot reach the Gradle distribution or plugin
    repositories, and shortens generation time.

    Generated code is emitted unformatted; the Spotless plugin is still wired into the generated
    `build.gradle`, so `./gradlew spotlessApply` can be run separately. The variable is unset by
    default, leaving existing output byte-for-byte unchanged. The Fern CLI forwards it from the
    host into the generator container automatically.
  type: feat
