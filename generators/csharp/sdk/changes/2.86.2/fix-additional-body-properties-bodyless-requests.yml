# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Fix `RequestOptions.AdditionalBodyProperties` throwing `InvalidOperationException` on endpoints
    without a request body (e.g. GET requests). When the request body is null, the additional
    properties are now sent as the JSON request body.
  type: fix
- summary: |
    `RequestOptions.AdditionalBodyProperties` is now applied to form-urlencoded requests. The additional
    properties are merged into the form body (the additional property wins on a key collision) before
    encoding. Multipart requests remain unsupported.
  type: fix
