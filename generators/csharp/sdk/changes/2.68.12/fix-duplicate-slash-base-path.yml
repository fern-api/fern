# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Generated request paths no longer contain duplicate slashes when an endpoint's
    API/service base-paths join into an empty segment (e.g. a service `base-path: /`).
    The client now requests `/{id}/{nestedId}` instead of `/{id}//{nestedId}`, matching
    the path the server exposes and the behavior of the other SDK generators. Mock-server
    test expectations are normalized the same way so they stay consistent with the client.
  type: fix
