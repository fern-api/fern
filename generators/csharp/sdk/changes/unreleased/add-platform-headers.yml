- summary: |
    Add opt-in support for the `X-Fern-Runtime`, `X-Fern-Runtime-Version`, and
    `X-Fern-Platform` observability headers on generated SDK clients.
    `X-Fern-Runtime` reports `dotnet`, `X-Fern-Runtime-Version` reports
    `RuntimeInformation.FrameworkDescription`, and `X-Fern-Platform` reports
    `RuntimeInformation.OSDescription`, all computed at runtime. These are gated
    behind a new `include-platform-headers` config option and are disabled by
    default, so existing generated output is unchanged. When enabled they are
    still subject to the `omit-fern-headers` config option.
  type: feat
