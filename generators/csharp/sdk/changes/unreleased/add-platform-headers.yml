# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Add the `X-Fern-Runtime`, `X-Fern-Runtime-Version`, and `X-Fern-Platform`
    observability headers to generated SDK clients. `X-Fern-Runtime` reports
    `dotnet`, `X-Fern-Runtime-Version` reports `RuntimeInformation.FrameworkDescription`,
    and `X-Fern-Platform` reports `RuntimeInformation.OSDescription`, all computed at
    runtime. Like the other Fern observability headers, they are gated by the
    `omit-fern-headers` config option.
  type: feat
