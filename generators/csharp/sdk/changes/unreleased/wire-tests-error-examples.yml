- summary: |
    Generated wire tests now cover every user-specified example of an endpoint instead of only one,
    and add the endpoint's autogenerated error examples when none of its user examples is an error.
    Error tests assert that the call throws the typed exception the client raises for the status
    code (or the base API exception when the client can't map the response to a typed error) and
    check its status code and body. Mock responses use the endpoint's declared success status code
    instead of always returning 200. Set `wire-tests-fallback-to-autogenerated-error-examples: false`
    to leave out the autogenerated error examples.
  type: feat
