# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Aliases of `unknown` (e.g. `AnyType` wrapping `serde_json::Value`) now derive
    `Default`, so structs and aliases that contain them and derive `Default`
    compile without manual patching. Brings `hasDefaultImpl` in line with the
    struct generator's default analysis; required `unknown` fields also get
    `#[serde(default)]` like other `Default` field types.
  type: fix
