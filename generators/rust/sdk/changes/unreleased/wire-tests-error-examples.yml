# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Wire tests now cover every example instead of only the first: all user-specified examples (or the
    first autogenerated success example), plus one autogenerated error example per error when no user
    example is an error. Error tests assert that the call fails with the `ApiError` variant the SDK parses
    for that status code, including its `message`. Each test sends an `X-Test-Id` header that selects its
    own WireMock stub, and the test client disables retries. Set
    `wireTestsFallbackToAutoGeneratedErrorExamples: false` to leave out autogenerated error examples.
  type: feat
