- summary: |
    Wire up OAuth client-credentials authentication in the generated client. When an
    OAuth client-credentials scheme is defined, the generated `ClientConfig` now carries
    the resolved token endpoint and the `HttpClient` automatically fetches, caches, and
    refreshes a bearer token (using the configured `client_id`/`client_secret`) before
    making authenticated requests. Previously the OAuth scaffolding was present but never
    connected to the request flow.
  type: feat
