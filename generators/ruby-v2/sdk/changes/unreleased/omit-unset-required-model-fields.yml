# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Request bodies no longer include model fields the caller did not set. Previously a required field that was
    left out of a nested object (e.g. a partial update payload) was sent as `null` (or as `{}` in older SDKs),
    which APIs with sparse-update semantics reject. Unset fields are now omitted from `to_h`, and a field set
    explicitly to `nil` is still sent as `null` unless it is optional and not nullable.
  type: fix
