- summary: |
    Response parsing is faster on large payloads. `Model#initialize` no longer coerces fields whose value is nil,
    and `Utils.coerce` returns a value that is already an instance of a `String`, `Integer`, `Float`, or model
    target type without walking the full type match. Parsed output is unchanged.
  type: fix
