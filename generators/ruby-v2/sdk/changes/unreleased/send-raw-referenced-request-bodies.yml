# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Endpoints whose request body is an array, set, map, primitive, enum, or an alias of one of these now send
    the body argument itself (e.g. `[{"name":"Monstera"}]`) instead of wrapping it with the other keyword
    arguments (e.g. `{"request": [...]}`). This also applies to such bodies on endpoints with headers or query
    parameters, which no longer leak into the body. Lists and sets of objects are serialized element-wise
    through the model so fields use their wire names, and sets are sent as JSON arrays.
  type: fix
