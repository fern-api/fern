- summary: |
    Deserialize non-object JSON response bodies. Endpoints whose response is a top-level
    list, map, set, primitive, or unknown JSON value previously returned `nil`; they now
    parse the body and coerce it to the declared type. Map responses are parsed with
    string keys so non-string key types (e.g. `map<integer, T>`) coerce correctly, and
    every successful response with an empty body (including named types) returns `nil`
    instead of raising `JSON::ParserError`.
  type: fix
