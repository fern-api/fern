# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Error responses now expose the body parsed into the endpoint's declared error type
    as `error.body` (exact status codes take precedence over `4XX`/`5XX` wildcards).
    `error.message` and `error.code` are unchanged; `body` is `nil` when no error type
    matches or the body is not valid JSON.
  type: feat
- summary: |
    A 2xx response whose body is not valid JSON now raises `Errors::ResponseError`
    (with the raw body and status code) instead of leaking `JSON::ParserError`.
  type: fix
- summary: |
    Add the opt-in `requireAuthCredentials` config. When enabled, the client
    constructor raises `ArgumentError` if a bearer or header credential is neither
    passed nor set in its environment variable, instead of sending an empty auth header.
  type: feat
