# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Cap generated request-wrapper filenames (`lib/<gem>/<service>/types/*_request.rb`) at
    100 characters, matching the existing cap on type filenames, so `gem build` no longer
    fails with `Gem::Package::TooLongFileName` for endpoints with long path-derived names
    (e.g. operations without an `operationId`). Over-long names are truncated with a short
    deterministic hash appended; the Ruby class name is unchanged.
  type: fix
