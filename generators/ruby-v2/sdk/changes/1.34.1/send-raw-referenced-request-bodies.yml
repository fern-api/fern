# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Endpoints whose request body is an array, set, map, primitive, enum, optional/nullable object, or an alias of
    one of these now send the body argument itself (e.g. `[{"name":"Monstera"}]`) instead of wrapping it with the
    other keyword arguments (e.g. `{"request": [...]}`). This also applies to such bodies on endpoints with headers
    or query parameters, which no longer leak into the body. Objects inside these bodies (optional/nullable objects,
    list and set items, and map values) are serialized through their model so fields use their wire names, sets are
    sent as JSON arrays, and an omitted optional body is still sent without a body.
  type: fix
