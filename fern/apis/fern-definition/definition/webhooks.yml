imports:
  commons: commons.yml
  services: service.yml
  types: types.yml
  examples: examples.yml

types:
  WebhookSchema:
    extends:
      - commons.WithAvailability
      - commons.WithAudiences
      - commons.WithDocsSchema
      - commons.WithDisplayName
    properties:
      method: WebhookMethodSchema
      headers: optional<map<string, services.HttpHeaderSchema>>
      payload: WebhookPayloadSchema
      signature: optional<WebhookSignatureSchema>
      response: optional<services.HttpResponseSchema>
      response-stream: optional<services.HttpResponseStreamSchema>
      examples: optional<list<examples.ExampleWebhookCallSchema>>

  WebhookMethodSchema:
    enum:
      - POST
      - GET

  WebhookPayloadSchema:
    discriminated: false
    union:
      - string
      - WebhookReferencedPayloadSchema
      - WebhookInlinedPayloadSchema

  WebhookReferencedPayloadSchema:
    extends:
      - commons.WithDocsSchema
    properties:
      type: string

  WebhookInlinedPayloadSchema:
    properties:
      name: string
      extends: optional<types.ObjectExtendsSchema>
      properties: optional<map<string, types.ObjectPropertySchema>>

  WebhookSignatureSchema:
    discriminant: type
    union:
      hmac: HmacSignatureSchema
      asymmetric: AsymmetricSignatureSchema

  HmacSignatureSchema:
    properties:
      header: string
      algorithm:
        type: optional<WebhookSignatureAlgorithmSchema>
        docs: Defaults to sha256.
      encoding:
        type: optional<WebhookSignatureEncodingSchema>
        docs: Defaults to base64.
      signature-prefix:
        type: optional<string>
        docs: |
          Prefix in the header value before the signature (e.g. "sha256=").
      payload-format:
        type: optional<WebhookPayloadFormatSchema>
        docs: |
          Defaults to body-only (components: [body], delimiter: "").
      timestamp: optional<WebhookTimestampSchema>
      body-hash-binding:
        type: optional<WebhookBodyHashBindingSchema>
        docs: |
          When set, the raw body is not signed directly; instead a hash of the body is
          transmitted separately (e.g. Twilio's "bodySHA256" query parameter for JSON
          bodies) and verification also recomputes and compares the body hash.
      url-normalization:
        type: optional<WebhookUrlNormalizationSchema>
        docs: |
          When set, the signature is verified against multiple normalized forms of the
          notification URL (e.g. with/without port, legacy query encoding), succeeding if any
          candidate matches. Required by providers like Twilio.

  AsymmetricSignatureSchema:
    properties:
      header: string
      asymmetric-algorithm: AsymmetricAlgorithmSchema
      encoding:
        type: optional<WebhookSignatureEncodingSchema>
        docs: Defaults to base64.
      signature-prefix:
        type: optional<string>
        docs: |
          Prefix in the header value before the signature.
      jwks-url:
        type: optional<string>
        docs: JWKS endpoint URL. When omitted, a static public key is expected at runtime.
      key-id-header:
        type: optional<string>
        docs: HTTP header containing the key ID for JWKS key selection.
      payload-format:
        type: optional<WebhookPayloadFormatSchema>
        docs: |
          Describes how the signed payload is constructed.
          Defaults to body-only (components: [body], delimiter: "").
      timestamp: optional<WebhookTimestampSchema>

  WebhookSignatureAlgorithmSchema:
    enum:
      - sha256
      - sha1
      - sha384
      - sha512

  WebhookSignatureEncodingSchema:
    enum:
      - base64
      - hex

  WebhookTimestampSchema:
    properties:
      header: string
      format:
        type: optional<WebhookTimestampFormatSchema>
        docs: Defaults to unix-seconds.
      tolerance:
        type: optional<integer>
        docs: Allowed clock skew in seconds. Defaults to 300.

  WebhookTimestampFormatSchema:
    enum:
      - name: unixSeconds
        value: unix-seconds
      - name: unixMillis
        value: unix-millis
      - name: iso8601
        value: iso8601

  WebhookPayloadFormatSchema:
    properties:
      components: list<WebhookPayloadComponentSchema>
      delimiter:
        type: optional<string>
        docs: Defaults to empty string.
      body-sort:
        type: optional<WebhookPayloadBodySortSchema>
        docs: |
          When set, POST body parameters are sorted before being concatenated
          into the signing payload. Required by providers like Twilio.

  WebhookPayloadBodySortSchema:
    enum:
      - alphabetical

  WebhookUrlNormalizationSchema:
    properties:
      port-variants:
        type: optional<boolean>
        docs: |
          Try the URL both with the scheme's standard port added (:443 for https, :80 for
          http) if absent, and with the port removed. All Twilio libraries do this.
      legacy-query-encoding:
        type: optional<boolean>
        docs: |
          Additionally try each port variant with the query string re-encoded using legacy
          form-encoding, reversing percent-encoding differences introduced by WHATWG URL
          parsing. Twilio's Node library does this; the others do not.

  WebhookPayloadComponentSchema:
    enum:
      - body
      - timestamp
      - name: notificationUrl
        value: notification-url
      - name: messageId
        value: message-id

  WebhookBodyHashBindingSchema:
    properties:
      algorithm: WebhookBodyHashAlgorithmSchema
      encoding:
        type: optional<WebhookSignatureEncodingSchema>
        docs: Defaults to base64.
      location: WebhookBodyHashLocationSchema

  WebhookBodyHashAlgorithmSchema:
    enum:
      - sha256
      - sha1
      - sha384
      - sha512

  WebhookBodyHashLocationSchema:
    discriminant: type
    union:
      query-parameter: WebhookBodyHashQueryParameterLocationSchema

  WebhookBodyHashQueryParameterLocationSchema:
    properties:
      name:
        type: string
        docs: The query-parameter name that carries the body hash (e.g. "bodySHA256").

  AsymmetricAlgorithmSchema:
    enum:
      - name: rsaSha256
        value: rsa-sha256
      - name: rsaSha384
        value: rsa-sha384
      - name: rsaSha512
        value: rsa-sha512
      - name: ecdsaSha256
        value: ecdsa-sha256
      - name: ecdsaSha384
        value: ecdsa-sha384
      - name: ecdsaSha512
        value: ecdsa-sha512
      - name: ed25519
        value: ed25519
