# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    Generate SDKs on Fern's servers instead of with Docker, which is only for self-hosted setups, so SDKs come out complete (README, reference.md, and package files like pyproject.toml). New projects add each SDK as a target in `fern/sdk-config.yml`, which uses the newest generator, instead of running `fern add`.
  type: fix
- summary: |
    Skip Enterprise-plan SDK languages instead of setting them up when you say your organization has the plan. The wizard links to billing and explains how to add them once you've upgraded.
  type: fix
- summary: |
    Pin new projects to the newest released Fern CLI, so a project set up by an unreleased build (version 0.0.0) still works with `fern upgrade`, `fern generate`, and other commands.
  type: fix
- summary: |
    Ask "SDKs", "API docs", or "SDKs and API docs" instead of preselecting both, and run `fern init --api` for an SDK-only setup so it doesn't also create a docs site.
  type: fix
- summary: |
    Write the Fern skill into the same folders as the fern-docs skill (`.claude/skills/`, `.agents/skills/`) instead of AGENTS.md or Cursor rules, so all of Fern's agent instructions live in one place.
  type: fix
- summary: |
    Stop asking to confirm the first step (running the wizard already says yes), ask for your organization's name in plain terms, and note that a new docs preview link can take a minute or two to work.
  type: fix
- summary: |
    Applying a brand no longer overwrites an existing image with the same name in `fern/docs/assets/` (it writes `logo-light-2.svg` and so on instead), and the docs starter's manifest must use canonical paths.
  type: fix
