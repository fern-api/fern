# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  http: http.yml
  types: types.yml
  commons: commons.yml
types:
  EnvironmentVariable: string
  AuthSchemeKey: string
  AuthScope: string

  ApiAuth:
    extends: commons.WithDocs
    properties:
      requirement: AuthSchemesRequirement
      schemes: list<AuthScheme>

  AuthSchemesRequirement:
    enum:
      - ALL
      - ANY
      - ENDPOINT_SECURITY

  AuthScheme:
    discriminant:
      value: _type
      name: type
    union:
      bearer: BearerAuthScheme
      basic: BasicAuthScheme
      header: HeaderAuthScheme
      oauth: OAuthScheme
      inferred: InferredAuthScheme

  BaseAuthScheme:
    extends: commons.WithDocs
    properties:
      key:
        type: AuthSchemeKey
        docs: |
          The unique key for this auth scheme. This will be used to reference the scheme in endpoint auth requirements.
          Defaults to the type of the auth scheme if not provided.

  InferredAuthScheme:
    extends: BaseAuthScheme
    properties:
      tokenEndpoint: InferredAuthSchemeTokenEndpoint
      # refreshEndpoint: optional<InferredAuthSchemeRefreshEndpoint>

  InferredAuthSchemeTokenEndpoint:
    properties:
      endpoint: commons.EndpointReference
      expiryProperty: optional<http.ResponseProperty>
      authenticatedRequestHeaders: list<InferredAuthenticatedRequestHeader>

  # InferredAuthSchemeRefreshEndpoint:
  #   properties:
  #     endpoint: commons.EndpointReference
  #     expiryProperty: http.ResponseProperty
  #     authenticatedRequestHeaders:
  #       type: list<InferredAuthenticatedRequestHeader>
  #       docs: These headers will override the headers defined on the tokenEndpoint.

  InferredAuthenticatedRequestHeader:
    docs: A header that will be set on HTTP requests when the inferred auth scheme is applied to an endpoint.
      These are not headers for the authorization endpoint.
    properties:
      responseProperty:
        type: http.ResponseProperty
        docs: The property to retrieve the header value from the get token or refresh endpoint response.
      headerName:
        type: string
        docs: |
          The header name to put the token in for any authenticated HTTP request. 
          Defaults to `Authorization`.
      valuePrefix:
        type: optional<string>
        docs: |
          Commonly used for setting the `Authorization` scheme, but could be used for other things.
          For `Authorization` header, the default will be `Bearer `, but `undefined` for other headers.

  BearerAuthScheme:
    extends: BaseAuthScheme
    properties:
      token: commons.NameOrString
      tokenEnvVar:
        type: optional<EnvironmentVariable>
        docs: The environment variable the SDK should use to read the token.
      tokenPlaceholder:
        type: optional<string>
        docs: The placeholder value to use in code snippets (e.g., "YOUR_API_KEY").

  OAuthScheme:
    extends: BaseAuthScheme
    docs: |
      We currently assume the resultant token is leveraged as a bearer token, e.g. "Authorization Bearer"
    properties:
      configuration: OAuthConfiguration

  OAuthConfiguration:
    union:
      clientCredentials: OAuthClientCredentials
      authorizationCode: OAuthAuthorizationCode

  OAuthAuthorizationCode:
    docs: |
      The OAuth 2.0 Authorization Code grant with PKCE (RFC 7636) for public clients such as
      CLIs and native apps. The client opens the user's browser to the authorization endpoint,
      receives the authorization code on a configured loopback redirect (callback), and exchanges
      it for tokens at the token endpoint without a client secret.
    properties:
      clientId:
        type: OAuthPublicClientId
        docs: The public client ID for the CLI/native app. Public clients do not use a client secret.
      authorizationUrl:
        type: string
        docs: The absolute URL of the authorization (consent) endpoint opened in the user's browser.
      tokenUrl:
        type: string
        docs: The absolute URL of the token endpoint used to exchange the authorization code for tokens.
      refreshUrl:
        type: optional<string>
        docs: The absolute URL used to refresh tokens. Defaults to `tokenUrl` when omitted.
      redirectUri:
        type: string
        docs: |
          The loopback redirect (callback) URI registered with the authorization server
          (e.g. http://127.0.0.1:8484/callback). The same URI is used for the authorization
          request and the token exchange.
      scopes:
        type: optional<list<string>>
        docs: The scopes requested during authorization.
      pkce:
        type: OAuthPkceConfiguration
        docs: The PKCE configuration. PKCE is required for this flow.
      authorizationParameters:
        type: optional<map<string, string>>
        docs: |
          Additional public, literal parameters appended to the authorization request
          (e.g. `audience`, `resource`). These must not override protocol-reserved parameters.
      tokenParameters:
        type: optional<map<string, string>>
        docs: Additional public, literal parameters included in the authorization-code token exchange request.
      refreshParameters:
        type: optional<map<string, string>>
        docs: Additional public, literal parameters included in the refresh token request.
      tokenHeader:
        type: optional<string>
        docs: The header the token is applied to. Defaults to `Authorization`.
      tokenPrefix:
        type: optional<string>
        docs: |
          The prefix for the token header value. Defaults to `Bearer`.
          An empty prefix means the raw token is sent.

  OAuthPublicClientId:
    docs: The source of the public client ID for a public-client OAuth flow.
    union:
      literal: string
      environmentVariable: EnvironmentVariable

  OAuthPkceConfiguration:
    docs: PKCE (RFC 7636) parameters for the authorization code exchange.
    properties:
      method:
        type: OAuthPkceMethod
        docs: The PKCE code challenge method. Only S256 is supported.

  OAuthPkceMethod:
    docs: The PKCE code challenge method. Only the secure S256 method is supported.
    enum:
      - S256

  OAuthClientCredentials:
    properties:
      clientIdEnvVar: optional<EnvironmentVariable>
      clientSecretEnvVar: optional<EnvironmentVariable>
      tokenPrefix: optional<string>
      tokenHeader: optional<string>
      scopes: optional<list<string>>
      tokenEndpoint: OAuthTokenEndpoint
      refreshEndpoint: optional<OAuthRefreshEndpoint>

  OAuthTokenEndpoint:
    properties:
      endpointReference: commons.EndpointReference
      requestProperties: OAuthAccessTokenRequestProperties
      responseProperties: OAuthAccessTokenResponseProperties

  OAuthRefreshEndpoint:
    properties:
      endpointReference: commons.EndpointReference
      requestProperties: OAuthRefreshTokenRequestProperties
      responseProperties: OAuthAccessTokenResponseProperties

  OAuthAccessTokenRequestProperties:
    docs: The properties required to retrieve an OAuth token.
    properties:
      clientId: http.RequestProperty
      clientSecret: http.RequestProperty
      scopes: optional<http.RequestProperty>
      customProperties: optional<list<http.RequestProperty>>

  OAuthAccessTokenResponseProperties:
    docs: The properties to map to the corresponding OAuth token primitive.
    properties:
      accessToken: http.ResponseProperty
      expiresIn: optional<http.ResponseProperty>
      refreshToken: optional<http.ResponseProperty>

  OAuthRefreshTokenRequestProperties:
    docs: The properties required to retrieve an OAuth refresh token.
    properties:
      refreshToken: http.RequestProperty

  BasicAuthScheme:
    extends: BaseAuthScheme
    properties:
      username: commons.NameOrString
      usernameEnvVar:
        type: optional<EnvironmentVariable>
        docs: The environment variable the SDK should use to read the username.
      usernameOmit:
        type: optional<boolean>
        docs: If true, the username will be omitted from the SDK.
      usernamePlaceholder:
        type: optional<string>
        docs: The placeholder value to use in code snippets for the username (e.g., "YOUR_USERNAME").
      password: commons.NameOrString
      passwordEnvVar:
        type: optional<EnvironmentVariable>
        docs: The environment variable the SDK should use to read the password.
      passwordOmit:
        type: optional<boolean>
        docs: If true, the password will be omitted from the SDK.
      passwordPlaceholder:
        type: optional<string>
        docs: The placeholder value to use in code snippets for the password (e.g., "YOUR_PASSWORD").

  HeaderAuthScheme:
    extends: BaseAuthScheme
    properties:
      name: commons.NameAndWireValueOrString
      valueType: types.TypeReference
      prefix: optional<string>
      headerEnvVar:
        type: optional<EnvironmentVariable>
        docs: The environment variable the SDK should use to read the header.
      headerPlaceholder:
        type: optional<string>
        docs: The placeholder value to use in code snippets for the header (e.g., "YOUR_API_KEY").
