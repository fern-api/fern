instances:
  - url: https://example.docs.buildwithfern.com

title: Version default (products, two defaults)

products:
  - display-name: Plants
    path: ./products/plants.yml
    slug: plants
    versions:
      - display-name: Develop
        path: ./versions/develop.yml
        slug: develop
        default: true
      - display-name: 3.3.0
        path: ./versions/index.yml
        slug: 3-3-0
        default: true
