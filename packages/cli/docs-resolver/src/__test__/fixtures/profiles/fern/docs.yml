instances:
  - url: profiles.docs.buildwithfern.com
title: Profiles
profiles:
  community:
    vars:
      CLI: acme
  enterprise:
    vars:
      CLI: acme-ent
  marketing:
    vars:
      PRODUCT: Acme
  enterprise-v1:
    vars:
      PRODUCT: Acme Old
profile: community
translations:
  - lang: en
    default: true
  - lang: fr
landing-page:
  page: Welcome
  path: ./pages/landing.mdx
  profile: marketing
tabs:
  guides:
    display-name: Guides
navigation:
  - tab: guides
    variants:
      - title: Community
        layout:
          - page: Install
            path: ./pages/install.mdx
      - title: Enterprise
        profile: enterprise
        layout:
          - page: Install
            path: ./pages/install.mdx
          - section: Old
            profile: enterprise-v1
            contents:
              - page: Old install
                path: ./pages/old-install.mdx
          - page: Override
            path: ./pages/override.mdx
            profile: community
          - page: Plain
            path: ./pages/plain.mdx
          - page: Translated
            path: ./pages/translated.mdx
          - api: API
            layout:
              - page: API guide
                path: ./pages/api-guide.mdx
