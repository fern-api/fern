# GraphQL schema to test namespace type handling.
#
# Namespace types (all fields have arguments) are kept in the type registry so the
# frontend can render their fields on landing pages. Their fields are also promoted
# to standalone operations via convertNamespaceOperations.
#
# AccountMutations: mutation namespace. Its fields become flat sidebar entries; each
# mutation's example request wraps itself in the parent field (e.g. mutation { account { create(...) } }).
# No parent operation is created — mutations are always listed individually.
#
# InventoryQueries: query namespace. A parent operation (query_inventory) is created
# so the sidebar entry for "inventory" has an operation whose returnType points at
# InventoryQueries, letting the page render all nested query fields.

"""
An account in the system.
"""
type Account {
  """
  Unique identifier.
  """
  id: ID!

  """
  Account name.
  """
  name: String!

  """
  Account email.
  """
  email: String!
}

"""
An inventory location.
"""
type InventoryLocation {
  """
  Location code.
  """
  code: String!

  """
  Location name.
  """
  name: String!
}

"""
Namespace grouping for account mutations.
All fields have arguments — this makes it a namespace type.
"""
type AccountMutations {
  """
  Create an account.
  """
  create(
    """Display name for the account."""
    name: String!

    """Contact email address."""
    email: String!
  ): Account!

  """
  Delete an account by ID.
  """
  delete(
    """ID of the account to delete."""
    id: ID!
  ): Boolean!
}

"""
Namespace grouping for inventory queries.
All fields have arguments — this makes it a namespace type.
A parent operation should be created since the root Query field has no arguments.
"""
type InventoryQueries {
  """
  Get locations by code.
  """
  locations(
    """Filter by location codes."""
    codes: [String!]
  ): [InventoryLocation!]!
}

type Mutation {
  """
  Account-related mutations (namespace — no args on this field).
  """
  account: AccountMutations!
}

type Query {
  """
  Get an account by ID.
  """
  account(id: ID!): Account

  """
  Inventory namespace — returns a namespace type with no args.
  A parent operation should be created for the landing page.
  """
  inventory: InventoryQueries!
}
