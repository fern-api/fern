openapi: 3.0.3
info: { title: TwiML repro, version: "1.0" }
paths: {}
components:
  schemas:
    VoiceResponse:
      type: object
      description: <Response> TwiML for Voice
      xml: { name: Response }
      properties:
        children:
          type: array
          description: Nested TwiML elements, rendered in order.
          items:
            oneOf:
              - $ref: "#/components/schemas/Say"
              - $ref: "#/components/schemas/Hangup"
          xml: { wrapped: false }
      example:
        children:
          - voice: alice
            message: Thanks for calling.
          - {}
    Say:
      type: object
      description: <Say> TwiML Verb
      xml: { name: Say }
      properties:
        voice:
          type: string
          enum: [man, woman, alice]
          xml: { name: voice, attribute: true }
          example: alice
        loop:
          type: integer
          xml: { name: loop, attribute: true }
          example: 2
        message:
          type: string
          example: Thanks for calling.
      example:
        voice: alice
        loop: 2
        message: Thanks for calling.
    Hangup:
      type: object
      description: <Hangup> TwiML Verb
      xml: { name: Hangup }
      properties: {}
    Pause:
      type: object
      description: <Pause> no schema example, property example only
      xml: { name: Pause }
      properties:
        length:
          type: integer
          xml: { attribute: true }
          example: 5
        label:
          type: string
          xml: { attribute: true }
