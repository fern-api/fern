openapi: 3.0.0
info:
  title: Plants
  version: "1.0"
paths:
  /plants:
    get:
      operationId: listPlants
      responses:
        "200":
          description: OK
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /plants/{id}:
    get:
      operationId: getPlant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
