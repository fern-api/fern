openapi: 3.0.0
info:
  title: Video
  version: "1.0"
servers:
  - url: https://api.example.com
paths:
  /egress:
    get:
      operationId: listEgressStreams
      tags:
        - Video
      responses:
        "200":
          description: OK
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createEgressStream
      tags:
        - Video
      responses:
        "200":
          description: OK
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableBody"
                nullable: true
components:
  responses:
    TooManyRequests:
      x-fern-sdk-namespace: video
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              retryAfter:
                type: integer
  schemas:
    ServiceUnavailableBody:
      x-fern-sdk-namespace: video
      type: object
      properties:
        retryAfter:
          type: integer
