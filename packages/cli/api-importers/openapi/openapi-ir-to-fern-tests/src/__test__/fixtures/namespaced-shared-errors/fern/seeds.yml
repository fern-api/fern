openapi: 3.0.0
info:
  title: Seeds
  version: "1.0"
paths:
  /seeds:
    get:
      operationId: listSeeds
      responses:
        "200":
          description: OK
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TooManyRequests"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailable"
  /seeds/{id}:
    get:
      operationId: getSeed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableWithRetry"
components:
  schemas:
    TooManyRequests:
      type: object
      properties:
        message:
          type: string
    Unavailable:
      type: object
      properties:
        reason:
          type: string
    UnavailableWithRetry:
      type: object
      properties:
        reason:
          type: string
        retryAfterSeconds:
          type: integer
