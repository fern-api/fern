openapi: 3.0.3
info:
  title: Discriminated union variants declared as a bare allOf reference
  version: 1.0.0
paths:
  /thing:
    get:
      operationId: getThing
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holder"
        "400":
          description: err
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseError"
components:
  schemas:
    BaseError:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
        message:
          type: string
      discriminator:
        propertyName: type
        mapping:
          WithProps: "#/components/schemas/WithProps"
          EmptyObj: "#/components/schemas/EmptyObj"
          BareRef: "#/components/schemas/BareRef"
          DescribedRef: "#/components/schemas/DescribedRef"
          TitledRef: "#/components/schemas/TitledRef"
    # a variant that adds properties of its own
    WithProps:
      allOf:
        - $ref: "#/components/schemas/BaseError"
        - type: object
          properties:
            detail:
              type: string
    # a variant that adds nothing, spelled with a trailing empty object
    EmptyObj:
      allOf:
        - $ref: "#/components/schemas/BaseError"
        - type: object
    # the same variant, spelled as a bare reference. This must not short-circuit to an
    # alias of BaseError: the variant would then refer to the union it belongs to, and
    # every generator would expect the payload under a `value` key.
    BareRef:
      allOf:
        - $ref: "#/components/schemas/BaseError"
    # the same again, but carrying a description on the allOf wrapper. Sibling keys next to
    # allOf are a common trigger for the schema being copied before it is converted; the
    # guard compares object identity, so this pins that the variant is still recognised.
    DescribedRef:
      description: a variant that describes itself
      allOf:
        - $ref: "#/components/schemas/BaseError"
    # and with a title, which is what drives generated naming
    TitledRef:
      title: Titled
      allOf:
        - $ref: "#/components/schemas/BaseError"
    # not a variant - a single-reference allOf used only to attach `nullable`. This must
    # still short-circuit to a reference to BaseError.
    Holder:
      type: object
      properties:
        nullableError:
          allOf:
            - $ref: "#/components/schemas/BaseError"
          nullable: true
      required:
        - nullableError
