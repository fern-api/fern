openapi: 3.0.3
info:
  title: Test spec for the preserve-any-of-as-union setting.
  version: 1.0.0

paths:
  /domain:
    patch:
      operationId: UpdateDomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDomainRequest"
      responses:
        "204":
          description: Accepted.

components:
  schemas:
    # An "at least one of" constraint over sibling properties. The setting opts
    # out of converting it as an object, so it stays an undiscriminated union.
    UpdateDomainRequest:
      type: object
      properties:
        autorenewEnabled:
          type: boolean
        privacyEnabled:
          type: boolean
        locked:
          type: boolean
      anyOf:
        - properties:
            autorenewEnabled:
              type: boolean
          required:
            - autorenewEnabled
        - properties:
            privacyEnabled:
              type: boolean
          required:
            - privacyEnabled
        - properties:
            locked:
              type: boolean
          required:
            - locked
