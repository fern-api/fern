openapi: 3.0.0
info:
  title: AllOf/OneOf/AnyOf Edge Cases
  version: 1.0.0

paths:
  /extended:
    post:
      operationId: createExtended
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Extended"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extended"

  /pet:
    post:
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /flexible:
    post:
      operationId: createFlexible
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlexibleValue"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexibleValue"

components:
  schemas:
    Base:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id

    Extended:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
          required:
            - name

    Level1:
      type: object
      properties:
        field1:
          type: string

    Level2:
      allOf:
        - $ref: "#/components/schemas/Level1"
        - type: object
          properties:
            field2:
              type: string

    Level3:
      allOf:
        - $ref: "#/components/schemas/Level2"
        - type: object
          properties:
            field3:
              type: string

    Dog:
      type: object
      properties:
        petType:
          type: string
          enum:
            - dog
        bark:
          type: boolean
      required:
        - petType

    Cat:
      type: object
      properties:
        petType:
          type: string
          enum:
            - cat
        meow:
          type: boolean
      required:
        - petType

    Pet:
      oneOf:
        - $ref: "#/components/schemas/Dog"
        - $ref: "#/components/schemas/Cat"
      discriminator:
        propertyName: petType

    Response:
      oneOf:
        - type: object
          properties:
            success:
              type: boolean
            data:
              type: string
        - type: object
          properties:
            error:
              type: string
            code:
              type: integer

    FlexibleValue:
      anyOf:
        - type: string
        - type: number
        - type: object
          properties:
            complex:
              type: boolean

    NullableAnyOf:
      anyOf:
        - type: string
        - type: number
      nullable: true

    Complex:
      allOf:
        - $ref: "#/components/schemas/Base"
        - oneOf:
            - type: object
              properties:
                typeA:
                  type: string
            - type: object
              properties:
                typeB:
                  type: number

    # Reproduces getbrevo/brevo-python#20: allOf + oneOf with not:{} for mutual exclusion
    SendTransacSms:
      allOf:
        - type: object
          properties:
            recipient:
              description: Mobile number to send SMS with the country code
              type: string
            sender:
              description: Name of the sender
              type: string
          required:
            - recipient
            - sender
        - oneOf:
            - type: object
              required:
                - templateId
              properties:
                templateId:
                  description: Template ID to send SMS
                  type: integer
                content:
                  not: {}
            - type: object
              required:
                - content
              properties:
                content:
                  description: Content of the message
                  type: string
                templateId:
                  not: {}

    # Edge case: string property narrowing via allOf on a single property
    RuleExecutionContext:
      type: string
      enum:
        - prod
        - staging
        - dev

    RuleConfig:
      type: object
      properties:
        name:
          type: string
        executionContext:
          allOf:
            - $ref: "#/components/schemas/RuleExecutionContext"
            - type: string
              pattern: "^(?!prod$)[a-z0-9_-]+$"

    # Reproduces allOf narrowing array items without redeclaring type: array
    PaginatedList:
      type: object
      properties:
        results:
          type: array
          items: {}

    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    ItemList:
      allOf:
        - $ref: "#/components/schemas/PaginatedList"
        - properties:
            results:
              items:
                $ref: "#/components/schemas/Item"

    # Edge case: override explicitly includes type: array alongside items narrowing
    ItemListExplicitType:
      allOf:
        - $ref: "#/components/schemas/PaginatedList"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Item"

    # Reproduces namedotcom/core-api-go#6: an anyOf that constrains its own sibling
    # properties to "at least one of" rather than introducing variants. A body may
    # carry several of them, so this converts as the object it declares.
    UpdateDomainRequest:
      type: object
      properties:
        autorenewEnabled:
          type: boolean
        privacyEnabled:
          type: boolean
        locked:
          type: boolean
      anyOf:
        - properties:
            autorenewEnabled:
              type: boolean
          required:
            - autorenewEnabled
        - properties:
            privacyEnabled:
              type: boolean
          required:
            - privacyEnabled
        - properties:
            locked:
              type: boolean
          required:
            - locked

    # A branch introducing a property the siblings do not declare is a real
    # variant, so this stays a union.
    AnyOfBranchAddsProperty:
      type: object
      properties:
        a:
          type: boolean
      anyOf:
        - properties:
            a:
              type: boolean
          required:
            - a
        - properties:
            b:
              type: boolean
          required:
            - b

    # Branches narrowing a shared property to different values are variants too,
    # so this stays a union rather than losing the discriminant.
    AnyOfBranchNarrowsProperty:
      type: object
      properties:
        kind:
          type: string
        value:
          type: string
      anyOf:
        - properties:
            kind:
              enum:
                - a
          required:
            - kind
        - properties:
            kind:
              enum:
                - b
          required:
            - kind
