openapi: 3.0.0
info:
  title: Acme API
  version: "1.0"
servers:
  - url: https://prod.acme.com
    x-fern-server-name: Prod
  - url: https://dev.acme.com
    x-fern-server-name: Dev
x-fern-base-url-env: ACME_BASE_URL
paths:
  /widgets:
    get:
      operationId: listWidgets
      servers:
        - url: https://debug.acme.com
          x-fern-server-name: Debug
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
