auth-schemes:
  PlantOAuth:
    scheme: oauth
    type: client-credentials
    get-token:
      endpoint: POST /oauth/token
      request-properties:
        client-id: $request.client_id
        client-secret: $request.client_secret
      response-properties:
        access-token: $response.access_token
        expires-in: $response.expires_in
  PlantApiKey:
    header: X-Plant-Token
    name: apiKey
api:
  auth:
    endpoint-security: {}
  specs:
    - openapi: ../openapi.yml
