# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: ../openapi.yml
  environments:
    Production:
      urls:
        rest: https://api.acme.com
        scim: https://scim.acme.com
    Sandbox:
      urls:
        rest: https://sandbox.acme.com
        scim: https://scim-sandbox.acme.com
  default-environment: Production
  default-url: rest
