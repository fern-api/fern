openapi: 3.1.0
info:
  version: 1.0.0
  title: Response Headers Test API
servers:
  - url: https://api.test.com
    description: Test API
paths:
  /users:
    get:
      operationId: listUsers
      summary: List all users
      responses:
        "200":
          description: A list of users
          headers:
            X-Request-Id:
              description: Unique request identifier
              schema:
                type: string
              example: "abc-123"
            X-Rate-Limit-Remaining:
              description: Number of requests remaining
              schema:
                type: integer
              example: 99
            X-Is-Cached:
              description: Whether the response was cached
              schema:
                type: boolean
              example: true
            X-Rate-Limit-Policy:
              description: Rate limit policy applied to the request
              deprecated: true
              schema:
                $ref: "#/components/schemas/RateLimitPolicy"
            X-Required-Policy:
              description: Mandatory rate limit policy header
              required: true
              schema:
                $ref: "#/components/schemas/RateLimitPolicy"
            X-Required-Count:
              description: Mandatory primitive header
              required: true
              schema:
                type: integer
            X-Account-Info:
              description: JSON-encoded account metadata
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/AccountInfo"
            X-Score:
              description: Request score
              schema:
                type: number
            X-Quota:
              description: Quota with a schema-level default
              schema:
                type: integer
                default: 100
            X-Tags:
              description: Comma-independent list of tags
              schema:
                type: array
                items:
                  type: string
            X-Inline-Info:
              description: Inline object schema header
              schema:
                type: object
                required:
                  - reason
                properties:
                  reason:
                    type: string
                  source:
                    type: string
            X-Trace:
              $ref: "#/components/headers/TraceHeader"
            X-Beta-Feature:
              description: Beta feature flag header
              x-fern-availability: beta
              schema:
                type: string
            X-Plain-Only:
              description: Non-JSON content is not treated as a schema
              content:
                text/plain:
                  schema:
                    type: object
                    properties:
                      note:
                        type: string
            X-Mixed-Content:
              description: JSON entry wins when content has multiple media types
              content:
                text/plain:
                  schema:
                    type: string
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorInfo"
            X-No-Schema:
              description: Header with no schema or content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /users/{userId}:
    get:
      operationId: getUser
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A user
          headers:
            X-Request-Id:
              description: Unique request identifier
              schema:
                type: string
            X-Last-Modified:
              description: When the user was last modified
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          headers:
            X-Request-Id:
              description: Unique request identifier
              schema:
                type: string
            X-Error-Info:
              description: JSON-encoded error metadata
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorInfo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  headers:
    TraceHeader:
      description: Shared trace header resolved via components/headers
      required: true
      schema:
        $ref: "#/components/schemas/TraceInfo"
  schemas:
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: integer
    RateLimitPolicy:
      type: string
      enum:
        - burst
        - steady
        - adaptive
    AccountInfo:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: string
        displayName:
          type: string
        tier:
          type: string
          nullable: true
    ErrorInfo:
      type: object
      required:
        - traceId
      properties:
        traceId:
          type: string
        retryAfterSeconds:
          type: integer
    TraceInfo:
      type: object
      required:
        - traceId
      properties:
        traceId:
          type: string
        spanId:
          type: string
