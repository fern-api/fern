service:
  base-path: /
  auth: true
  endpoints:
    a:
      path: ""
      method: GET
      examples:
        - {}
        - request: 123
    b:
      path: ""
      method: GET
      request: optional<integer>
      examples:
        - {}
        - request: 123
    c:
      path: ""
      method: GET
      request:
        body: string
      examples:
        - {}
        - request: 123
        - request: hello
    d:
      path: ""
      method: GET
      request:
        body:
          extends: ObjectWithFoo
          properties:
            bar: string
      examples:
        - request: 123
        - request: {}
        - request:
            foo: 123
            bar: hello
            extraProperty: true
    e:
      path: ""
      method: GET
      request:
        body:
          optional: true
          properties:
            foo: integer
      examples:
        - {}
        - request:
            foo: 123
    f:
      path: ""
      method: GET
      request:
        body:
          properties:
            foo: optional<integer>
      examples:
        - {}
    g:
      path: ""
      method: GET
      request:
        body: optional<ObjectWithFoo>
      examples:
        - {}
        - request:
            foo: 123

types:
  ObjectWithFoo:
    properties:
      foo: integer
