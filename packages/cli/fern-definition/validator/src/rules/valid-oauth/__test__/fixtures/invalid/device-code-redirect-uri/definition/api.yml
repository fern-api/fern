name: device-code-redirect-uri
auth: OAuthScheme
auth-schemes:
  OAuthScheme:
    scheme: oauth
    type: device-code
    client-id: "public-client-id"
    device-authorization-url: https://auth.example.com/device/code
    token-url: https://auth.example.com/token
    redirect-uri: http://127.0.0.1:8484/callback
