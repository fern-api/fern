name: client-credentials-callback-redirect-urls
imports:
  auth: auth.yml

auth: OAuthScheme
auth-schemes:
  OAuthScheme:
    scheme: oauth
    type: client-credentials
    get-token:
      endpoint: auth.getTokenWithClientCredentials
      response-properties:
        access-token: $response.access_token
        expires-in: $response.expires_in
    success-redirect-url: https://acme.com/cli/welcome
    error-redirect-url: https://acme.com/cli/error
