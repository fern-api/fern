name: callback-redirect-urls
auth: OAuthScheme
auth-schemes:
  OAuthScheme:
    scheme: oauth
    type: authorization-code
    client-id: "public-client-id"
    authorization-url: https://auth.example.com/authorize
    token-url: https://auth.example.com/token
    redirect-uri: http://127.0.0.1:8484/callback
    success-redirect-url: https://acme.com/cli/welcome
    error-redirect-url: https://acme.com/cli/error
