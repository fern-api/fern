# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    The `fern init` setup wizard now asks what to set up with a checklist of SDKs, Docs, and CLI. Picking CLI adds a `cli` target to `fern/sdk-config.yml` and generates it into `cli/` in the same step as SDKs.
  type: feat
- summary: |
    The `fern init` setup wizard's docs site now keeps the docs starter and your company's logo, favicon, and accent color. Before, the API step also created a basic docs.yml first, which the starter left in place, and new projects with `fern/sdk-config.yml` also got the starter's sample Plant Store API.
  type: fix
- summary: |
    When your Fern login has expired, the `fern init` setup wizard now signs you in again and repeats the brand search, instead of skipping your company's branding.
  type: fix
- summary: |
    The `fern init` setup wizard now shows the logo, favicon, and accent color it found for your company and asks before using them, so you can choose a different company or keep the starter branding.
  type: feat
- summary: |
    The `fern init` setup wizard now generates only the `fern/sdk-config.yml` targets it set up (SDKs and the CLI), so another target in the file, such as an MCP server, can't stop them from generating.
  type: fix
- summary: |
    When a `fern` command fails during the `fern init` setup wizard, the wizard now shows the reason Fern printed after the error and saves the command's full output to `~/.fern/logs/`.
  type: fix
- summary: |
    In a new project, the `fern init` setup wizard now lets you uncheck TypeScript when picking SDK languages. Before, it showed the TypeScript target that `fern init` adds to every new `fern/sdk-config.yml` as "already set up" and always generated it.
  type: fix
