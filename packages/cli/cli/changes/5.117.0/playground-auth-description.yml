- summary: |
    Add support for playground-specific auth documentation. Set `x-fern-playground-description` on an
    OpenAPI security scheme (or `playground-docs` on a Fern definition auth scheme) to render text below
    that scheme's input in the API playground, leaving the API reference's authorization description
    (`description`/`docs`) untouched. Applies to bearer, basic, header, and OAuth client-credentials
    schemes. Supports a markdown subset: `[label](url)` links (absolute or relative), bare URLs,
    `inline code`, and blank-line-separated paragraphs.
  type: feat
