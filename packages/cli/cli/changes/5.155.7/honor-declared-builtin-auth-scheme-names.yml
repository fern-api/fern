# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    An auth scheme declared under the name `bearer`, `basic` or `oauth` in `auth-schemes` is now
    used when `api.auth` references it. Previously the reference resolved to the built-in shorthand
    of the same name and dropped the declaration, so settings such as `token.env` were lost and
    generators fell back to a derived environment variable (for example `<CLI_NAME>_TOKEN`).
    A declared auth scheme's `docs` now also reach the IR when the reference itself has no `docs`.
  type: fix
