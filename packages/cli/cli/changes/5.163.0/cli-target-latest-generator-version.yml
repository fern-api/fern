# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    An sdk-config.yml `cli` target without `generatorVersion` now generates with the newest fern-cli-generator the
    route can run, like an unpinned generator in generators.yml: the translated generator is written as
    `version: latest`, which sdk-gen-api resolves through its generator version discovery, and Fiddle and `--local`
    resolve to the newest published version. Previously it was pinned to 0.49.0, which predates the crate-name,
    installer URL, npm publish and build-attestation fixes. The `CLI_TARGET_UNPOOLED_VERSION` warning is removed.
  type: feat
