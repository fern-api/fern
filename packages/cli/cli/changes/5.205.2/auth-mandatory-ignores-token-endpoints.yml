# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    `sdkConfig.isAuthMandatory` no longer turns off because an OAuth or inferred auth scheme's
    `get-token` (or `refresh-token`) endpoint is unauthenticated. Those endpoints are called by the
    SDK's own auth flow, so an API where every other endpoint requires auth now generates SDKs that
    require credentials instead of silently sending unauthenticated requests.
  type: fix
