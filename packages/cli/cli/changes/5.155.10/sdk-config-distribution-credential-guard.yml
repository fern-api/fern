- summary: |
    SDK Config generation no longer uploads `output.github.credentials` (root or target level) in the
    SDK Config document sent to the SDK Generation API; GitHub delivery is unchanged because the
    service already discarded them. Malformed `github.credentials` is rejected without echoing its
    value. CLI `output.distribution` secret names are never resolved or sent as publish credentials.
  type: fix
