- summary: |
    C/C++ library docs: structs show their `typedef struct X X;` line, anonymous `enum { ... }`
    values are listed on the enums index, and array extents are kept on struct fields (with the
    matching parser release). New cpp `config:` options: `organize-by: header` writes a `headers/`
    folder with one page per source header; `include`, `exclude` and `exclude-symbols` select which
    files and symbols are parsed (Doxygen `INPUT` / `EXCLUDE` / `EXCLUDE_PATTERNS` / `EXCLUDE_SYMBOLS`).
    `include-undocumented-macros: true` remains the way to render `#define`s without a Doxygen comment.
  type: feat
