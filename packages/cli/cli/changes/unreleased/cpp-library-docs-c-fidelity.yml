- summary: |
    C/C++ library docs keep existing URLs stable when a symbol with a colliding name is added.
    The plain URL goes to the name it represents most closely (`foo_bar` over `foo__bar`, public
    names over `_`-prefixed ones); every other colliding symbol, header, or group gets a short
    suffix derived from its own name instead of `-2`, `-3`, so adding or removing a symbol never
    moves another page. Pages that previously ended in `-2`, `-3` move once to the new suffix.
  type: fix
- summary: |
    C/C++ library docs render typedefs the way they were declared: `typedef uint8_t SeverityLevel;`
    and `typedef enum doca_error doca_error_t;` stay C typedefs even in libraries that also contain
    C++ symbols, and untagged structs show `typedef struct { ... } AnonymousPacket;`. Header pages
    list the enumerators of unnamed enums. Requires the matching C/C++ parser update.
  type: fix
