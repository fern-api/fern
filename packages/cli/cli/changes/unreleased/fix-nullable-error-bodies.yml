# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Fix OpenAPI error bodies being generated as `unknown` when the referenced schema is
    declared `nullable: true`. Two responses referring to the same nullable schema are no
    longer treated as conflicting shapes, so SDKs expose the typed error body (e.g.
    `Body *MyError` in Go) instead of `any`.

    Note that this changes the error body type in generated SDKs for APIs with nullable error
    schemas, so consumer code that asserted on the untyped body (e.g.
    `err.Body.(map[string]any)`) will no longer compile; those SDKs may warrant a major bump.
  type: fix
