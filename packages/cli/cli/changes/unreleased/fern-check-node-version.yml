# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    `fern check` now fails with a clear `[system]` error (rule `supported-node-version`) when the
    Node.js version running the CLI is outside the supported range (20.x-24.x), instead of hanging or
    exiting early on unsupported runtimes such as Node 26. The error is also reported under
    `results.system` in `fern check --json`.
  type: fix
