# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Add `endpoint-index-pages` to the `api` navigation item in docs.yml. When enabled, the API
    Reference gets an "All Endpoints" page listing every endpoint grouped by section, and each
    section's summary page gets an "Endpoints" list (a summary page is generated for sections
    that don't have one; existing summaries and tag-description pages keep their content, with
    the list appended below). Each row links to the endpoint page and shows the HTTP method,
    path, the first sentence of the description, and a marker for deprecated or beta endpoints.
    Hidden endpoints and endpoints filtered out by audiences are left out, matching the sidebar.
  type: feat
