# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Fix the autogenerated example for `date-time-rfc-2822` fields: `Tue, 15 Jan 2024 09:30:00 +0000`
    named the wrong weekday (15 January 2024 is a Monday), so strict RFC 2822 parsers such as .NET's
    `DateTime.Parse` rejected it and generated wire tests failed. The example is now
    `Mon, 15 Jan 2024 09:30:00 +0000`.
  type: fix
