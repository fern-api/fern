- summary: |
    Honor `required` on OpenAPI response headers: header value types are only wrapped in
    `optional` when the Header Object does not declare `required: true`, matching the
    request-parameter behavior. Response headers now also pick up declared examples —
    `example`/`examples` on the header's `content` Media Type Object and on the referenced
    schema (through `$ref`) — so docs render real examples for complex header types instead
    of autogenerated placeholders.
  type: fix
