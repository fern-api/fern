- summary: |
    `fern org get` now names the org, shows when the CLI version policy was last updated, and says
    whether the running CLI meets it (e.g. `Org "acme" requires Fern CLI >= 5.106.0 (updated
    2026-08-26). This CLI (5.140.2) meets this policy.`), so the output no longer reads like an error.
  type: fix
