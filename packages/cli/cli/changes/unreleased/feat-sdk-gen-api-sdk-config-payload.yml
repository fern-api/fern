# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    `fern generate` builds the SDK Config v1 payload for sdk-gen-api-only generators
    (`fernapi/fern-mcp-server` 0.1.0+) from `generators.yml` in memory, using the same
    mapping as `fern sdk migrate`, so hosted MCP servers need no separate SDK Config
    document. An explicit `fern generate --sdk-config <path>` is still honored, and every
    other generator keeps that explicit flow. The mapper moves to
    `@fern-api/remote-workspace-runner` and is re-exported for `fern sdk migrate`.
  type: feat
