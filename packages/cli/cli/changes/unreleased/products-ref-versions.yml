# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Git-ref-backed versions (`ref:`) now work under `products[].versions`. The CLI locates the same
    product in the ref's docs.yml (by slug, else display name) and builds that product's working-tree
    version, falling back to the product file's navigation. At any scope, the first `path:` version
    at the ref is used, so refs whose docs.yml lists older `ref:` entries first resolve correctly.
  type: fix
