# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Discover docs configuration problems in `fern sdk migrate` before anything is written, so a
    failed migration no longer leaves a half-migrated project behind. The command now reads, parses,
    and validates every docs file it intends to touch -- the root docs configuration plus each
    referenced version and product file -- and serializes the results in memory before it creates
    `sdk-config.yml`, applying the docs edits only after the SDK Config write succeeds. Previously the
    SDK Config was written first and each docs file was written as it was visited, so an unsupported
    API import setting or an unparseable version file left `sdk-config.yml` and any
    already-visited docs file on disk while the command exited non-zero. The hard errors themselves
    are unchanged: custom API import settings that a direct `docs.yml` spec cannot represent are
    still refused, only sections associated with the migrated API are inspected, and the existing
    `--force` protection on an existing `sdk-config.yml` still applies before any docs file changes.
  type: fix
