- summary: |
    `fern generate --local` now supports `FERN_CA_BUNDLE`: set it to a PEM CA bundle on the host and the file is
    mounted read-only into the generator container with `NODE_EXTRA_CA_CERTS`, `SSL_CERT_FILE` and `GIT_SSL_CAINFO`
    pointing at it. This lets network calls made *inside* the generator container succeed behind a corporate
    TLS-interception proxy: `pnpm install` (TypeScript), `go mod tidy` (Go), `dotnet format`'s implicit NuGet
    restore (C#), and the `git clone` of a self-hosted SDK repo used to merge the existing README.
    The file must be a complete bundle (system CA certificates plus the corporate CA) since
    `SSL_CERT_FILE`/`GIT_SSL_CAINFO` replace the default trust store; the CLI warns when the file holds only a
    handful of certificates and fails fast if the path is unreadable. The JVM ignores these variables, so the CLI
    also warns for Java generators, whose Gradle steps need `FERN_JAVA_SKIP_FORMATTING=true` on such networks.
    The path is a bind mount, so it must be visible to the Docker daemon running the generator: this works with a
    local daemon (Docker Desktop, a runner with Docker installed) but not with a remote `DOCKER_HOST` or a
    Docker-in-Docker sidecar that cannot see the host filesystem.
  type: feat
- summary: |
    Environment variables passed to local generator containers are no longer wrapped in literal quote characters
    (`-e KEY="value"`), which previously leaked the quotes into the value seen by the generator.
  type: fix
