- summary: |
    `fern generate --local` now forwards the host's CA bundle configuration into the generator container.
    If `NODE_EXTRA_CA_CERTS`, `SSL_CERT_FILE`, or `GIT_SSL_CAINFO` points at a PEM file on the host, that file
    is mounted read-only into the container and the same variable is set inside it, so git and Node inside the
    generator trust corporate TLS interception CAs (e.g. when cloning a self-hosted SDK repo to merge its README).
    Each variable is forwarded independently, preserving its semantics (`NODE_EXTRA_CA_CERTS` extends the default
    trust store; `SSL_CERT_FILE`/`GIT_SSL_CAINFO` replace it and should point at a complete bundle).
  type: feat
