# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    `fern check` no longer reports valid examples as invalid when a schema uses
    `patternProperties` (OpenAPI 3.1 / JSON Schema). Example keys that match a
    `patternProperties` regex are now accepted instead of being flagged as
    unexpected additional properties — including under `additionalProperties: false`.
  type: fix
