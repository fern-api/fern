- summary: |
    Fix the direct OpenAPI-to-IR importer (used for docs) producing a nested `<namespace> > <namespace>`
    group when a spec has `namespace` set. Two causes: an operation tag matching the namespace
    (case-insensitively, e.g. tag `Video` with `namespace: video`) was treated as a sub-group, and
    schema types were placed in a phantom `namespace/namespace` subpackage because the namespace was
    prefixed twice. Endpoints and types now sit directly in the namespace package, matching the SDK importer.
  type: fix
