- summary: |
    Add `FERN_DISABLE_SDK_GEN_API=true` to keep every generator off sdk-gen-api for a run, regardless of the
    `use-sdk-gen-api` feature flag. Generation routes to Fiddle, generator upgrades use FDR versions, and no flag
