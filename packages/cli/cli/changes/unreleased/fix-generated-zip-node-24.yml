# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    `fern generate` now writes every file of a generated SDK on Node 24. Before, unpacking the download could stop partway through a large file without an error, so the files after it were missing (for example, a generated CLI missing `src/output.rs` and failed to compile) while the command still reported success.
  type: fix
