# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    `fern generate --docs` no longer re-parses every OpenAPI spec of an API reference that sets
    `tag-description-pages: true`. Tag descriptions are now read straight from the specs' `tags`,
    which saves about a second per spec on large (4–5 MB) specs.
  type: fix
