- summary: |
    Add the `namespaced-errors` OpenAPI setting (default `false`). When enabled, an error whose body
    schema carries `x-fern-sdk-namespace` is declared in, and its shared-error conflict detection is
    scoped to, that namespace instead of the endpoint's. This lets each namespace get its own typed
    `TooManyRequestsError` etc. while endpoints and other types stay at the root.
  type: feat
