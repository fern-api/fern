# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    The OpenAPI importer used for SDK generation now honors `4XX` and `5XX` wildcard error
    responses instead of silently dropping them. Wildcards are imported as `ClientRequestError`
    (covers 400-499) and `ServerError` (covers 500-599), and a concrete status code declared
    alongside a wildcard always takes precedence. Fern Definition `errors` now accept
    `status-code: 4XX` / `status-code: 5XX` as well.
  type: feat
