- summary: |
    Show the sdk-gen-api error code in `fern generate` build submission and polling failures, and report HTTP 401 and 403 rejections as authentication errors and other HTTP 4xx rejections (except 408 and 429) as configuration errors instead of network errors.
  type: fix
