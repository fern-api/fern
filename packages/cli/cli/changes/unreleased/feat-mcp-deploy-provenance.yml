# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    `fern generate` now records provenance with every hosted MCP server deploy
    (`output: { location: fern-hosted }`): the generator's `config:` block, the git repository,
    branch, and commit the deploy was made from, and the CI run and deployer identity (the same
    headers docs publishing sends). When the generated bundle contains an `inputs/` directory,
    its spec archive, SDK config, and build request are uploaded alongside the server modules
    and linked to the deployment so it can be explained later from the dashboard.

    The CLI no longer binds uploaded modules to `mcp-servers/<slug>/...` paths in the registry.
    The deploy request registers content itself, so org members (not only admins) can deploy.
  type: feat
