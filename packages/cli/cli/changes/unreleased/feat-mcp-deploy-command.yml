# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Add `fern mcp deploy <bundle-dir> [--slug <slug>] [--org <org>]`, which deploys an
    already-generated `fernapi/fern-mcp-server` bundle to Fern's hosted MCP platform and
    prints the server URL. This is the same deploy step `fern generate` runs for
    `output: { location: fern-hosted }`, exposed standalone so a bundle downloaded as a
    zip (e.g. from an SDK Config `delivery: zip` run) can be deployed without regenerating.
  type: feat
