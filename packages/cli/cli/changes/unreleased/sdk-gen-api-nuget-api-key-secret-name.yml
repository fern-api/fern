# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    SDK Config targets and generators.yml groups that publish a NuGet or RubyGems package through
    GitHub now carry the `api-key: ${SECRET_NAME}` secret name to sdk-gen-api, so the generated
    release workflow reads the API key from that repository secret instead of the default one. An
    `apiKey` in sdk-config.yml that is not an environment expression is rejected.

    A GitHub NuGet or RubyGems `api-key` in generators.yml is no longer resolved from the local
    environment. It names a repository secret that by design exists only in GitHub, so requiring it
    locally failed generation under the default `--require-env-vars`, and resolving it replaced the
    secret name with the key.
  type: fix
