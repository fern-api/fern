- summary: |
    Add a `valid-llms-txt` check to `fern check` that validates a custom root
    llms.txt (configured via `agents.llms-txt`) against the resolved navigation.
    It warns when a link points to a page that no longer exists, surfacing the
    silent drift that hand-maintained llms.txt files accumulate as pages move.
  type: feat
