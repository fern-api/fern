# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    Route generation through sdk-gen-api based on the `use-sdk-gen-api` PostHog feature flag instead of the
    `FERN_USE_SDK_GEN_API` environment variable and the `DEFAULT_USE_SDK_GEN_API` build default. The flag is
    evaluated per organization with the CLI release environment (`prod`, `pre-prod`, `beta`, `dev`, `local`) as a
    targeting property, and is off when PostHog is unreachable or the flag is not configured.
  type: feat
