# yaml-language-server: $schema=../../../../../fern-changes-yml.schema.json

- summary: |
    `products` can now be part of a global theme. `fern docs theme export` rewrites internal products to absolute
    links, and at publish time each site merges the theme's product list with its own: theme entries that point into
    the current site are swapped for the local internal product (so in-site navigation and highlighting keep working),
    products from other repos stay external links, and local products missing from the theme are appended. A theme
    entry may point either at a product URL (`https://host/repo/product`) or at the site root
    (`https://host/repo`), which resolves to the local product sharing the entry's display name, or to the
    only product when the site has just one. This lets a multi-repo setup show every product in every
    site's product switcher.
  type: feat
