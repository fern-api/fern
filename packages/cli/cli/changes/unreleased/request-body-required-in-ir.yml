- summary: |
    Carry an optional request body into the IR as `required: false` on the request body reference,
    rather than by wrapping the body type in `optional<T>`. `respect-optional-request-body` now
    emits `body: {type: Foo, optional: true}` in the generated Fern Definition, and hand-written
    `body: optional<Foo>` keeps its existing meaning that the body's value may be null.

    This is a no-op for generated SDKs today: the body type generators see is unchanged, so output
    is identical until a generator opts into reading the new field. It removes the need for each
    generator to unwrap `optional<T>` before deciding how to shape the request parameter, which is
    what made enabling the setting change calling conventions in some languages.
  type: feat
