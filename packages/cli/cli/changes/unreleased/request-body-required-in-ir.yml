- summary: |
    Carry an optional request body into the IR as `required: false` on the request body reference,
    rather than by wrapping the body type in `optional<T>`. `respect-optional-request-body` now
    emits `body: {type: Foo, optional: true}` in the generated Fern Definition, and hand-written
    `body: optional<Foo>` keeps its existing meaning that the body's value may be null.

    Definitions that do not set `respect-optional-request-body` are unaffected: the body type
    generators see is unchanged, so output is byte-identical.

    For definitions that do set it, the generated SDK changes. Python, Java and Rust previously
    got a different calling convention entirely — a `request=` object instead of flattened kwargs,
    `Optional<Body>` instead of `Body`, `&Option<Body>` instead of `&Body` — and are now back to
    the shape they have without the setting. TypeScript and C# lose the optional parameter
    (`request?: Body` becomes `request: Body`) until those generators opt into reading the new
    field; restoring it is a widening and therefore not breaking.
  type: feat
