- summary: |
    Add a way to model an omittable request body separately from its type. `HttpRequestBodyReference`
    gains an optional `required`, and `HttpReferencedRequestBodySchema` gains an `optional` flag that
    maps to `required: false`. This is distinct from `body: optional<Foo>`, which says the body's
    *value* may be null; `optional: true` says the *call* may omit the body entirely, so the request
    carries neither content nor a `Content-Type` header.

    Nothing changes in generated output. The OpenAPI importer still emits `optional<Foo>` for
    `respect-optional-request-body`, and no generator reads the new field yet. The field exists so
    that generators can adopt it one at a time, without each having to unwrap `optional<T>` before
    deciding how to shape the request parameter — which is what made enabling the setting change
    calling conventions in Python, Java and Rust.
  type: feat
