- summary: |
    Add `fern org set/get/unset` for org-level CLI version bounds — a floor
    (`cli-version-min`), ceiling (`cli-version-max`), or exact pin
    (`cli-version`). The CLI enforces bounds at the version-redirection layer,
    running every command within range (downloaded via `npx`). Bounds are
    cached on disk (24h TTL) and fail open, so they never block a build; this
    is a consistency nudge, not a security control (unauthenticated contexts
    are not enforced, and `FERN_IGNORE_ORG_VERSION_BOUNDS=true` bypasses it).
  type: feat
