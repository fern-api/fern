- summary: |
    Add `fern org set/get/unset` commands for org-level CLI version bounds: a
    minimum ("floor") via `cli-version-min`, a maximum ("ceiling") via
    `cli-version-max`, or an exact pin via `cli-version` (sets both). When an
    org sets bounds, the CLI enforces them at the version-redirection layer:
    every command runs within the allowed range automatically — bumped up to
    the floor or capped down to the ceiling — downloading that version via
    `npx` just like a pinned version. Bounds are cached on disk with a 24h TTL,
    fetched with a tight timeout, and fail open, so they never block a build
    when the registry is unreachable or the user is unauthenticated. Set
    `FERN_IGNORE_ORG_VERSION_BOUNDS=true` to bypass. `fern upgrade` also keeps
    the project within the bounds.
  type: feat
