- summary: |
    Honor declared examples on OpenAPI response headers. Media-type `example`/`examples`
    and `example`/`examples` on the referenced component schema now land in
    `userSpecifiedExamples` (matching request-header parameter parity) instead of being
    skipped, so an object-schema `examples` block like
    `examples: [{content_type: image/jpeg}]` on the header's `$ref`'d schema is used
    rather than generic per-property autogenerated values.
  type: fix
