name: api
error-discrimination:
  strategy: status-code
auth: HeaderAuthScheme
auth-schemes:
  HeaderAuthScheme:
    header: X-Api-Key
    name: apiKey
    type: optional<string>
    env: API_KEY
default-environment: prod
default-url: Base
environments:
  prod:
    urls:
      Base: https://api.example.com/
      users: wss://api.example.com/v1/users
      payments: wss://api.example.com/v1/payments
      stream: wss://api.example.com/v1/stream
