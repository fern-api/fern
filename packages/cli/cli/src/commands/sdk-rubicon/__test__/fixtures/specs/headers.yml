openapi: 3.1.0
info: { title: Acme, version: "1" }
x-fern-global-headers:
  - header: X-Global-Header
    name: globalHeader
x-fern-global-parameters:
  - name: tenant
    in: header
    target: X-Tenant-Id
  - name: X-Region
    in: header
  - name: page
    in: query
paths:
  /widgets:
    parameters:
      - { name: X-Path-Header, in: header, schema: { type: string } }
    get:
      operationId: listWidgets
      parameters:
        - { name: X-Op-Header, in: header, schema: { type: string } }
        - $ref: "#/components/parameters/RefHeader"
      responses: { "200": { description: ok } }
components:
  parameters:
    RefHeader: { name: X-Ref-Header, in: header, schema: { type: string } }
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-Api-Key }
    bearer: { type: http, scheme: bearer }
