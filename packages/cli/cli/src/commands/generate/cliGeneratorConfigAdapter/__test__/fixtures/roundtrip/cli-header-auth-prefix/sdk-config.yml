schemaVersion: sdk-config/v1
sdkName: api
source:
  specs:
    - id: openapi
      type: openapi
      path: ./openapi.yml
api:
  auth:
    schemes:
      - id: apiKey
        type: api-key
        location: header
        name: X-Api-Key
        prefix: Key
        environmentVariable: HEADER_PREFIX_CLI_KEY
    requirements:
      - schemes:
          - apiKey
generation:
  wireTests:
    enabled: true
targets:
  - language: cli
    output:
      delivery: files
      path: ../out
    generation:
      binaryName: header-prefix-cli
