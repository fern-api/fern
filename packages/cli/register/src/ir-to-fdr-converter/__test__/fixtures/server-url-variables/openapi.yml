openapi: 3.0.3
info:
  title: Server URL Variables API
  version: 1.0.0
servers:
  - url: https://{tenant-domain}/{version}
    x-fern-server-name: Production
    variables:
      tenant-domain:
        default: api.example.com
      version:
        default: v1
        enum:
          - v1
          - v2
paths:
  /plants:
    get:
      operationId: listPlants
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: string
