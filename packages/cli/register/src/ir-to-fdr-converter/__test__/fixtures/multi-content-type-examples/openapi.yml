openapi: 3.1.0
info:
  title: Multi Content Type Examples
  version: 1.0.0
paths:
  /clients:
    post:
      operationId: clients_create
      tags:
        - Clients
      summary: Create client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
            examples:
              NewClientJson:
                summary: Plain JSON client
                value:
                  client:
                    name: "Acme Corp"
                    email: "contact@acme.com"
          application/ld+json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
            examples:
              NewClientJsonLd:
                summary: JSON-LD client with linked data context
                value:
                  "@context": "urn:example:governance-model#"
                  client:
                    "@type": "Client"
                    name: "Acme Corp"
                    email: "contact@acme.com"
      responses:
        "201":
          description: Client created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResponse"
              examples:
                CreatedClientJson:
                  summary: Plain JSON response
                  value:
                    client:
                      id: "client-123"
                      name: "Acme Corp"
                      email: "contact@acme.com"
            application/ld+json:
              schema:
                $ref: "#/components/schemas/ClientResponse"
              examples:
                CreatedClientJsonLd:
                  summary: JSON-LD response with linked data context
                  value:
                    "@context": "urn:example:governance-model#"
                    client:
                      "@type": "Client"
                      id: "client-123"
                      name: "Acme Corp"
                      email: "contact@acme.com"
components:
  schemas:
    ClientRequest:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/Client"
    ClientResponse:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/ClientWithId"
    Client:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      required:
        - name
        - email
    ClientWithId:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
      required:
        - id
        - name
        - email
