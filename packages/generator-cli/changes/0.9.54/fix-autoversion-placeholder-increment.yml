# yaml-language-server: $schema=../../../../fern-changes-yml.schema.json

- summary: |
    Never treat the magic placeholder version as a previous version when autoversioning.
    SDK repos that derive their published version from git tags at release time keep
    `0.0.0-fern-placeholder` committed in `package.json`/`.fern/metadata.json`, and because
    the placeholder parses as a valid semver pre-release it was advanced like one, stamping
    `0.0.0-fern-placeholder.0` into the generated manifests instead of a real version.
    Placeholder candidates are now skipped in every resolution source (pipeline
    `baseVersion`, diff extraction, `.fern/metadata.json`, git tags) so autoversion falls
    through to the next source, and `incrementVersion` rejects the placeholder outright.
  type: fix
