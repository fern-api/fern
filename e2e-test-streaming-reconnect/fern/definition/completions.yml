types:
  StreamEvent:
    properties:
      token: string
      index: integer

  StreamRequest:
    properties:
      query: string

service:
  base-path: /
  auth: false
  endpoints:
    stream:
      method: POST
      path: /stream
      request: StreamRequest
      response-stream:
        type: StreamEvent
        format: sse
        terminator: "[[DONE]]"
        resumable: true

    streamNoDrop:
      method: POST
      path: /stream-no-drop
      request: StreamRequest
      response-stream:
        type: StreamEvent
        format: sse
        terminator: "[[DONE]]"
        resumable: false
