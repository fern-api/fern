irVersion: v67
displayName: CLI
image: fernapi/fern-cli-generator
changelogLocation: ../../generators/cli/versions.yml

buildScripts:
  compileScript:
    commands:
      - cargo build --all-features --tests
  testScript:
    commands:
      - cargo test --all-features

publish:
  preBuildCommands:
    - pnpm turbo run dist:cli --filter @fern-api/cli-generator
  docker:
    file: ./generators/cli/Dockerfile
    image: fernapi/fern-cli-generator
    context: ./generators/cli

test:
  docker:
    image: fernapi/fern-cli-generator:latest
    command: pnpm turbo run dist:cli --filter @fern-api/rust-model && pnpm turbo run dockerTagLatest --filter @fern-api/cli-generator
  local:
    workingDirectory: generators/cli
    buildCommand:
      # Build rust-model dist first — the CLI's build.mjs copies
      # rust-model-cli.cjs into its own dist/ for subprocess invocation.
      - pnpm turbo run dist:cli --filter @fern-api/rust-model && pnpm turbo run dist:cli --filter @fern-api/cli-generator
    runCommand: node --enable-source-maps dist/cli.cjs {CONFIG_PATH}
    env:
      # In native (non-Docker) mode, the SDK template lives in the local
      # build output rather than the Docker image's /dist/sdk.
      FERN_SDK_TEMPLATE_DIR: dist/sdk

scripts:
  - image: fernapi/cli-seed
    commands:
      build:
        - cargo build --all-features --tests
      test:
        - cargo test --all-features

# Intentionally no `language:` field — setting it would make the
# local-workspace-runner emit per-language dynamic-snippet tests
# (`dynamic-snippets/example*.<ext>`) for every fixture. The CLI
# generator produces a CLI binary, not call-site snippets, so we leave
# `generatorInvocation.language` null and the runner skips the step.
generatorType: SDK
defaultOutputMode: local_files
defaultCustomConfig: {}

fixtures:
  # Fern-definition workspace (no raw OpenAPI specs mounted). Exercises
  # the generator's "skip cleanly" path — it logs and exits without
  # touching the output dir.
  simple-api:
    - customConfig: null
      outputFolder: no-custom-config
  # Single-spec OpenAPI workspace. Exercises the common case: the binary
  # name is auto-derived from spec `info.title` (kebab-cased), and the
  # mounted spec lands in `cli/<derived>/openapi0.json` with a codegen'd
  # `main.rs` referencing it via `.spec(...)`.
  query-parameters-openapi:
    - customConfig: null
      outputFolder: no-custom-config
    # Github output mode with npm publish info — verifies that the
    # generator emits `.github/workflows/ci.yml` and stamps the
    # resolved version into Cargo.toml.
    - customConfig: null
      outputFolder: github-npm
      outputMode: github
      outputVersion: "1.0.0"
      publishConfig:
        type: npm
        registryUrl: https://registry.npmjs.org
        packageName: "@fern/query-parameters-openapi"
        token: "${NPM_TOKEN}"
    # Github output mode WITHOUT npm publish info — verifies that the
    # generator emits a build+test-only `.github/workflows/ci.yml`
    # (check, compile, test jobs; no publish jobs).
    - customConfig: null
      outputFolder: github-no-publish
      outputMode: github
      outputVersion: "1.0.0"
  # Multi-spec fixture — declares two OpenAPI specs with NO namespaces.
  # `customConfig.binaryName` is REQUIRED for multi-spec (the generator
  # refuses to guess a single name across multiple titles).
  cli-multi-spec:
    - customConfig:
        binaryName: acme-cli
      outputFolder: no-custom-config
  # Multi-spec fixture WITH per-spec `namespace:` declarations.
  # `customConfig.binaryName` is REQUIRED for multi-spec.
  cli-multi-spec-namespaced:
    - customConfig:
        binaryName: acme-versioned
      outputFolder: no-custom-config

allowedFailures:
  # ENOTEMPTY: directory not empty error when seed tries to rmdir a websocket directory
  - query-parameters-openapi:github-npm
