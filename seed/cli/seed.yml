irVersion: v67
displayName: CLI
image: fernapi/fern-cli-generator
changelogLocation: ../../generators/cli/versions.yml

buildScripts:
  # `--locked` is load-bearing, not cosmetic: it makes seed fail when the
  # generated Cargo.lock does not resolve against the generated Cargo.toml.
  # Without it cargo silently re-resolves, so a lock missing a package still
  # built — while `cargo metadata --locked` and `cargo audit` failed in the
  # customer's repo, quietly disabling dependency auditing. See
  # patchCargoToml.ts, which derives the generated crates' lock stanzas from
  # their real manifests and fails generation if the shipped lock is short.
  compileScript:
    commands:
      - cargo build --locked --all-features --tests
  testScript:
    commands:
      - cargo test --locked --all-features

publish:
  preBuildCommands:
    - pnpm turbo run dist:cli --filter @fern-api/cli-generator
  docker:
    file: ./generators/cli/Dockerfile
    image: fernapi/fern-cli-generator
    context: ./generators/cli

test:
  docker:
    image: fernapi/fern-cli-generator:latest
    command: pnpm turbo run dist:cli --filter @fern-api/rust-model && pnpm turbo run dockerTagLatest --filter @fern-api/cli-generator
  local:
    workingDirectory: generators/cli
    buildCommand:
      # Build rust-model dist first — the CLI's build.mjs copies
      # rust-model-cli.cjs into its own dist/ for subprocess invocation.
      - pnpm turbo run dist:cli --filter @fern-api/rust-model && pnpm turbo run dist:cli --filter @fern-api/cli-generator
    runCommand: node --enable-source-maps dist/cli.cjs {CONFIG_PATH}
    env:
      # In native (non-Docker) mode, the SDK template lives in the local
      # build output rather than the Docker image's /dist/sdk.
      FERN_SDK_TEMPLATE_DIR: dist/sdk

scripts:
  - image: fernapi/cli-seed
    commands:
      build:
        - cargo build --all-features --tests
      test:
        - cargo test --all-features

# Intentionally no `language:` field — setting it would make the
# local-workspace-runner emit per-language dynamic-snippet tests
# (`dynamic-snippets/example*.<ext>`) for every fixture. The CLI
# generator produces a CLI binary, not call-site snippets, so we leave
# `generatorInvocation.language` null and the runner skips the step.
generatorType: SDK
defaultOutputMode: local_files
defaultCustomConfig: {}

fixtures:
  # Fern-definition workspace (no raw OpenAPI specs mounted). Exercises
  # the generator's "skip cleanly" path — it logs and exits without
  # touching the output dir.
  simple-api:
    - customConfig: null
      outputFolder: no-custom-config
  # Single-spec OpenAPI workspace. Exercises the common case: the binary
  # name is auto-derived from spec `info.title` (kebab-cased), and the
  # mounted spec lands in `cli/<derived>/openapi0.json` with a codegen'd
  # `main.rs` referencing it via `.spec(...)`.
  query-parameters-openapi:
    - customConfig: null
      outputFolder: no-custom-config
    # Split type crates where every type is root-level: they all land in the
    # core crate and the facade fronts it alone, with no leaves. Also the
    # regression fixture for root-level services owning nothing.
    - customConfig:
        splitTypeCrates: true
      outputFolder: with-split-type-crates
    # Github output mode with npm publish info — verifies that the
    # generator emits `.github/workflows/ci.yml` and stamps the
    # resolved version into Cargo.toml.
    - customConfig: null
      outputFolder: github-npm
      outputMode: github
      outputVersion: "1.0.0"
      publishConfig:
        type: npm
        registryUrl: https://registry.npmjs.org
        packageName: "@fern/query-parameters-openapi"
        token: "${NPM_TOKEN}"
    # Github output mode WITHOUT npm publish info — verifies that the
    # generator emits a build+test-only `.github/workflows/ci.yml`
    # (check, compile, test jobs; no publish jobs).
    - customConfig: null
      outputFolder: github-no-publish
      outputMode: github
      outputVersion: "1.0.0"
    # Homebrew + Scoop distribution, authenticating with a PAT. Github
    # output mode is required: both channels publish *from* a tagged GitHub
    # Release, so `runPipeline` drops the config outside it. Pins the three
    # artifacts the feature touches — the cargo-dist keys in
    # `dist-workspace.toml` and the `publish-homebrew-formula` and
    # `publish-scoop` jobs in `release.yml` — plus the README stanzas.
    # The diff on every *other* cli fixture must be empty: that is the
    # mechanical proof that omitting `distribution` changes nothing.
    - customConfig:
        distribution:
          homebrew:
            tap: acme/homebrew-tap
          scoop:
            bucket: acme/scoop-bucket
      outputFolder: github-distribution
      outputMode: github
      outputVersion: "1.0.0"
    # The same two channels authenticating with a GitHub App instead. Exists
    # so the committed `release.yml` shows the shape a consumer's own
    # pipeline takes: one `preflight-distribution` job, and a
    # `create-github-app-token` step per publish job scoped to its own repo
    # (`homebrew-tap` vs `scoop-bucket`). Diffing it against
    # `github-distribution` is also how the additive claim is checked at the
    # file level — everything outside `.github/workflows/release.yml` must
    # be identical between the two folders.
    - customConfig:
        distribution:
          githubApp:
            appIdSecret: PUBLISH_APP_ID
            privateKeySecret: PUBLISH_APP_PRIVATE_KEY
          homebrew:
            tap: acme/homebrew-tap
          scoop:
            bucket: acme/scoop-bucket
      outputFolder: github-distribution-app
      outputMode: github
      outputVersion: "1.0.0"
    # Opt-in wire tests — emits `wiremock/wire-test-cases.json` and
    # `tests/wire_test.rs`. seed's `cargo test --all-features` compiles and
    # runs the emitted suite (in-process wiremock, no docker), so this is the
    # "wire tests run on every generation" guarantee in CI.
    - customConfig:
        generateWireTests: true
      outputFolder: with-wire-tests
  # x-fern-global-parameters — exercises the global parameter codegen
  # path: IR-driven GlobalParameter[] → detectGlobalParams.ts →
  # .global_parameter(GlobalParameter { ... }) calls in main.rs.
  x-fern-global-parameters:
    - customConfig: null
      outputFolder: no-custom-config
  # Multi-spec fixture — declares two OpenAPI specs with NO namespaces.
  # `customConfig.binaryName` is REQUIRED for multi-spec (the generator
  # refuses to guess a single name across multiple titles).
  cli-multi-spec:
    - customConfig:
        binaryName: acme-cli
      outputFolder: no-custom-config
  # Multi-spec fixture WITH per-spec `namespace:` declarations.
  # `customConfig.binaryName` is REQUIRED for multi-spec.
  cli-multi-spec-namespaced:
    - customConfig:
        binaryName: acme-versioned
      outputFolder: no-custom-config
    # Namespaced multi-spec wire tests. Exercises the harness's command-prefix
    # resolution: each spec is bound under its own namespace (`v1`, `v2`), so
    # commands nest as `<bin> v1 users list` / `<bin> v2 users list`. Confirms
    # the harness prefixes resolved command chains with the spec namespace to
    # match the CLI's `.spec_under(<ns>, ...)` command tree.
    - customConfig:
        binaryName: acme-versioned
        generateWireTests: true
      outputFolder: with-wire-tests
    # One type crate per API behind a facade, instead of a single crate holding
    # every type. `cargo build --locked` here is what proves the split crates,
    # their path dependencies, and the generated lock stanzas all resolve.
    - customConfig:
        binaryName: acme-versioned
        splitTypeCrates: true
      outputFolder: with-split-type-crates
  cli-oauth:
    - customConfig:
        binaryName: oauth-test
        customCommands: false
      outputFolder: client-credentials
  # OAuth client-credentials wire tests. Exercises the token-endpoint mock
  # end-to-end: the harness stubs `POST /identity/token` on every mock server
  # so the client-credentials exchange succeeds before each authenticated
  # request (`plants list` / `plants get`). The token endpoint (`identity
  # getToken`) is excluded from the case list since the CLI consumes it
  # internally. Groups here (`identity`, `plants`) deliberately avoid the
  # reserved `auth` built-in command, so every emitted case is reachable.
  oauth-client-credentials-openapi:
    - customConfig:
        binaryName: plant-store
        generateWireTests: true
      outputFolder: with-wire-tests
  # Reserved-keyword regression guard. The `CreatedBy` enum's `self` value
  # PascalCases to the Rust keyword `Self`, which must be escaped in the
  # embedded types crate or the CLI won't `cargo build`. Because the wire test
  # compiles the whole generated crate before running, this fixture catches
  # any keyword-escaping regression at `cargo test` time. See fern#17183.
  cli-reserved-keywords:
    - customConfig:
        generateWireTests: true
      outputFolder: with-wire-tests
  # Namespace stutter-elision guard. The spec is grouped under `v1` and mounted
  # under namespace `v1`, so the CLI hoists it to `<bin> v1 list`. The wire test
  # drives that command; it fails at `cargo test` if the harness's
  # merge_into_path mirror (collect_spec_commands) regresses to `v1 v1 list`.
  cli-namespace-stutter:
    - customConfig:
        generateWireTests: true
      outputFolder: with-wire-tests
  # Multipart/form-data wire coverage. The `POST /upload-file` operation has an
  # optional `file` field typed `anyOf: [{string, binary}, {type: null}]` — the
  # canonical shape the harness must drive with a real fixture file (not the
  # filename as a text part). The harness writes a temp file, passes it via the
  # per-field `--file` flag, and asserts the multipart body carries the file
  # bytes, so a regression that sends the path string instead fails at
  # `cargo test`.
  file-upload-openapi:
    - customConfig:
        generateWireTests: true
      outputFolder: with-wire-tests
  # JSON request-body wire coverage. `PATCH /Profiles/{profileId}/Identifiers/
  # {idType}` carries an inlined JSON body (`idType`/`oldValue`/`newValue`) that
  # also collides with a path param name. The harness asserts the request body
  # the CLI sends matches the example, so a body that drops/renames/mis-serializes
  # a field fails at `cargo test`.
  openapi-path-param-body-collision:
    - customConfig:
        generateWireTests: true
      outputFolder: with-wire-tests
  # Public-client login flow (authorization-code + PKCE) wire coverage. The only
  # fixture whose manifest carries `loginTokenSetup`: the harness seeds a token
  # via `auth login --with-token` and asserts business requests carry
  # `Authorization: Bearer <token>`, exercising the request-time keyring
  # provider. The spec deliberately mixes authenticated operations (`widgets`)
  # with `security: []` ones (`tokens exchange`, `system health`) so the fixture
  # pins the *gate* as well as the assertion: an endpoint declaring no auth must
  # not be required to send a credential. Requiring one made its mock
  # unmatchable — the CLI correctly sends nothing, nothing matches, and the case
  # failed for a reason unrelated to what it tests. That shipped because no
  # fixture reached this path (`oauth-pkce` is a Fern-definition workspace, so
  # the CLI generator skips it; `cli-oauth` is client-credentials).
  cli-oauth-login-flow:
    - customConfig:
        binaryName: login-flow
        generateWireTests: true
      outputFolder: with-wire-tests

  # Auth-header matchers. `mock-utils` emits them only for `basic`, `bearer` and
  # `header` schemes — its switch has no `oauth` case — so every other wire-test
  # fixture (unauthenticated, or OAuth) carries an empty `headerMatchers` list and
  # never executes the harness's header-assertion path on a real binary. These two
  # cover both matcher kinds the harness dispatches on:
  #   header -> `x-api-key: .+`                       (match_header_regex)
  #   basic  -> exact `Authorization: Basic <base64>` (match_header)
  # Each spec also carries one `security: []` operation, so the `requiresAuth`
  # gate is pinned in the same fixture: reverting it fails exactly that case.
  cli-header-auth:
    - customConfig:
        binaryName: header-auth-cli
        generateWireTests: true
      outputFolder: with-wire-tests
  cli-basic-auth:
    - customConfig:
        binaryName: basic-auth-cli
        generateWireTests: true
      outputFolder: with-wire-tests
    # Split type crates where the two subpackages share nothing: each owns its
    # types outright, so the facade fronts two leaves and no core crate is
    # emitted. `cli-shared-types` covers the case where a core crate exists.
    - customConfig:
        binaryName: basic-auth-cli
        splitTypeCrates: true
      outputFolder: with-split-type-crates
  # The split fixture that matters: a type shared between two subpackages, so
  # the emitted workspace is a core crate plus leaves that depend on it. See
  # this API's generators.yml for what each path in it covers.
  cli-shared-types:
    - customConfig:
        binaryName: shared-types-cli
        splitTypeCrates: true
      outputFolder: with-split-type-crates

# Alpha-quality coverage: the SDK template only handles happy-path
# OpenAPI specs. Seed iterates every test-definition by default; fixtures
# that fail because the codegen'd `main.rs` can't cope with their auth
# schemes, custom config, server-sent events, websockets, etc. are
# parked here so CI passes. `simple-api:no-custom-config` is included
# because that's our deliberate "skip cleanly" smoke test — the
# generator writes nothing for Fern-definition workspaces, which makes
# seed's `cargo build` script fail on a missing output dir. As the
# template grows feature coverage, fixtures graduate off this list.
allowedFailures:
  - accept-header
  - alias
  - alias-extends
  - allof
  - allof-inline
  - any-auth
  - api-wide-base-path
  - audiences
  - basic-auth
  - basic-auth-environment-variables
  - basic-auth-pw-omitted
  - bearer-token-environment-variable
  - bytes-download
  - bytes-upload
  - circular-references
  - circular-references-advanced
  - circular-references-extends
  - client-side-params
  - content-type
  - cross-package-type-names
  - csharp-global-header-env
  - csharp-global-header-literal-env
  - dollar-string-examples
  - empty-clients
  - endpoint-security-auth
  - enum
  - error-property
  - errors
  - examples
  - exhaustive
  - extends
  - extra-properties
  - file-download
  - file-upload
  - file-upload-openapi
  - folders
  - header-auth
  - header-auth-environment-variable
  - http-head
  - idempotency-headers
  - inferred-auth-explicit
  - inferred-auth-implicit
  - inferred-auth-implicit-api-key
  - inferred-auth-implicit-no-expiry
  - inferred-auth-implicit-reference
  - license
  - literal
  - literal-user-agent
  - literals-unions
  - mixed-case
  - mixed-file-directory
  - multi-line-docs
  - multi-url-environment
  - multi-url-environment-no-default
  - multiple-request-bodies
  - no-environment
  - no-retries
  - nullable
  - nullable-optional
  - oauth-client-credentials
  - oauth-client-credentials-custom
  - oauth-client-credentials-default
  - oauth-client-credentials-environment-variables
  - oauth-client-credentials-mandatory-auth
  - oauth-client-credentials-nested-root
  # Its 4 wire tests fail on CI and only on CI: the mock matches 0 requests. Not
  # a regression from the wire-test work — this fixture's generated `main.rs` and
  # the whole of `sdk/src/auth/` are byte-identical to main, and the other 9 wire
  # fixtures pass in the same container, in the same run, concurrently.
  #
  # Ruled out, with the diagnostics the harness now prints on a mismatch:
  #   - the CLI's request. A self-probe issued from inside the test for the exact
  #     expected method and path also gets 404.
  #   - the matcher data. `expected "/plants" (len 7)` vs `received "/plants"
  #     (len 7)` — byte-identical, and `PathExactMatcher` is a plain string
  #     equality on `request.url.path()`.
  #   - the environment/library. 13 local runs across 4 environments (arm64,
  #     arm64 with a broken HOME, amd64 under emulation, and CI's exact
  #     `--parallel 16` shard invocation with scripts) all pass.
  # Deterministic on CI: 9 consecutive failures over 3 runs x 3 retries.
  #
  # The one structural difference from every fixture that passes: this is the
  # only fixture with an `authMock`, so the only one that mounts a second mock on
  # the server alongside the scoped business mock.
  #
  # Worth knowing before removing this line: these tests were green for ~3 months
  # while the CLI sent no credential at all. The scheme name in this fixture's
  # `generators.yml` (`CustomAuth`) does not match its spec's
  # `components.securitySchemes` (`BearerAuth`), the CLI joins bindings to
  # operations by name, finds none, and sends every request unauthenticated with
  # exit 0 — and `mock-utils` emits no auth matcher for `oauth` schemes, so
  # nothing checked. Both are filed separately. Green here would be the wrong
  # outcome until the credential assertion exists.
  #
  # Must carry the `:with-wire-tests` suffix: `testWorkspaceFixtures.ts` keys a
  # result as `<id>:<outputFolder>` whenever the two differ, then does an exact
  # set difference against this list. The bare name matches nothing.
  - oauth-client-credentials-openapi:with-wire-tests
  - oauth-client-credentials-reference
  - oauth-client-credentials-with-variables
  - oauth-pkce
  - object
  - objects-with-imports
  - openapi-request-body-ref
  - optional
  - package-yml
  - pagination
  - pagination-custom
  - pagination-uri-path
  - path-parameters
  - php-global-header-env
  - php-global-header-literal-env
  - plain-text
  - property-access
  - public-object
  - query-param-name-conflict
  - query-parameters
  # query-parameters-openapi:no-custom-config graduated as a regression test
  # for embedded SDK asIs template resolution (FER-11453).
  # query-parameters-openapi and query-parameters-openapi:github-npm graduated
  # after the fernignore cleanup logic was fixed.
  - query-parameters-openapi-as-objects
  - request-parameters
  - required-nullable
  - reserved-keywords
  - response-property
  - server-sent-event-examples
  - server-sent-events
  - server-sent-events-openapi
  - server-sent-events-resumable
  - simple-api:no-custom-config
  - simple-fhir
  - single-url-environment-default
  - single-url-environment-no-default
  - streaming
  - streaming-parameter
  - trace
  - undiscriminated-union-with-response-property
  - undiscriminated-unions
  - union-query-parameters
  - unions
  - unions-with-local-date
  - unknown
  - validation
  - variables
  - version
  - version-no-default
  - webhooks
  - websocket
  - websocket-bearer-auth
  - websocket-inferred-auth
  - websocket-multi-url
