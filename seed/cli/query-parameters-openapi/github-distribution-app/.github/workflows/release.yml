# This file was autogenerated by dist: https://axodotdev.github.io/cargo-dist
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # cargo-dist guards the installer download with pipefail in the `plan`
      # job but not here, where the same `curl ... | sh` runs once per matrix
      # leg. A dead curl pipes nothing into `sh`, which exits 0, so the step
      # above reports success and `dist build` fails two steps later with an
      # opaque exit 127. Observed on 2 of 3 real releases.
      #
      # Deliberately does not branch on `matrix.install_dist.shell`: steps 1
      # and 3 reuse the matrix's own command and shell exactly as upstream
      # does, so this can only ever add a retry — it cannot mis-route a leg
      # and skip the install entirely.
      - id: dist-check
        name: Check dist installed
        shell: bash
        run: |
          if dist --version > /dev/null 2>&1; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::warning::The dist installer did not put 'dist' on PATH — most likely a transient download failure. Retrying."
          fi
      - name: Install dist (retry)
        if: ${{ steps.dist-check.outputs.ok == 'no' }}
        run: ${{ matrix.install_dist.run }}
      - name: Verify dist
        shell: bash
        run: |
          dist --version || {
            echo "::error::The cargo-dist installer failed twice on this runner, so 'dist' is not available. This is usually a transient network failure downloading https://github.com/axodotdev/cargo-dist/releases — re-run this job."
            exit 1
          }
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          # Re-runs and pre-created releases must not fail after a successful build.
          # --draft=false publishes a release that was drafted in the UI:
          # gh release view finds drafts, so without it the assets upload into
          # a release nobody can see and the job still reports success. A draft
          # has no tag yet, so --target decides where that tag lands; for an
          # already-published release the tag exists and GitHub ignores it.
          if gh release view "${{ needs.plan.outputs.tag }}" > /dev/null 2>&1; then
            if [[ -n "$PRERELEASE_FLAG" ]]; then
              gh release edit "${{ needs.plan.outputs.tag }}" --title "$ANNOUNCEMENT_TITLE" --target "$RELEASE_COMMIT" --notes-file "$RUNNER_TEMP/notes.txt" --draft=false --prerelease
            else
              gh release edit "${{ needs.plan.outputs.tag }}" --title "$ANNOUNCEMENT_TITLE" --target "$RELEASE_COMMIT" --notes-file "$RUNNER_TEMP/notes.txt" --draft=false --prerelease=false
            fi
            gh release upload "${{ needs.plan.outputs.tag }}" artifacts/* --clobber
          else
            gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
          fi

  preflight-distribution:
    runs-on: "ubuntu-22.04"
    # `release.yml` also runs `dist plan` on pull_request, where secrets are
    # unavailable to forks. Without this gate every contributor's PR would
    # fail on a secret they cannot be given. Mirrors how `plan` derives its
    # own `publishing` output.
    if: ${{ !github.event.pull_request }}
    steps:
      - name: Verify the Homebrew tap / Scoop bucket App credentials
        env:
          APP_ID: ${{ secrets.PUBLISH_APP_ID }}
          PRIVATE_KEY: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -uo pipefail

          # Normalized through `:-` before anything reads them. `set -u` aborts
          # on an *unset* variable, and this job exists to explain a missing
          # secret — dying with "APP_ID: unbound variable" instead of the
          # message below would defeat the whole point.
          APP_ID="${APP_ID:-}"
          PRIVATE_KEY="${PRIVATE_KEY:-}"

          status=0

          if [ -z "${APP_ID}" ]; then
            echo "::error title=Missing secret::secrets.PUBLISH_APP_ID is empty. Add it under Settings > Secrets and variables > Actions > Secrets. An Actions *variable* of the same name is not readable as secrets.PUBLISH_APP_ID. The value is the App ID (or Client ID) shown on your GitHub App's settings page."
            status=1
          fi

          if [ -z "${PRIVATE_KEY}" ]; then
            echo "::error title=Missing secret::secrets.PUBLISH_APP_PRIVATE_KEY is empty. Add it as an Actions secret containing the entire contents of the .pem file you downloaded when generating the App's private key."
            status=1
          else
            case "${PRIVATE_KEY}" in
              *"BEGIN"*"PRIVATE KEY"*) ;;
              *)
                echo "::error title=Malformed private key::secrets.PUBLISH_APP_PRIVATE_KEY does not contain a PEM header. Paste the whole .pem file, including its BEGIN and END lines."
                status=1
                ;;
            esac
            if [ "$(printf '%s\n' "${PRIVATE_KEY}" | wc -l | tr -d ' ')" -lt 3 ]; then
              echo "::error title=Malformed private key::secrets.PUBLISH_APP_PRIVATE_KEY is a single line. The PEM must keep its line breaks - re-paste it from the file without collapsing it. This is the most common cause of 'secretOrPrivateKey must be an asymmetric key'."
              status=1
            fi
          fi

          if [ "${status}" -eq 0 ]; then
            echo "Homebrew tap / Scoop bucket App credentials are present and well-formed."
          fi
          exit "${status}"

  publish-homebrew-formula:
    needs:
      - plan
      - host
      - preflight-distribution
    runs-on: "ubuntu-22.04"
    env:
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "github-actions[bot]"
      GITHUB_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - name: Mint a tap token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: acme
          repositories: homebrew-tap
      - uses: actions/checkout@v6
        with:
          repository: "acme/homebrew-tap"
          token: ${{ steps.app-token.outputs.token }}
          # Credentials must persist — the final step pushes the formula back.
          persist-credentials: true
          # So we have access to the formula
          fetch-depth: 1
      # So we have access to "dist"
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find the formula file based on the app name
      - name: Commit formula files
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            name=$(echo "$release" | jq .app_name --raw-output)
            version=$(echo "$release" | jq .app_version --raw-output)

            # GitHub's ubuntu runner images no longer ship Homebrew, so
            # cargo-dist's unconditional `brew --prefix` aborts this step
            # under `bash -e` with exit 127 — before the formula is ever
            # committed. `brew style` is only cosmetic reformatting of a
            # file cargo-dist already renders validly, so skip it when brew
            # is absent instead of failing the publish.
            if command -v brew > /dev/null 2>&1; then
              export PATH="$(brew --prefix)/bin:$PATH"
              brew update
              # We avoid reformatting user-provided data such as the app description and homepage.
              for filename in $(echo "$release" | jq --compact-output --raw-output '.artifacts[] | select(endswith(".rb"))'); do
                brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true
              done
            else
              echo "::notice::brew is not available on this runner; skipping the formula style pass."
            fi

            git add Formula/*.rb
            # Re-running a release must be a no-op rather than an
            # empty-commit failure, matching the Scoop job.
            if git diff --cached --quiet; then
              echo "Formula for ${name} ${version} is already up to date; nothing to commit."
            else
              git commit -m "${name} ${version}"
            fi
          done

          git push

  publish-scoop:
    needs:
      - plan
      - host
      - preflight-distribution
    runs-on: "ubuntu-22.04"
    # The same expression cargo-dist uses for its own publish jobs. A Scoop
    # bucket has no prerelease channel — a manifest simply *is* the version
    # `scoop install` hands out — so an RC must not become what every user
    # installs. Deferring to cargo-dist's own semver determination instead of
    # re-parsing the tag keeps both channels in agreement by construction.
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - name: Resolve the Windows release archive
        id: archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          SUFFIX="-x86_64-pc-windows-msvc.zip"

          # Resolved by target-triple suffix rather than full name: cargo-dist
          # names archives after the cargo *package*, which the generator does
          # not always control.
          ASSET_NAME=""
          for attempt in $(seq 1 6); do
            ASSET_NAME=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets \
              --jq ".assets[].name | select(endswith(\"${SUFFIX}\"))" 2>/dev/null | head -n1 || true)
            if [ -n "${ASSET_NAME}" ]; then
              break
            fi
            echo "Release assets not listable yet (attempt ${attempt}/6); retrying..."
            sleep 10
          done

          if [ -z "${ASSET_NAME}" ]; then
            echo "::error::No asset ending in ${SUFFIX} on release ${TAG}. The host job already created the release, so this means the Windows archive was never built — check the build-local-artifacts leg for x86_64-pc-windows-msvc."
            exit 1
          fi

          echo "asset-name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download the archive and hash it
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_NAME: ${{ steps.archive.outputs.asset-name }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET_NAME}" --dir "${RUNNER_TEMP}/scoop"
          HASH=$(sha256sum "${RUNNER_TEMP}/scoop/${ASSET_NAME}" | cut -d' ' -f1)

          # cargo-dist archive names carry no version, so the autoupdate URL
          # is the release URL with the tag replaced by Scoop's $version
          # placeholder. Preserve whether the tag is v-prefixed.
          if [ "${TAG}" = "v${VERSION}" ]; then
            TAG_TEMPLATE='v$version'
          else
            TAG_TEMPLATE='$version'
          fi

          {
            echo "version=${VERSION}"
            echo "hash=${HASH}"
            echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}"
            echo "autoupdate-url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_TEMPLATE}/${ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint a bucket token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: acme
          repositories: scoop-bucket

      - name: Check out the Scoop bucket
        uses: actions/checkout@v6
        with:
          repository: "acme/scoop-bucket"
          token: ${{ steps.app-token.outputs.token }}
          path: scoop-bucket
          # Credentials must persist — the next step pushes the manifest back.
          persist-credentials: true
          fetch-depth: 1

      - name: Write and push the manifest
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          URL: ${{ steps.manifest.outputs.url }}
          HASH: ${{ steps.manifest.outputs.hash }}
          AUTOUPDATE_URL: ${{ steps.manifest.outputs.autoupdate-url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scoop-bucket/bucket
          jq -n \
            --arg version "${VERSION}" \
            --arg description 'CLI for the Query Parameters API' \
            --arg homepage 'https://github.com/query-parameters-openapi/fern' \
            --arg url "${URL}" \
            --arg hash "${HASH}" \
            --arg bin 'query-parameters-api.exe' \
            --arg autoupdate "${AUTOUPDATE_URL}" \
            --arg checkver 'https://github.com/query-parameters-openapi/fern' \
            '{
              version: $version,
              description: $description,
              homepage: $homepage,
              architecture: { "64bit": { url: $url, hash: $hash, bin: $bin } },
              autoupdate: { architecture: { "64bit": { url: $autoupdate } } },
              checkver: { github: $checkver }
            }' > "scoop-bucket/bucket/query-parameters-api.json"

          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "bucket/query-parameters-api.json"

          # Re-running a release must be a no-op rather than an empty-commit
          # failure — unlike npm, this channel is idempotent.
          if git diff --cached --quiet; then
            echo "bucket/query-parameters-api.json is already up to date; nothing to commit."
          else
            git commit -m "query-parameters-api ${VERSION}"
            git push
          fi

  announce:
    needs:
      - plan
      - host
      - publish-homebrew-formula
      - publish-scoop
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
