[package]
name = "test_x_fern_global_parameters_extension_sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for test_x_fern_global_parameters_extension_sdk generated by Fern"
license = "MIT"
repository = "https://github.com/fern-api/fern"
documentation = "https://docs.rs/test_x_fern_global_parameters_extension_sdk"

[lib]
doctest = false

[dependencies]
bytes = "1.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "gzip"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
