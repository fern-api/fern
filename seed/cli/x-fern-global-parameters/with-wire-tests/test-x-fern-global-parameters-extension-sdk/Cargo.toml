thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

[dependencies.test_x_fern_global_parameters_extension_types]
path = "../test-x-fern-global-parameters-extension-types"
