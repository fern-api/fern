openapi: 3.1.0
info:
  title: OAuth Test API
  version: 0.0.0
paths:
  /token:
    post:
      operationId: auth_getToken
      tags:
        - Auth
      parameters:
        - name: audience
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/GetTokenAuthRequestAudience'
              - type: 'null'
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                Example1:
                  value:
                    access_token: access_token
                    expires_in: 1
                    refresh_token: refresh_token
      summary: Exchange client credentials for an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  examples:
                    - client_id
                client_secret:
                  type: string
                  examples:
                    - client_secret
                scopes:
                  type: string
                  examples:
                    - scopes
                grant_type:
                  $ref: '#/components/schemas/GetTokenAuthRequestGrantType'
                tenant:
                  type: string
                  examples:
                    - tenant
                optional_hint:
                  type:
                    - string
                    - 'null'
              required:
                - client_id
                - client_secret
                - scopes
                - grant_type
                - tenant
            examples:
              Example1:
                value:
                  client_id: client_id
                  client_secret: client_secret
                  scopes: scopes
                  grant_type: client_credentials
                  tenant: tenant
  /refresh:
    post:
      operationId: auth_refreshToken
      tags:
        - Auth
      parameters: []
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                Example1:
                  value:
                    access_token: access_token
                    expires_in: 1
                    refresh_token: refresh_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  examples:
                    - refresh_token
                grant_type:
                  $ref: '#/components/schemas/RefreshTokenAuthRequestGrantType'
              required:
                - refresh_token
                - grant_type
            examples:
              Example1:
                value:
                  refresh_token: refresh_token
                  grant_type: refresh_token
  /health:
    get:
      operationId: system_health
      tags:
        - System
      parameters: []
      responses:
        '204':
          description: No content
  /pets:
    get:
      operationId: pets_list
      tags:
        - Pets
      parameters: []
      responses:
        '200':
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                Example1:
                  value:
                    - string
      summary: List pets
      security:
        - OAuth2: []
components:
  schemas:
    GetTokenAuthRequestAudience:
      title: GetTokenAuthRequestAudience
      type: string
      const: pets
    GetTokenAuthRequestGrantType:
      title: GetTokenAuthRequestGrantType
      type: string
      const: client_credentials
    RefreshTokenAuthRequestGrantType:
      title: RefreshTokenAuthRequestGrantType
      type: string
      const: refresh_token
    TokenResponse:
      title: TokenResponse
      type: object
      properties:
        access_token:
          type: string
          examples:
            - access_token
        expires_in:
          type: integer
          examples:
            - 1
        refresh_token:
          type:
            - string
            - 'null'
      required:
        - access_token
        - expires_in
  securitySchemes:
    OAuth2:
      type: http
      scheme: bearer
servers:
  - url: https://api.example.com
    description: Default
