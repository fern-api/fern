openapi: 3.1.0
info:
  title: OAuth API
  version: 0.0.0
paths:
  /oauth/token:
    post:
      operationId: oauth_getToken
      tags:
        - Oauth
      parameters: []
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauthGetTokenResponse'
              examples:
                Example1:
                  value:
                    access_token: access_token
                    expires_in: 1
      security:
        - OAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  examples:
                    - client_id
                client_secret:
                  type: string
                  examples:
                    - client_secret
              required:
                - client_id
                - client_secret
            examples:
              Example1:
                value:
                  client_id: client_id
                  client_secret: client_secret
  /api/v3/items:
    get:
      operationId: listItems
      tags:
        - ''
      parameters: []
      responses:
        '200':
          description: Items response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                Example1:
                  value:
                    - string
      security:
        - OAuth: []
components:
  schemas:
    oauthGetTokenResponse:
      title: oauthGetTokenResponse
      type: object
      properties:
        access_token:
          type: string
          examples:
            - access_token
        expires_in:
          type: integer
          examples:
            - 1
      required:
        - access_token
        - expires_in
  securitySchemes:
    OAuth:
      type: http
      scheme: bearer
