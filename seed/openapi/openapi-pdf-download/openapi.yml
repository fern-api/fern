openapi: 3.1.0
info:
  title: openapi-pdf-download
  version: 0.0.0
paths:
  /asset_report/pdf/get:
    post:
      operationId: assetReport_getPdf
      tags:
        - AssetReport
      parameters: []
      responses:
        '204':
          description: No content
        '400':
          description: BadRequestError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaidError'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaidError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetReportPdfGetRequest'
  /asset_report/get:
    post:
      operationId: assetReport_get
      tags:
        - AssetReport
      parameters: []
      responses:
        '200':
          description: Asset report metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetReportGetResponse'
              examples:
                Example1:
                  value:
                    request_id: request_id
        '400':
          description: BadRequestError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaidError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetReportPdfGetRequest'
            examples:
              Example1:
                value:
                  asset_report_token: asset_report_token
components:
  schemas:
    AssetReportPdfGetRequest:
      title: AssetReportPdfGetRequest
      type: object
      properties:
        asset_report_token:
          type: string
          examples:
            - asset_report_token
      required:
        - asset_report_token
    AssetReportGetResponse:
      title: AssetReportGetResponse
      type: object
      properties:
        request_id:
          type: string
          examples:
            - request_id
      required:
        - request_id
    PlaidError:
      title: PlaidError
      type: object
      properties:
        error_type:
          type: string
        error_code:
          type: string
        error_message:
          type: string
      required:
        - error_type
        - error_code
        - error_message
    AssetReportPdfGetResponse:
      title: AssetReportPdfGetResponse
      type: string
      format: binary
      description: >-
        AssetReportPDFGetResponse defines the response schema for
        `/asset_report/pdf/get`
  securitySchemes: {}
