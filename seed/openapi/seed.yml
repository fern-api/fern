irVersion: v66
displayName: OpenAPI
image: fernapi/fern-openapi
changelogLocation: ../../generators/openapi/versions.yml
publish:
  preBuildCommands:
    - pnpm turbo run dist:cli --filter @fern-api/openapi-generator
  docker:
    file: ./generators/openapi/Dockerfile
    image: fernapi/fern-openapi
    context: ./generators/openapi
test:
  docker:
    image: fernapi/fern-openapi:latest
    command: pnpm turbo run dockerTagLatest --filter @fern-api/openapi-generator
  local:
    workingDirectory: generators/openapi
    buildCommand:
      - pnpm turbo run dist:cli --filter @fern-api/openapi-generator
    runCommand: node --enable-source-maps dist/cli.cjs openapi {CONFIG_PATH}
generatorType: Documentation
defaultOutputMode: local_files
fixtures:
  imdb:
    - customConfig: null
      outputFolder: no-custom-config
    - customConfig:
        customOverrides: 
          components: 
            schemas: 
              MovieId: 
                type: null
      outputFolder: override
    - customConfig:
        customOverrides:
          info:
            license:
              name: MIT
      outputFolder: custom-overrides
    - customConfig:
        filename: imdb.yaml
      outputFolder: custom-filename
    - customConfig:
        format: json
      outputFolder: json-format
  enum: 
    - customConfig: null
      outputFolder: no-custom-config
    - customConfig:
        customOverrides: 
          components: 
            schemas: 
              Operand: 
                type: null     
      outputFolder: custom-overrides
allowedFailures:
  # The IR-to-OpenAPI converter throws on these ("Duplicate <method> endpoint at <path>" or
  # "bytes is not supported"), so the
  # generator writes no files. The CLI now fails generation when that happens.
  - bytes-upload
  - cross-package-type-names
  - endpoint-security-auth
  - examples
  - exhaustive
  - file-upload
  - folders
  - multiple-request-bodies
  - oauth-client-credentials
  - oauth-client-credentials-custom
  - oauth-client-credentials-environment-variables
  - oauth-client-credentials-mandatory-auth
  - oauth-client-credentials-with-variables
  - pagination
  - response-property
  - server-sent-events-openapi
  - trace
  - unions-with-local-date
