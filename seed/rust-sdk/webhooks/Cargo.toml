[package]
name = "seed_webhooks"
version = "0.0.1"
edition = "2021"
description = "Rust SDK for seed_webhooks generated by Fern"
license = "MIT"
repository = "https://github.com/fern-api/fern"
documentation = "https://docs.rs/seed_webhooks"

[lib]
doctest = false

[dependencies]
base64 = "0.22"
bytes = "1.0"
futures = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json", "stream", "gzip"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["rustls-tls"]
native-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]
