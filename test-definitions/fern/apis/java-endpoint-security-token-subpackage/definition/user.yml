# yaml-language-server: $schema=../../../../../fern.schema.json
types:
  User:
    properties:
      id: string
      name: string

service:
  auth: true
  base-path: ""
  endpoints:
    getWithOAuth:
      path: /users/oauth
      method: GET
      response: list<User>
      auth:
        - clientCredentialsAuth: [read-only]
    getWithApiKeyOrOAuth:
      path: /users/mixed
      method: GET
      response: list<User>
      auth:
        - clientCredentialsAuth: [read-only]
        - ApiKey: []
    getWithBearer:
      path: /users/bearer
      method: GET
      response: list<User>
      auth:
        - tokenAuth: []
    getWithBasic:
      path: /users/basic
      method: GET
      response: list<User>
      auth:
        - passwordAuth: []
    getAnonymous:
      path: /users/anonymous
      method: GET
      response: list<User>
      auth: []
