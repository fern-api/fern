# yaml-language-server: $schema=../../../../../fern.schema.json
types:
  TokenResponse:
    properties:
      access_token: string
      expires_in: integer

service:
  auth: true
  base-path: ""
  endpoints:
    getToken:
      path: /token
      method: POST
      auth:
        - Basic: []
        - {}
      request:
        name: GetTokenRequest
        body:
          properties:
            grant_type: string
      response: TokenResponse
      examples:
        - request:
            grant_type: client_credentials
          response:
            body:
              access_token: access_token
              expires_in: 3600
