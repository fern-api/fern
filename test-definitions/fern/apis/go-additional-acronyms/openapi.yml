openapi: 3.0.0
info:
  title: Additional Acronyms
  version: 1.0.0
# Regression guard for the `additional-acronyms` option: with [FDX, CRA, EWA] configured,
# the sub-client fields on the root client (`FDX`, `CRAReport`) and the request/response type
# names (`CRAReportGetRequest`) must all use the configured spelling. Those halves are
# generated by go-v2 and go-v1 respectively, so a mismatch produces an SDK that fails to
# compile — which this fixture's `go build` catches.
paths:
  /fdx/accounts:
    get:
      operationId: fdx_listAccounts
      x-fern-sdk-group-name: fdx
      x-fern-sdk-method-name: listAccounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/fdx_account"
  /cra/report/get:
    post:
      operationId: cra_report_get
      x-fern-sdk-group-name: cra_report
      x-fern-sdk-method-name: get
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cra_report_get_request"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cra_report"
  /ewa/report/get:
    post:
      operationId: ewa_report_get
      x-fern-sdk-group-name: ewa_report
      x-fern-sdk-method-name: get
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ewa_report"
components:
  schemas:
    fdx_account:
      type: object
      properties:
        account_id:
          type: string
    cra_report_get_request:
      type: object
      required:
        - user_token
      properties:
        user_token:
          type: string
    cra_report:
      type: object
      properties:
        report_id:
          type: string
        oauth_token:
          type: string
    ewa_report:
      type: object
      properties:
        report_id:
          type: string
