types:
  User:
    properties:
      name: string
      id: integer

  ListUsersUriPaginationResponse:
    properties:
      data: list<User>
      next: optional<string>

  ListUsersPathPaginationResponse:
    properties:
      data: list<User>
      next: optional<string>

service:
  auth: false
  base-path: ""
  endpoints:
    listWithUriPagination:
      pagination:
        next_uri: $response.next
        results: $response.data
      method: GET
      path: /accounts/{accountId}/users/uri
      request:
        name: ListWithUriPaginationRequest
        path-parameters:
          accountId: string
        query-parameters:
          pageSize: optional<integer>
        headers:
          X-Api-Version: optional<string>
      response: ListUsersUriPaginationResponse

    listWithPathPagination:
      pagination:
        next_path: $response.next
        results: $response.data
      method: GET
      path: /accounts/{accountId}/users/path
      request:
        name: ListWithPathPaginationRequest
        path-parameters:
          accountId: string
        query-parameters:
          pageSize: optional<integer>
      response: ListUsersPathPaginationResponse
