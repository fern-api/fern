openapi: 3.1.0
info:
  title: Shared Types CLI
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  # `catalog` and `billing` both reach `Money`, so it is the shared type that
  # forces a core crate into existence.
  /catalog/items:
    get:
      operationId: catalog_list_items
      x-fern-sdk-group-name: catalog
      x-fern-sdk-method-name: list_items
      summary: List catalog items
      responses:
        "200":
          description: Catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"
  # Reached only from `catalog`, so it stays in the `catalog` crate. Without a
  # type like this the leaf would hold nothing and the fixture would collapse
  # back to a single core crate.
  /catalog/categories:
    get:
      operationId: catalog_list_categories
      x-fern-sdk-group-name: catalog
      x-fern-sdk-method-name: list_categories
      summary: List categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /billing/invoices:
    get:
      operationId: billing_list_invoices
      x-fern-sdk-group-name: billing
      x-fern-sdk-method-name: list_invoices
      summary: List invoices
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
  # Deliberately carries no `x-fern-sdk-group-name`, so it lands on a
  # root-level service. A root-level service owns no crate of its own, so the
  # struct generated for this inlined request body belongs to core — while the
  # `CatalogItem` it references is otherwise only reachable from `catalog`.
  # Unless the planner seeds a root-level service's references from core, that
  # combination emits a core crate naming a type only a leaf crate exports, and
  # `cargo build` fails on the generated output.
  /import:
    post:
      operationId: import_item
      summary: Import a catalog item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  $ref: "#/components/schemas/CatalogItem"
                dryRun:
                  type: boolean
              required:
                - item
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                required:
                  - imported
components:
  schemas:
    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
      required:
        - amount
        - currency
    CatalogItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
      required:
        - id
        - name
        - price
    Category:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
        - id
        - label
    BillingAddress:
      type: object
      properties:
        line1:
          type: string
        postalCode:
          type: string
      required:
        - line1
    Invoice:
      type: object
      properties:
        id:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        address:
          $ref: "#/components/schemas/BillingAddress"
      required:
        - id
        - total
