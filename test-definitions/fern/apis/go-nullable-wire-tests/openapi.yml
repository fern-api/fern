openapi: 3.0.0
info:
  title: go-nullable-wire-tests
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /thing:
    get:
      operationId: getThing
      tags:
        - Things
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThingResponse"
              example:
                thing:
                  id: thing-1
                  logo: null
                  rank: null
                  nested: null
components:
  schemas:
    ThingResponse:
      type: object
      properties:
        thing:
          $ref: "#/components/schemas/Thing"
      required:
        - thing
    Thing:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        logo:
          type: string
          nullable: true
        rank:
          type: integer
          nullable: true
        nested:
          $ref: "#/components/schemas/Nested"
      required:
        - id
    Nested:
      type: object
      nullable: true
      properties:
        inner:
          type: string
          nullable: true
