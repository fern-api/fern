service:
  base-path: /test-headers
  auth: true
  headers:
    X-TEST-SERVICE-HEADER: string
  endpoints:
    getWithCustomHeader:
      path: /custom-header
      method: POST
      request:
        name: ReqWithHeaders
        headers:
          X-TEST-ENDPOINT-HEADER: string
        body: string
      examples:
        - headers:
            X-TEST-SERVICE-HEADER: "service`value"
            X-TEST-ENDPOINT-HEADER: 'endpoint"value'
          request: "string"
