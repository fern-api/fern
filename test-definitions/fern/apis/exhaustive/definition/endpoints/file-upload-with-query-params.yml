service:
  auth: true
  base-path: /file-upload-with-query-params
  endpoints:
    convert:
      docs: |
        File upload endpoint with query parameters.
        Tests that generated code correctly handles file upload requests
        that also have query parameters.
      path: /convert
      method: POST
      request:
        name: FileUploadWithQueryParamsConvertRequest
        query-parameters:
          maybeString: optional<string>
          integer: integer
          maybeInteger: optional<integer>
        body:
          properties:
            file: file
            maybe_list: optional<list<string>>
