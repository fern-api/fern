types:
  User:
    properties:
      name: string
      id: integer

  ListUsersResponse:
    properties:
      next_cursor: optional<string>
      data: list<User>

  ListUsersRequiredCursorResponse:
    properties:
      next_cursor: string
      data: list<User>

  ListUsersUuidCursorResponse:
    properties:
      next_cursor: optional<uuid>
      data: list<User>

  Cursor:
    docs: A named alias that resolves to an optional string, i.e. a pointer in Go.
    type: optional<string>

  RequiredCursor:
    docs: A named alias that resolves to a required string, i.e. a value in Go.
    type: string

  NullableCursor:
    docs: A named alias that resolves to a nullable string, which is also a pointer in Go.
    type: nullable<string>

  ListUsersAliasCursorResponse:
    properties:
      next_cursor: Cursor
      data: list<User>

  ListUsersRequiredAliasCursorResponse:
    properties:
      next_cursor: RequiredCursor
      data: list<User>

  ListUsersNullableAliasCursorResponse:
    properties:
      next_cursor: NullableCursor
      data: list<User>

  WithCursor:
    properties:
      cursor: optional<string>

  WithRequiredCursor:
    properties:
      cursor: string

  WithOffset:
    docs: Mirrors an options object that carries both the offset and the page size.
    properties:
      offset: optional<integer>
      count: optional<integer>

  WithPagination:
    properties:
      pagination: optional<WithCursor>

service:
  auth: false
  base-path: /users
  endpoints:
    listWithBodyCursorPagination:
      docs: |
        Pagination endpoint with an optional top-level cursor field in the request body. An empty
        string cursor terminates the pager, just like a null cursor does.
      pagination:
        cursor: $request.cursor
        next_cursor: $response.next_cursor
        results: $response.data
      method: POST
      path: ""
      request:
        name: ListUsersBodyCursorPaginationRequest
        body:
          properties:
            cursor: optional<string>
            filter: optional<string>
      response: ListUsersResponse

    listWithRequiredBodyCursorPagination:
      docs: Pagination endpoint with a required top-level cursor field in the request body.
      pagination:
        cursor: $request.cursor
        next_cursor: $response.next_cursor
        results: $response.data
      method: POST
      path: /required-cursor
      request:
        name: ListUsersRequiredBodyCursorPaginationRequest
        body:
          properties:
            cursor: string
      response: ListUsersRequiredCursorResponse

    listWithUuidBodyCursorPagination:
      docs: |
        Pagination endpoint with an optional uuid cursor field in the request body. Only string cursors
        treat an empty value as the last page, so this endpoint terminates on a null cursor alone.
      pagination:
        cursor: $request.cursor
        next_cursor: $response.next_cursor
        results: $response.data
      method: POST
      path: /uuid-cursor
      request:
        name: ListUsersUuidBodyCursorPaginationRequest
        body:
          properties:
            cursor: optional<uuid>
      response: ListUsersUuidCursorResponse

    listWithAliasBodyCursorPagination:
      docs: |
        Pagination endpoint whose cursor is a named alias resolving to an optional string. The alias
        generates as a pointer in Go, so an empty string cursor terminates the pager here too.
      pagination:
        cursor: $request.cursor
        next_cursor: $response.next_cursor
        results: $response.data
      method: POST
      path: /alias-cursor
      request:
        name: ListUsersAliasBodyCursorPaginationRequest
        body:
          properties:
            cursor: Cursor
      response: ListUsersAliasCursorResponse

    listWithRequiredAliasBodyCursorPagination:
      docs: |
        Pagination endpoint whose cursor is a named alias resolving to a required string. The alias
        generates as a value in Go, where the zero value is already the empty string.
      pagination:
        cursor: $request.cursor
        next_cursor: $response.next_cursor
        results: $response.data
      method: POST
      path: /required-alias-cursor
      request:
        name: ListUsersRequiredAliasBodyCursorPaginationRequest
        body:
          properties:
            cursor: RequiredCursor
      response: ListUsersRequiredAliasCursorResponse

    listWithNullableAliasBodyCursorPagination:
      docs: |
        Pagination endpoint whose cursor is a named alias resolving to a nullable string. Nullable
        generates as a pointer in Go, so an empty string cursor terminates the pager here too.
      pagination:
        cursor: $request.cursor
        next_cursor: $response.next_cursor
        results: $response.data
      method: POST
      path: /nullable-alias-cursor
      request:
        name: ListUsersNullableAliasBodyCursorPaginationRequest
        body:
          properties:
            cursor: NullableCursor
      response: ListUsersNullableAliasCursorResponse

    listWithBodyOffsetPagination:
      docs: Pagination endpoint with a top-level page field in the request body.
      pagination:
        offset: $request.page
        results: $response.data
      method: POST
      path: /offset
      request:
        name: ListUsersBodyOffsetPaginationRequest
        body:
          properties:
            page: optional<integer>
            limit: optional<integer>
      response: ListUsersResponse

    listWithNestedBodyCursorPagination:
      docs: |
        Pagination endpoint with a cursor field nested in an optional object in the request body. The
        pager allocates the object when the caller left it unset.
      pagination:
        cursor: $request.pagination.cursor
        next_cursor: $response.next_cursor
        results: $response.data
      method: POST
      path: /nested-cursor
      request:
        name: ListUsersNestedBodyCursorPaginationRequest
        body:
          properties:
            pagination: optional<WithCursor>
      response: ListUsersResponse

    listWithNestedRequiredBodyCursorPagination:
      docs: |
        Pagination endpoint with a required cursor field nested in a required object in the request
        body. Objects are always pointers in Go, so the pager still allocates the object when nil.
      pagination:
        cursor: $request.pagination.cursor
        next_cursor: $response.next_cursor
        results: $response.data
      method: POST
      path: /nested-required-cursor
      request:
        name: ListUsersNestedRequiredBodyCursorPaginationRequest
        body:
          properties:
            pagination: WithRequiredCursor
      response: ListUsersRequiredCursorResponse

    listWithDeeplyNestedBodyCursorPagination:
      docs: |
        Pagination endpoint with a cursor field nested two levels deep in optional objects in the
        request body. The pager allocates every intermediate object that the caller left unset.
      pagination:
        cursor: $request.options.pagination.cursor
        next_cursor: $response.next_cursor
        results: $response.data
      method: POST
      path: /deeply-nested-cursor
      request:
        name: ListUsersDeeplyNestedBodyCursorPaginationRequest
        body:
          properties:
            options: optional<WithPagination>
      response: ListUsersResponse

    listWithNestedBodyOffsetPagination:
      docs: |
        Pagination endpoint with an offset field nested in an optional object in the request body,
        alongside the page size. The pager allocates the object when the caller left it unset.
      pagination:
        offset: $request.options.offset
        step: $request.options.count
        results: $response.data
      method: POST
      path: /nested-offset
      request:
        name: ListUsersNestedBodyOffsetPaginationRequest
        body:
          properties:
            options: optional<WithOffset>
      response: ListUsersResponse
