openapi: 3.0.3
info:
  title: Any Auth CLI
  version: 1.0.0
# Templated host with an untemplated `x-fern-default-url`. The CLI cannot
# supply server variables, so the token endpoint must resolve to the default
# (`api.example.com`), not the template filled with each variable's default
# (`api.us1.example.com`) — that substituted host need not exist at all.
servers:
  - url: https://api.{region}.example.com
    x-fern-server-name: Production
    x-fern-default-url: https://api.example.com
    variables:
      region:
        default: us1
paths:
  # Anonymous by construction: the OAuth client-credentials scheme in
  # generators.yml points here, so it must not itself require auth.
  /token:
    post:
      operationId: auth_getToken
      x-fern-sdk-group-name: auth
      x-fern-sdk-method-name: getToken
      summary: Exchange client credentials for an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                # Unconstrained (no literal, no default), the way OpenAPI
                # imports model it. Must be pinned to the flow's RFC 6749
                # value rather than surfaced as an env var the caller has to
                # set — an omitted `grant_type` fails the exchange.
                grant_type:
                  type: string
              required:
                - client_id
                - client_secret
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  # Only names the spec's own Basic scheme. The OAuth2 scheme exists solely in
  # generators.yml, so per-operation routing would never pick it.
  /widgets:
    get:
      operationId: widgets_list
      x-fern-sdk-group-name: widgets
      x-fern-sdk-method-name: list
      summary: List widgets
      security:
        - BasicAuth: []
      responses:
        "200":
          description: Widgets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /health:
    get:
      operationId: system_health
      x-fern-sdk-group-name: system
      x-fern-sdk-method-name: health
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
      required:
        - access_token
        - expires_in
