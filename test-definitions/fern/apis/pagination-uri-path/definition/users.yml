types:
  User:
    properties:
      name: string
      id: integer

  ListUsersUriPaginationResponse:
    properties:
      data: list<User>
      next: optional<string>

  ListUsersPathPaginationResponse:
    properties:
      data: list<User>
      next: optional<string>

service:
  auth: false
  base-path: /users
  endpoints:
    listWithUriPagination:
      pagination:
        next_uri: $response.next
        results: $response.data
      method: GET
      path: /uri
      response: ListUsersUriPaginationResponse
      examples:
        - name: WithNextPage
          response:
            body:
              data:
                - name: "Alice"
                  id: 1
                - name: "Bob"
                  id: 2
              next: "next"
        - name: WithoutNextPage
          response:
            body:
              data:
                - name: "Alice"
                  id: 1
                - name: "Bob"
                  id: 2
              next: ""

    listWithPathPagination:
      pagination:
        next_path: $response.next
        results: $response.data
      method: GET
      path: /path
      response: ListUsersPathPaginationResponse
      examples:
        - name: WithNextPage
          response:
            body:
              data:
                - name: "Alice"
                  id: 1
                - name: "Bob"
                  id: 2
              next: "next"
        - name: WithoutNextPage
          response:
            body:
              data:
                - name: "Alice"
                  id: 1
                - name: "Bob"
                  id: 2
              next: ""
