# `optional: true` on a referenced body says the *call* may omit the body, which the IR carries as
# `required: false` on the request body reference. The body type itself is untouched, so these
# endpoints pin that the generated parameter is driven by omittability rather than by `optional<T>`.
service:
  base-path: /refunds
  auth: false
  endpoints:
    # positional path parameter plus an omittable body: `refund(id, request?)`
    refund:
      docs: Refund a payment, optionally with a partial amount.
      method: POST
      path: /{id}
      path-parameters:
        id: string
      request:
        body:
          type: RefundRequest
          optional: true
      response: Refund
      examples:
        # a user-specified example that leaves the body out, which stays renderable because the
        # generated call takes the body as an optional parameter
        - name: Full refund
          path-parameters:
            id: refund-id
          response:
            body:
              id: refund-id
        - name: Split refund
          path-parameters:
            id: refund-id
          request:
            amount: 60
          response:
            body:
              id: refund-id
              amount: 60

    # no other request properties, so the body is the only parameter: `bulkRefund(request?)`
    bulkRefund:
      docs: Refund every payment, optionally with a partial amount.
      method: POST
      path: ""
      request:
        body:
          type: RefundRequest
          optional: true
      response: list<Refund>

    # an omittable body alongside a header, so the body lands in the request wrapper
    refundWithHeader:
      docs: Refund a payment, passing the body alongside a header.
      method: POST
      path: /with-header
      request:
        name: RefundWithHeaderRequest
        headers:
          X-Idempotency-Key: optional<string>
        body:
          type: RefundRequest
          optional: true
      response: Refund

    # baseline: a required body keeps the parameter required
    requiredRefund:
      docs: Refund a payment, always with an amount.
      method: POST
      path: /{id}/required
      path-parameters:
        id: string
      request:
        body: RefundRequest
      response: Refund

types:
  RefundRequest:
    properties:
      amount: optional<double>

  Refund:
    properties:
      id: string
      amount: optional<double>
