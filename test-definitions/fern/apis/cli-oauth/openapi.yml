openapi: 3.0.3
info:
  title: OAuth Test API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /token:
    post:
      operationId: auth_getToken
      x-fern-sdk-group-name: auth
      x-fern-sdk-method-name: getToken
      summary: Exchange client credentials for an access token
      security: []
      parameters:
        - name: audience
          in: query
          required: false
          schema:
            type: string
            enum:
              - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                scopes:
                  type: string
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                tenant:
                  type: string
                optional_hint:
                  type: string
              required:
                - client_id
                - client_secret
                - scopes
                - grant_type
                - tenant
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /refresh:
    post:
      operationId: auth_refreshToken
      x-fern-sdk-group-name: auth
      x-fern-sdk-method-name: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                grant_type:
                  type: string
                  enum:
                    - refresh_token
              required:
                - refresh_token
                - grant_type
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /health:
    get:
      operationId: health
      x-fern-sdk-group-name: system
      x-fern-sdk-method-name: health
      security: []
      responses:
        "200":
          description: Healthy
  /pets:
    get:
      operationId: pets_list
      x-fern-sdk-group-name: pets
      x-fern-sdk-method-name: list
      summary: List pets
      security:
        - OAuth2:
            - read:pets
      responses:
        "200":
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.com/token
          scopes:
            read:pets: Read pets
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
      required:
        - access_token
        - expires_in
