openapi: 3.0.3
info:
  title: OAuth Test API
  version: 1.0.0
servers:
  - url: https://api.example.com
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            read:pets: Read pets
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Healthy
  /pets:
    get:
      operationId: listPets
      security:
        - OAuth2:
            - read:pets
      responses:
        "200":
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
