service:
  auth: false
  base-path: /
  endpoints:
    # Multipart file upload with binary (audio) response and query params
    # Mirrors ElevenLabs speech-to-speech: multipart audio in -> binary audio out
    convertAudio:
      path: /audio/convert
      method: POST
      request:
        name: ConvertAudioRequest
        query-parameters:
          enable_logging: optional<boolean>
          optimize_streaming_latency: optional<integer>
          output_format: string
        body:
          properties:
            audio: file
            model_id: optional<string>
      response: file

    # Multipart file upload with binary response (no query params)
    isolateAudio:
      path: /audio/isolate
      method: POST
      request:
        name: IsolateAudioRequest
        body:
          properties:
            audio: file
      response: file

    # Multipart file upload with JSON response (existing pattern, should still work)
    transcribeAudio:
      path: /audio/transcribe
      method: POST
      request:
        name: TranscribeAudioRequest
        query-parameters:
          language: optional<string>
        body:
          properties:
            audio: file
            model_id: optional<string>
      response: TranscriptionResult

    # Reproduces ElevenLabs shape: file-upload endpoint whose naive type name
    # ("SpeechToSpeechRequest") collides with a declared schema type.
    # The file-upload envelope gets collision-resolved to a different name,
    # so getRequestTypeName(endpoint) != getFileUploadRequestTypeName(endpoint.id).
    # Bug B: without the fix, the endpoint binds to the declared type (no query fields) → E0609.
    speechToSpeech:
      path: /speech-to-speech/convert
      method: POST
      request:
        name: SpeechToSpeechRequest
        query-parameters:
          enable_logging: optional<boolean>
          optimize_streaming_latency: optional<integer>
          output_format: string
        body:
          properties:
            audio: file
            model_id: optional<string>
      response: file

    # Non-file endpoint to force snippet generation
    simple:
      path: "/snippet"
      method: POST

types:
  TranscriptionResult:
    properties:
      text: string
      language: optional<string>

  # Declared type that collides with the speechToSpeech endpoint's file-upload
  # request type name. This forces the file-upload envelope to get a different
  # collision-resolved name, reproducing the ElevenLabs Bug B scenario.
  SpeechToSpeechRequest:
    properties:
      audio_data: string
      model_id: optional<string>
