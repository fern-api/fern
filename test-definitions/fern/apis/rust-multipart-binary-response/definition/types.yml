# Declared type that collides with the speechToSpeech endpoint's file-upload
# request type name. This forces the file-upload envelope to get a different
# collision-resolved name, reproducing the ElevenLabs Bug B scenario.
# (Must be in a separate file from the endpoint to pass fern check, but
# the Rust generator's global collision resolution still triggers.)
types:
  SpeechToSpeechRequest:
    properties:
      audio_data: string
      model_id: optional<string>
