types:
  BucketRegion:
    enum:
      - us-east
      - eu-west

service:
  auth: false
  base-path: ""
  endpoints:
    uploadWithPathParam:
      docs: |-
        Bytes endpoint with required path parameters whose only example supplies no
        path-parameter values (autogenerated examples are skipped for bytes bodies). The
        generated example must still pass a value of the declared type for every path
        parameter instead of omitting it or passing `undefined`; a parameter with a client
        default is rendered with that default.
      path: /upload-content/{tenantId}/{objectPath}/{revision}/{uploadedAt}/{region}
      method: POST
      path-parameters:
        tenantId:
          type: string
          client-default: acme
        objectPath:
          type: string
          validation:
            minLength: 1
        revision: long
        uploadedAt: datetime
        region: BucketRegion
      request:
        content-type: "application/octet-stream"
        body: bytes
      examples:
        - {}
