# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
groups:
  csharp-sdk:
    generators:
      - name: fernapi/fern-csharp-sdk
        version: latest
        ir-version: v67
        output:
          location: local-file-system
          path: ../generated/csharp
  go-sdk:
    generators:
      - name: fernapi/fern-go-sdk
        version: latest
        ir-version: v67
        github:
          token: ${GITHUB_TOKEN}
          mode: push
          uri: fern-api/go-sdk-tests
          branch: server-sent-events-resumable
