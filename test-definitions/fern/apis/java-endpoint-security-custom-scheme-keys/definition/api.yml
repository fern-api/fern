# yaml-language-server: $schema=../../../../../api-yml.schema.json

imports:
  token: token.yml

name: java-endpoint-security-custom-scheme-keys

# Regression fixture for endpoint-security auth schemes whose keys differ from the scheme
# type (e.g. `sellerAuth` instead of `OAuth`). The generated RoutingAuthProvider must register
# each provider under the scheme key that the endpoint metadata references.
auth:
  endpoint-security: {}

auth-schemes:
  sellerAuth:
    scheme: oauth
    type: client-credentials
    client-id-env: MY_CLIENT_ID
    client-secret-env: MY_CLIENT_SECRET
    get-token:
      endpoint: token.getToken
      response-properties:
        access-token: $response.access_token
        expires-in: $response.expires_in
  tokenAuth:
    scheme: bearer
    token:
      env: MY_TOKEN
  passwordAuth:
    scheme: basic
    username:
      env: MY_USERNAME
    password:
      env: MY_PASSWORD
