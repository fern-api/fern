# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
auth-schemes:
  OAuth:
    scheme: oauth
    type: client-credentials
    get-token:
      endpoint: oauth::POST /oauth/token
      request-properties:
        client-id: $request.client_id
        client-secret: $request.client_secret
      response-properties:
        access-token: $response.access_token
        expires-in: $response.expires_in

api:
  auth: OAuth
  specs:
    - openapi: ./oauth-api.yml
      namespace: oauth
      settings:
        respect-per-spec-base-path: true
    - openapi: ./main-api.yml
      settings:
        respect-per-spec-base-path: true

groups:
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: latest
  ts-sdk:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: latest
