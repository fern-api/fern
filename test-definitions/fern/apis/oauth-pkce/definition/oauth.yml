imports:
  root: __package__.yml

service:
  auth: false
  base-path: ""
  endpoints:
    authorize:
      docs: |
        Authorization-code grant with PKCE. `response_type` is a required literal that is
        hardcoded by the generated method; `code_challenge_method` is an optional literal
        that must still be sent on the wire when provided.
      path: /oauth/authorize
      method: GET
      request:
        name: AuthorizeRequest
        query-parameters:
          response_type: literal<"code">
          client_id: string
          redirect_uri: string
          code_challenge: string
          code_challenge_method: optional<literal<"S256">>
          scope: optional<string>
          state: optional<string>
      response: root.AuthorizeResponse
      examples:
        - query-parameters:
            response_type: "code"
            client_id: "client_abc123"
            redirect_uri: "https://example.com/callback"
            code_challenge: "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"
            code_challenge_method: "S256"
            scope: "read write"
            state: "xyz"
          response:
            body:
              code: "auth_code_xyz"
              state: "xyz"
