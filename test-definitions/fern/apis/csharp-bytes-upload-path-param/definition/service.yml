types:
  BucketRegion:
    enum:
      - value: us-east
        name: UsEast
      - value: eu-west
        name: EuWest

service:
  auth: false
  base-path: ""
  endpoints:
    uploadWithPathParam:
      docs: |-
        Bytes endpoint with required path parameters whose only example supplies no
        path-parameter values (autogenerated examples are skipped for bytes bodies). The
        generated example must still pass a value of the declared type for every path
        parameter instead of omitting it or passing `undefined`. A parameter with a client
        default is left out of the example, since the client supplies it.
      path: /upload-content/{tenantId}/{objectPath}/{revision}/{uploadedAt}/{region}
      method: POST
      path-parameters:
        tenantId:
          type: string
          client-default: acme
        objectPath:
          type: string
          validation:
            minLength: 1
        revision: long
        uploadedAt: datetime
        region: BucketRegion
      request:
        content-type: "application/octet-stream"
        body: bytes
      examples:
        - name: Curl example
          code-samples:
            - sdk: curl
              code: |
                curl -X POST https://api.example.com/upload-content/acme/path/to/object.txt/1/2026-01-01T00:00:00Z/us-east \
                  --data-binary "@path/to/file"
    updateMetadataWithPathParam:
      docs: |-
        Endpoint with a request wrapper carrying the path parameters. Its second example
        supplies no path-parameter values, so the generated example must still populate every
        path parameter the wrapper carries (`inline-path-parameters`).
      path: /upload-content/{tenantId}/{objectPath}/metadata
      method: POST
      request:
        name: UpdateMetadataRequest
        path-parameters:
          tenantId:
            type: string
            client-default: acme
          objectPath: string
        query-parameters:
          label: optional<string>
      examples:
        - name: Complete example
          path-parameters:
            tenantId: acme
            objectPath: path/to/object.txt
          query-parameters:
            label: primary
        - name: Curl example
          code-samples:
            - sdk: curl
              code: |
                curl -X POST "https://api.example.com/upload-content/acme/path/to/object.txt/metadata?label=primary"
