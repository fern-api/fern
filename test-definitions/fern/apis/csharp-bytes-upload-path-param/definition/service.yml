service:
  auth: false
  base-path: ""
  endpoints:
    uploadWithPathParam:
      docs: |-
        Bytes endpoint with a required path parameter whose only example supplies no
        path-parameter values (autogenerated examples are skipped for bytes bodies). The
        generated example must still pass a value of the declared type for the path
        parameter instead of omitting it or passing `undefined`.
      path: /upload-content/{objectPath}
      method: POST
      path-parameters:
        objectPath: string
      request:
        content-type: "application/octet-stream"
        body: bytes
      examples:
        - {}
