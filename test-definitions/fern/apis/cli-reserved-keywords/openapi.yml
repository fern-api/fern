openapi: 3.0.0
info:
  title: Reserved Keyword CLI
  version: 1.0.0
# Regression guard for reserved-keyword escaping in generated Rust. The
# `CreatedBy` enum's `self` value PascalCases to `Self` — a Rust keyword —
# which must be escaped (to `Self_`) in the embedded types crate, or the whole
# CLI fails to `cargo build`. Because the wire test compiles the entire
# generated crate (types + sdk) before running, this fixture turns that
# class of bug into a CI failure at `cargo test` time instead of a customer
# hitting it at `cargo build`. See fern-api/fern#17183.
#
# `PaginationMetadata` covers the same class of bug for property names: `self`
# and `crate` cannot be raw identifiers in Rust (`pub r#self: String` is a
# compile error), so they must be mangled and given an explicit serde rename.
# `type` and `move` stay raw identifiers, which serde handles natively.
paths:
  /models/{model_id}:
    get:
      operationId: getModel
      x-fern-sdk-group-name: models
      x-fern-sdk-method-name: get
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
  /models:
    get:
      operationId: listModels
      x-fern-sdk-group-name: models
      x-fern-sdk-method-name: list
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPage"
  /models/events:
    get:
      operationId: listModelEvents
      x-fern-sdk-group-name: models
      x-fern-sdk-method-name: listEvents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelEvent"
components:
  schemas:
    Model:
      type: object
      properties:
        id:
          type: string
        created_by:
          $ref: "#/components/schemas/CreatedBy"
    ModelPage:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        meta:
          $ref: "#/components/schemas/PaginationMetadata"
    PaginationMetadata:
      type: object
      properties:
        next:
          type: string
        self:
          type: string
        crate:
          type: string
        type:
          type: string
        move:
          type: string
      required:
        - self
    # Discriminated unions carry shared properties as union base properties, which
    # the Rust generator emits through a separate code path from object fields.
    ModelEvent:
      type: object
      properties:
        self:
          type: string
      required:
        - self
      discriminator:
        propertyName: event_type
        mapping:
          created: "#/components/schemas/ModelCreatedEvent"
          deleted: "#/components/schemas/ModelDeletedEvent"
      oneOf:
        - $ref: "#/components/schemas/ModelCreatedEvent"
        - $ref: "#/components/schemas/ModelDeletedEvent"
    ModelCreatedEvent:
      type: object
      properties:
        model:
          $ref: "#/components/schemas/Model"
    ModelDeletedEvent:
      type: object
      properties:
        deleted_at:
          type: string
          format: date-time
    CreatedBy:
      type: string
      enum:
        - self
        - user
        - api
